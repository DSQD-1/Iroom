<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>IRoom — Админ-панель</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/admin.css" />
</head>

<body>

  <!-- LOADING -->
  <div id="loadingScreen" class="loading-screen">
    <div class="loading-logo">
      <span class="pink">IR</span><span>oom</span>
    </div>

    <p>Проверяем доступ...</p>

    <div class="loader"></div>
  </div>


  <!-- ACCESS DENIED -->
  <div id="deniedScreen" class="denied-screen hidden">

    <div class="denied-icon">
      !
    </div>

    <h1>Нет доступа</h1>

    <p id="deniedText">
      У вас нет доступа к админ-панели.
    </p>

    <button
      id="closeDeniedButton"
      class="primary-button"
      type="button"
    >
      Закрыть
    </button>

  </div>


  <!-- ADMIN CONTENT -->
  <main id="adminContent" class="admin-main hidden">

    <!-- HEADER -->
    <header class="admin-header">

      <button
        id="closeAdminButton"
        class="header-button"
        type="button"
        aria-label="Назад"
      >
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </button>

      <button
        id="adminLogo"
        class="admin-logo"
        type="button"
        aria-label="IRoom"
      >
        <span class="pink">IR</span><span>oom</span>
      </button>

      <div class="header-label">
        АДМИН
      </div>

    </header>


    <!-- STATS -->
    <section class="stats-grid">

      <div class="stat-card">
        <span class="stat-label">Товары</span>
        <strong id="totalProducts">0</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Новинки</span>
        <strong id="totalNew">0</strong>
      </div>

      <div class="stat-card">
        <span class="stat-label">Категории</span>
        <strong id="totalCategories">0</strong>
      </div>

    </section>


    <!-- TABS -->
    <nav class="tabs">

      <button
        id="productsTab"
        class="tab active"
        type="button"
      >
        Товары
      </button>

      <button
        id="categoriesTab"
        class="tab"
        type="button"
      >
        Категории
      </button>

    </nav>


    <!-- PRODUCTS -->
    <section id="productsContent" class="tab-content">

      <div class="section-title-row">

        <div>
          <h2>Товары</h2>
          <p>Управление товарами магазина</p>
        </div>

        <button
          id="addProductButton"
          class="primary-button small"
          type="button"
        >
          + Товар
        </button>

      </div>

      <div id="productsList" class="items-list"></div>

    </section>


    <!-- CATEGORIES -->
    <section
      id="categoriesContent"
      class="tab-content hidden"
    >

      <div class="section-title-row">

        <div>
          <h2>Категории</h2>
          <p>Разделы каталога IRoom</p>
        </div>

        <button
          id="addCategoryButton"
          class="primary-button small"
          type="button"
        >
          + Категория
        </button>

      </div>

      <div id="categoriesList" class="items-list"></div>

    </section>

  </main>


  <!-- PRODUCT MODAL -->
  <div
    id="productModal"
    class="modal hidden"
  >

    <div
      class="modal-overlay"
      data-close-product
    ></div>

    <div class="modal-sheet">

      <!-- MODAL HEADER -->
      <div class="modal-header">

        <div>
          <h2 id="productModalTitle">
            Новый товар
          </h2>

          <p>
            Информация о товаре
          </p>
        </div>

        <button
          class="modal-close"
          id="closeProductModalButton"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>

      </div>


      <!-- MODAL BODY -->
      <div class="modal-body">

        <!-- PHOTO -->
        <div class="photo-section">

          <div
            id="productImagePreview"
            class="image-preview empty"
          >
            <span>Нет фото</span>
          </div>

          <input
            id="productImageInput"
            type="file"
            accept="image/*"
            hidden
          />

          <div
            id="productImageActions"
            class="photo-actions"
          >

            <button
              id="chooseImageButton"
              class="secondary-button"
              type="button"
            >
              Выбрать фото
            </button>

            <button
              id="cancelImageButton"
              class="secondary-button"
              type="button"
            >
              Отмена
            </button>

            <button
              id="deleteImageButton"
              class="danger-button hidden"
              type="button"
            >
              Удалить фото
            </button>

          </div>

        </div>


        <!-- PRODUCT FORM -->
        <div class="form-grid">

          <label>
            <span>Название</span>

            <input
              id="productName"
              type="text"
              placeholder="Например, iPhone 17 Pro Max"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Память</span>

            <input
              id="productMemory"
              type="text"
              placeholder="Например, 512GB"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Цвет</span>

            <input
              id="productColor"
              type="text"
              placeholder="Например, Orange"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Версия</span>

            <input
              id="productVersion"
              type="text"
              placeholder="Например, eSIM"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Цена</span>

            <input
              id="productPrice"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="100000"
            />
          </label>


          <label>
            <span>Категория</span>

            <select id="productCategory">
              <option value="">
                Выберите категорию
              </option>
            </select>
          </label>

        </div>


        <!-- NEW SORT ORDER -->
        <div
          id="newOrderRow"
          class="sort-row hidden"
        >

          <label>
            <span>Позиция в «Новинках»</span>

            <input
              id="productNewOrder"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="1"
            />
          </label>

        </div>


        <!-- SWITCHES -->
        <div class="switch-card">

          <label class="switch-row">

            <div>
              <strong>Новинка</strong>

              <small>
                Показывать товар в блоке «Новинки»
              </small>
            </div>

            <input
              id="productIsNew"
              type="checkbox"
            />

            <span class="switch"></span>

          </label>


          <label class="switch-row">

            <div>
              <strong>Товар активен</strong>

              <small>
                Показывать товар в каталоге
              </small>
            </div>

            <input
              id="productActive"
              type="checkbox"
            />

            <span class="switch"></span>

          </label>

        </div>


        <!-- ACTIONS -->
        <div class="photo-actions">

          <button
            id="saveProductButton"
            class="primary-button full save-button"
            type="button"
          >
            Сохранить товар
          </button>

          <button
            id="deleteProductButton"
            class="danger-button full hidden"
            type="button"
          >
            Удалить товар
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- CATEGORY MODAL -->
  <div
    id="categoryModal"
    class="modal hidden"
  >

    <div
      class="modal-overlay"
      data-close-category
    ></div>

    <div class="modal-sheet">

      <!-- HEADER -->
      <div class="modal-header">

        <div>
          <h2 id="categoryModalTitle">
            Новая категория
          </h2>

          <p>
            Настройка категории каталога
          </p>
        </div>

        <button
          class="modal-close"
          id="closeCategoryModalButton"
          type="button"
          aria-label="Закрыть"
        >
          ×
        </button>

      </div>


      <!-- BODY -->
      <div class="modal-body">

        <div class="form-grid">

          <label>
            <span>Название</span>

            <input
              id="categoryName"
              type="text"
              placeholder="Например, iPhone"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Slug</span>

            <input
              id="categorySlug"
              type="text"
              placeholder="iphone"
              autocomplete="off"
            />
          </label>


          <label>
            <span>Позиция</span>

            <input
              id="categorySortOrder"
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              placeholder="1"
            />
          </label>

        </div>


        <!-- ACTIVE -->
        <div class="switch-card">

          <label class="switch-row">

            <div>
              <strong>Категория активна</strong>

              <small>
                Показывать категорию в магазине
              </small>
            </div>

            <input
              id="categoryActive"
              type="checkbox"
            />

            <span class="switch"></span>

          </label>

        </div>


        <!-- ACTIONS -->
        <div class="photo-actions">

          <button
            id="saveCategoryButton"
            class="primary-button full save-button"
            type="button"
          >
            Сохранить категорию
          </button>

          <button
            id="deleteCategoryButton"
            class="danger-button full hidden"
            type="button"
          >
            Удалить категорию
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast hidden"
  ></div>


  <script src="/admin.js"></script>

</body>
</html>
