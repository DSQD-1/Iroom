<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>IRoom — Admin</title>

<style>
:root{
  --bg:#050505;
  --panel:#101012;
  --panel2:#151518;
  --line:rgba(255,255,255,.08);
  --text:#f7f7f8;
  --muted:#8c8c95;
  --pink:#ff2d8d;
  --pink2:#ff4da5;
  --green:#39d98a;
  --red:#ff6868;
  --ease:cubic-bezier(.22,.8,.25,1)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  border:0;
  color:inherit;
  cursor:pointer
}

body{
  min-height:100vh
}

.app{
  max-width:1180px;
  margin:auto;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom))
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}

.brand{
  font-size:22px;
  font-weight:850;
  letter-spacing:-.7px
}

.brand b,
.brand span{
  color:var(--pink)
}

.top-actions{
  display:flex;
  gap:8px
}

.btn{
  min-height:42px;
  padding:0 15px;
  border-radius:14px;
  background:#18181b;
  color:#ddd;
  border:1px solid var(--line);
  font-weight:750
}

.btn.primary{
  background:linear-gradient(135deg,#ff2d8d,#ff4da5);
  color:#fff;
  border:0
}

.btn.danger{
  color:#ff8585
}

.btn:active{
  transform:scale(.97)
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:14px
}

.tab{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:13px;
  background:#0e0e10;
  color:#888;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750
}

.tab.active{
  background:rgba(255,45,141,.13);
  border-color:rgba(255,45,141,.3);
  color:#ff70ad
}

.panel{
  background:linear-gradient(180deg,#111113,#0d0d0f);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.2)
}

.panel h2{
  margin:0 0 13px;
  font-size:16px
}

.muted{
  color:var(--muted);
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field.full{
  grid-column:1/-1
}

.field label{
  font-size:10px;
  color:#777780;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#09090b;
  color:#fff;
  border-radius:13px;
  padding:12px;
  font-size:13px
}

.field textarea{
  min-height:90px;
  resize:vertical
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#bbb
}

.check input{
  accent-color:var(--pink)
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.media-pick{
  position:relative;
  border:1px dashed rgba(255,255,255,.14);
  background:#09090b;
  border-radius:17px;
  padding:16px;
  text-align:center;
  color:#aaa
}

.media-pick input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0
}

.media-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px
}

.media-item{
  position:relative;
  aspect-ratio:1;
  background:#08080a;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line)
}

.media-item img,
.media-item video{
  width:100%;
  height:100%;
  object-fit:contain
}

.media-item .x{
  position:absolute;
  right:5px;
  top:5px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff
}

.cards{
  display:grid;
  gap:9px
}

.item{
  padding:13px;
  border:1px solid var(--line);
  background:#0a0a0c;
  border-radius:16px
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.item-title{
  font-weight:800
}

.pill{
  font-size:10px;
  border-radius:99px;
  padding:5px 8px;
  background:#19191c;
  color:#aaa
}

.pill.pending{
  color:#ffc06b
}

.pill.wait{
  color:#ffad52
}

.pill.ok{
  color:#56df9c
}

.pill.bad{
  color:#ff7777
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  color:#aaa;
  font-size:12px
}

.row strong{
  color:#eee;
  text-align:right
}

.empty{
  padding:28px;
  text-align:center;
  color:#777
}

.login{
  min-height:80vh;
  display:flex;
  align-items:center;
  justify-content:center
}

.login .panel{
  width:min(440px,100%);
  text-align:center
}

.hidden{
  display:none!important
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#19191d;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:14px;
  font-size:12px;
  z-index:99;
  transition:.3s var(--ease)
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.order-media{
  width:56px;
  height:56px;
  object-fit:contain;
  background:transparent;
  border-radius:10px
}

.order{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px
}

.order-main{
  min-width:0
}

.option-groups{
  display:grid;
  gap:12px;
  margin-top:2px
}

.option-group{
  padding:13px;
  border:1px solid var(--line);
  background:#09090b;
  border-radius:16px
}

.option-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px
}

.option-group-title{
  font-size:12px;
  font-weight:800
}

.option-group-sub{
  font-size:10px;
  color:#666
}

.option-add{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px 42px;
  gap:7px
}

.option-add input{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#101012;
  color:#fff;
  border-radius:11px;
  padding:10px;
  font-size:13px
}

.option-add input[type=number]{
  text-align:right
}

.option-add button{
  border:0;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800
}

.option-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:9px
}

.option-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:0 8px 0 11px;
  border:1px solid rgba(255,45,141,.24);
  border-radius:10px;
  background:rgba(255,45,141,.08);
  color:#eee;
  font-size:11px
}

.option-chip small{
  color:#ff77b1
}

.option-chip button{
  width:20px;
  height:20px;
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:#aaa;
  padding:0
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .app{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    align-items:flex-start
  }

  .brand{
    font-size:19px
  }

  .top-actions .btn{
    padding:0 11px
  }

  .media-list{
    grid-template-columns:repeat(3,1fr)
  }

  .option-add{
    grid-template-columns:minmax(0,1fr) 85px 42px
  }
}
</style>
</head>

<body>

<div id="login" class="login hidden">
  <div class="panel">
    <div class="brand">
      IR<span>oom</span>
      <small style="color:#777">ADMIN</small>
    </div>

    <p class="muted">
      Откройте админ-панель из Telegram.
    </p>
  </div>
</div>

<div id="app" class="app hidden">

  <header class="top">

    <div class="brand">
      IR<span>oom</span>
      <small style="color:#666;font-size:10px">
        ADMIN
      </small>
    </div>

    <div class="top-actions">
      <button class="btn" id="closeBtn">
        Закрыть
      </button>
    </div>

  </header>

  <nav class="tabs" id="tabs">

    <button
      class="tab active"
      data-tab="orders">
      Заказы
    </button>

    <button
      class="tab"
      data-tab="products">
      Товары
    </button>

    <button
      class="tab"
      data-tab="deposit">
      Залог
    </button>

    <button
      class="tab"
      data-tab="settings">
      Настройки
    </button>

  </nav>

  <main id="content"></main>

</div>

<div id="toast" class="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

(() => {

  const tg =
    window.Telegram?.WebApp || null;

  tg?.ready();
  tg?.expand();

  const ADMIN_IDS =
    new Set([
      "5082864281",
      "5975037118"
    ]);

  const state = {
    tab:"orders",
    orders:[],
    products:[],
    categories:[],
    cards:[],
    settings:{},
    media:[]
  };

  const $ =
    s => document.querySelector(s);

  const esc =
    v =>
      String(v ?? "")
        .replace(
          /[&<>"']/g,
          c =>
            ({
              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              "\"":"&quot;",
              "'":"&#039;"
            }[c])
        );

  const init =
    () =>
      String(
        tg?.initData || ""
      );

  const headers =
    () => ({
      "Content-Type":
        "application/json",
      "x-telegram-init-data":
        init()
    });

  function toast(text){

    const e =
      $("#toast");

    e.textContent =
      text;

    e.classList.add("show");

    clearTimeout(
      window.__toast
    );

    window.__toast =
      setTimeout(
        () =>
          e.classList.remove(
            "show"
          ),
        2600
      );
  }

  async function api(
    url,
    opt={}
  ){

    const r =
      await fetch(
        url,
        {
          ...opt,
          headers:{
            ...headers(),
            ...(opt.headers || {})
          }
        }
      );

    let d = {};

    try{
      d = await r.json();
    }catch{}

    if(!r.ok){

      throw new Error(
        d.error ||
        "Ошибка запроса"
      );
    }

    return d;
  }

  function closeAdmin(){

    try{
      tg?.HapticFeedback
        ?.impactOccurred(
          "light"
        );
    }catch{}

    if(tg?.close){
      tg.close();
    }else{
      history.back();
    }
  }

  $("#closeBtn").onclick =
    closeAdmin;


  /* =========================================================
     UPLOAD
  ========================================================= */

  async function uploadFiles(files){

    for(
      const file of files
    ){

      const fd =
        new FormData();

      fd.append(
        "file",
        file
      );

      const r =
        await fetch(
          "/api/admin/upload",
          {
            method:"POST",
            headers:{
              "x-telegram-init-data":
                init()
            },
            body:fd
          }
        );

      let d={};

      try{
        d=await r.json();
      }catch{}

      if(!r.ok){

        throw new Error(
          d.error ||
          "Не удалось загрузить файл"
        );
      }

      state.media.push({
        url:d.url,
        type:
          file.type.startsWith(
            "video/"
          )
          ? "video"
          : "image"
      });
    }

    renderProductMedia();
  }


  function renderProductMedia(){

    const box =
      $("#mediaList");

    if(!box) return;

    box.innerHTML =
      state.media
        .map(
          (m,i) =>
            `
            <div class="media-item">

              ${
                m.type === "video"
                ?
                `
                <video
                  src="${esc(m.url)}"
                  muted
                  playsinline>
                </video>
                `
                :
                `
                <img
                  src="${esc(m.url)}"
                  alt="">
                `
              }

              <button
                class="x"
                data-remove-media="${i}">
                ×
              </button>

            </div>
            `
        )
        .join("")
        ||
        `
        <div class="muted">
          Файлы ещё не добавлены.
        </div>
        `;

    box
      .querySelectorAll(
        "[data-remove-media]"
      )
      .forEach(
        b =>
          b.onclick =
            () => {

              state.media.splice(
                Number(
                  b.dataset.removeMedia
                ),
                1
              );

              renderProductMedia();
            }
      );
  }


  /* =========================================================
     OPTIONS
  ========================================================= */

  const OPTION_GROUPS = [

    {
      key:"memories",
      label:"Память",
      placeholder:
        "Например, 256 ГБ"
    },

    {
      key:"colors",
      label:"Цвет",
      placeholder:
        "Например, Orange"
    },

    {
      key:"sims",
      label:"SIM",
