<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>IRoom Admin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: #888;
    }

    .app {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .brand span {
      color: #ff2b8a;
    }

    .close {
      width: 42px;
      height: 42px;
      border: 1px solid #222;
      border-radius: 14px;
      background: #0c0c0c;
      color: #fff;
      font-size: 24px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      border: 1px solid #222;
      background: #0b0b0b;
      color: #aaa;
      border-radius: 12px;
      padding: 11px 15px;
    }

    .tab.active {
      background: #ff2b8a;
      color: #fff;
      border-color: #ff2b8a;
    }

    .panel {
      background: #090909;
      border: 1px solid #1b1b1b;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #aaa;
      font-size: 13px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #252525;
      border-radius: 12px;
      outline: none;
      background: #050505;
      color: #fff;
      padding: 12px 13px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff2b8a;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 14px;
    }

    .btn {
      border: 1px solid #282828;
      border-radius: 12px;
      background: #101010;
      color: #fff;
      padding: 11px 15px;
    }

    .btn.primary {
      background: #ff2b8a;
      border-color: #ff2b8a;
    }

    .btn.danger {
      background: #2a0808;
      border-color: #4b1111;
      color: #ff7777;
    }

    .btn.small {
      padding: 8px 10px;
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(260px, 1fr)
        );
      gap: 12px;
    }

    .card {
      border: 1px solid #1d1d1d;
      border-radius: 16px;
      background: #050505;
      overflow: hidden;
    }

    .card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #101010;
      object-fit: cover;
    }

    .card-body {
      padding: 14px;
    }

    .card-title {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .card-price {
      color: #ff4b9b;
      font-weight: 700;
    }

    .card-meta {
      color: #888;
      font-size: 13px;
      margin-top: 7px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 11px 10px;
      border-bottom: 1px solid #1b1b1b;
      vertical-align: top;
    }

    th {
      color: #888;
      font-size: 12px;
      font-weight: 600;
    }

    td {
      font-size: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      background: #171717;
      color: #bbb;
      font-size: 12px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(170px, 1fr)
        );
      gap: 12px;
    }

    .stat {
      background: #050505;
      border: 1px solid #1d1d1d;
      border-radius: 16px;
      padding: 15px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 800;
      margin-top: 7px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, .75);
    }

    .modal-box {
      width: 100%;
      max-width: 720px;
      max-height: 92vh;
      overflow-y: auto;
      background: #0b0b0b;
      border: 1px solid #222;
      border-radius: 22px 22px 0 0;
      padding: 18px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .modal-close {
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 27px;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: #777;
    }

    .login {
      min-height: 80vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .login-box {
      max-width: 420px;
      padding: 25px;
      border: 1px solid #1d1d1d;
      border-radius: 20px;
      background: #090909;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      z-index: 3000;
      background: #fff;
      color: #000;
      border-radius: 12px;
      padding: 11px 16px;
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (min-width: 700px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-box {
        border-radius: 22px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div id="login" class="login hidden">
    <div class="login-box">
      <h2>IRoom Admin</h2>
      <p class="muted">
        Доступ только для администратора.
      </p>
    </div>
  </div>

  <div id="app" class="hidden">

    <header class="topbar">

      <div class="brand">
        <span>IR</span>oom Admin
      </div>

      <button
        id="closeBtn"
        class="close"
        type="button"
      >
        ×
      </button>

    </header>

    <nav class="tabs">

      <button
        class="tab active"
        data-tab="orders"
        type="button"
      >
        Заказы
      </button>

      <button
        class="tab"
        data-tab="products"
        type="button"
      >
        Товары
      </button>

      <button
        class="tab"
        data-tab="deposit"
        type="button"
      >
        Залог
      </button>

      <button
        class="tab"
        data-tab="settings"
        type="button"
      >
        Настройки
      </button>

    </nav>

    <main id="content"></main>

  </div>

</div>

<div id="toast" class="toast"></div>

<script src="/admin.js"></script>

</body>
</html>
