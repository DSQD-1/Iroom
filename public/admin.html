<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#050505">

<title>IRoom — Admin</title>

<style>
:root{
  --bg:#050505;
  --panel:#101012;
  --panel2:#151518;
  --line:rgba(255,255,255,.08);
  --text:#f7f7f8;
  --muted:#8c8c95;
  --pink:#ff2d8d;
  --pink2:#ff4da5;
  --green:#39d98a;
  --red:#ff6868;
  --orange:#ff9b45;
  --ease:cubic-bezier(.22,.8,.25,1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.app{
  max-width:1180px;
  margin:auto;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom));
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.brand{
  font-size:22px;
  font-weight:850;
  letter-spacing:-.7px;
}

.brand span{
  color:var(--pink);
}

.brand small{
  color:#666;
  font-size:10px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.btn{
  min-height:42px;
  padding:0 15px;
  border-radius:14px;
  background:#18181b;
  color:#ddd;
  border:1px solid var(--line);
  font-weight:750;
}

.btn.primary{
  background:
    linear-gradient(
      135deg,
      #ff2d8d,
      #ff4da5
    );
  color:#fff;
  border:0;
}

.btn.danger{
  color:#ff8585;
}

.btn.orange{
  color:#ffb36e;
}

.btn:active{
  transform:scale(.97);
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:14px;
}

.tab{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:13px;
  background:#0e0e10;
  color:#888;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750;
}

.tab.active{
  background:rgba(255,45,141,.13);
  border-color:rgba(255,45,141,.3);
  color:#ff70ad;
}

.panel{
  background:
    linear-gradient(
      180deg,
      #111113,
      #0d0d0f
    );
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.2);
}

.panel h2{
  margin:0 0 13px;
  font-size:16px;
}

.muted{
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:10px;
  color:#777780;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#09090b;
  color:#fff;
  border-radius:13px;
  padding:12px;
  font-size:13px;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#bbb;
}

.check input{
  accent-color:var(--pink);
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.cards{
  display:grid;
  gap:9px;
}

.item{
  padding:13px;
  border:1px solid var(--line);
  background:#0a0a0c;
  border-radius:16px;
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.item-title{
  font-weight:800;
}

.pill{
  font-size:10px;
  border-radius:99px;
  padding:5px 8px;
  background:#19191c;
  color:#aaa;
  white-space:nowrap;
}

.pill.pending{
  color:#ffc06b;
}

.pill.wait{
  color:#ffad52;
}

.pill.ok{
  color:#56df9c;
}

.pill.bad{
  color:#ff7777;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  color:#aaa;
  font-size:12px;
}

.row strong{
  color:#eee;
  text-align:right;
}

.empty{
  padding:28px;
  text-align:center;
  color:#777;
}

.hidden{
  display:none!important;
}

.login{
  min-height:80vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.login .panel{
  width:min(440px,100%);
  text-align:center;
}

.toast{
  position:fixed;
  left:50%;
  bottom:
    calc(
      18px +
      env(safe-area-inset-bottom)
    );
  transform:
    translate(
      -50%,
      20px
    );
  opacity:0;
  pointer-events:none;
  background:#19191d;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:14px;
  font-size:12px;
  z-index:999;
  transition:.3s var(--ease);
  max-width:90vw;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:
    translate(
      -50%,
      0
    );
}

/* ================================
   MEDIA
================================ */

.media-pick{
  position:relative;
  border:1px dashed rgba(255,255,255,.18);
  background:#09090b;
  border-radius:17px;
  padding:20px 16px;
  text-align:center;
  color:#aaa;
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.media-pick input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
}

.media-list{
  display:grid;
  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );
  gap:8px;
  margin-top:10px;
}

.media-item{
  position:relative;
  aspect-ratio:1;
  background:#08080a;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
}

.media-item img,
.media-item video{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.media-item .x{
  position:absolute;
  right:5px;
  top:5px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(0,0,0,.78);
  color:#fff;
  z-index:2;
}

.media-item .main{
  position:absolute;
  left:5px;
  bottom:5px;
  border-radius:8px;
  background:rgba(255,45,141,.9);
  color:#fff;
  font-size:9px;
  padding:5px 7px;
}

/* ================================
   OPTIONS
================================ */

.option-groups{
  display:grid;
  gap:12px;
  margin-top:2px;
}

.option-group{
  padding:13px;
  border:1px solid var(--line);
  background:#09090b;
  border-radius:16px;
}

.option-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
}

.option-group-title{
  font-size:12px;
  font-weight:800;
}

.option-group-sub{
  font-size:10px;
  color:#666;
}

.option-add{
  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    105px
    42px;
  gap:7px;
}

.option-add input{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#101012;
  color:#fff;
  border-radius:11px;
  padding:10px;
  font-size:13px;
}

.option-add input[type=number]{
  text-align:right;
}

.option-add button{
  border:0;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800;
}

.option-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:9px;
}

.option-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:
    0
    8px
    0
    11px;
  border:
    1px solid
    rgba(255,45,141,.24);
  border-radius:10px;
  background:
    rgba(255,45,141,.08);
  color:#eee;
  font-size:11px;
}

.option-chip small{
  color:#ff77b1;
}

.option-chip button{
  width:20px;
  height:20px;
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:#aaa;
  padding:0;
}

/* ================================
   SETTINGS
================================ */

.setting-title{
  font-size:11px;
  color:#666;
  margin-bottom:4px;
}

.save-state{
  margin-top:8px;
  font-size:11px;
  color:#777;
}

/* ================================
   MOBILE
================================ */

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .top{
    align-items:flex-start;
  }

  .brand{
    font-size:19px;
  }

  .top-actions .btn{
    padding:0 11px;
  }

  .media-list{
    grid-template-columns:
      repeat(
        3,
        minmax(0,1fr)
      );
  }

  .option-add{
    grid-template-columns:
      minmax(0,1fr)
      85px
      42px;
  }
}
</style>
</head>

<body>

<div id="login" class="login hidden">
  <div class="panel">
    <div class="brand">
      IR<span>oom</span>
      <small>ADMIN</small>
    </div>

    <p class="muted">
      Откройте админ-панель из Telegram.
    </p>
  </div>
</div>


<div id="app" class="app hidden">

  <header class="top">

    <div class="brand">
      IR<span>oom</span>
      <small>ADMIN</small>
    </div>

    <div class="top-actions">
      <button
        class="btn"
        id="closeBtn"
      >
        Закрыть
      </button>
    </div>

  </header>


  <nav
    class="tabs"
    id="tabs"
  >

    <button
      class="tab active"
      data-tab="orders"
    >
      Заказы
    </button>

    <button
      class="tab"
      data-tab="products"
    >
      Товары
    </button>

    <button
      class="tab"
      data-tab="deposit"
    >
      Залог
    </button>

    <button
      class="tab"
      data-tab="settings"
    >
      Настройки
    </button>

  </nav>


  <main id="content"></main>

</div>


<div
  id="toast"
  class="toast"
></div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>


<script>
(() => {

  /* ======================================================
     TELEGRAM
  ====================================================== */

  const tg =
    window.Telegram?.WebApp ||
    null;

  tg?.ready();
  tg?.expand();


  const ADMIN_IDS =
    new Set([
      "5082864281",
      "5975037118"
    ]);


  /* ======================================================
     STATE
  ====================================================== */

  const state = {
    tab: "orders",

    orders: [],

    products: [],

    categories: [],

    cards: [],

    settings: {},

    media: []
  };


  /* ======================================================
     HELPERS
  ====================================================== */

  const $ = selector =>
    document.querySelector(selector);


  const esc = value =>
    String(value ?? "")
      .replace(
        /[&<>"']/g,
        char =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            "\"":"&quot;",
            "'":"&#039;"
          })[char]
      );


  function getInitData(){

    return String(
      tg?.initData ||
      ""
    );

  }


  function baseHeaders(){

    return {
      "Content-Type":
        "application/json",

      "x-telegram-init-data":
        getInitData()
    };

  }


  function toast(message){

    const element =
      $("#toast");

    if(!element){
      return;
    }

    element.textContent =
      String(message || "");

    element.classList.add(
      "show"
    );

    clearTimeout(
      window.__toastTimer
    );

    window.__toastTimer =
      setTimeout(() => {

        element.classList.remove(
          "show"
        );

      }, 2800);

  }


  async function api(
    url,
    options = {}
  ){

    const response =
      await fetch(
        url,
        {
          ...options,

          headers:{
            ...baseHeaders(),

            ...(options.headers || {})
          }
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch{

      data = {};

    }


    if(!response.ok){

      const error =
        new Error(
          data?.error ||
          `HTTP ${response.status}`
        );

      error.status =
        response.status;

      error.url =
        url;

      throw error;

    }


    return data;

  }


  function closeAdmin(){

    try{

      tg?.HapticFeedback
        ?.impactOccurred("light");

    }catch{}

    if(tg?.close){

      tg.close();

    }else{

      history.back();

    }

  }


  $("#closeBtn").onclick =
    closeAdmin;



  /* ======================================================
     MEDIA
  ====================================================== */

  function normalizeMedia(value){

    if(
      Array.isArray(value)
    ){

      return value
        .map(item => {

          if(
            typeof item ===
            "string"
          ){

            return {
              url:item,
              type:
                /\.(mp4|webm|mov)(\?|$)/i
                  .test(item)
                  ? "video"
                  : "image"
            };

          }


          if(
            item &&
            typeof item ===
            "object"
          ){

            return {
              url:
                String(
                  item.url ||
                  ""
                ),

              type:
                item.type ===
                "video"
                  ? "video"
                  : "image"
            };

          }


          return null;

        })
        .filter(
          item =>
            item &&
            item.url
        );

    }


    return [];

  }


  function renderProductMedia(){

    const box =
      $("#mediaList");

    if(!box){
      return;
    }


    if(
      !state.media.length
    ){

      box.innerHTML = `
        <div
          class="muted"
          style="
            grid-column:1/-1;
            padding:12px;
          "
        >
          Фото или видео ещё не добавлены.
        </div>
      `;

      return;

    }


    box.innerHTML =
      state.media
        .map(
          (media,index) => {

            const isVideo =
              media.type ===
              "video";


            return `
              <div
                class="media-item"
              >

                ${
                  isVideo

                    ? `
                      <video
                        src="${esc(media.url)}"
                        muted
                        playsinline
                        controls
                      ></video>
                    `

                    : `
                      <img
                        src="${esc(media.url)}"
                        alt=""
                      >
                    `
                }


                <button
                  class="x"
                  type="button"
                  data-remove-media="${index}"
                >
                  ×
                </button>


                ${
                  index === 0
                    ? `
                      <div class="main">
                        ОСНОВНОЕ
                      </div>
                    `
                    : ""
                }

              </div>
            `;

          }
        )
        .join("");


    box
      .querySelectorAll(
        "[data-remove-media]"
      )
      .forEach(button => {

        button.onclick =
          () => {

            const index =
              Number(
                button.dataset
                  .removeMedia
              );

            state.media.splice(
              index,
              1
            );

            renderProductMedia();

          };

      });

  }


  async function uploadFiles(
    files
  ){

    if(
      !files ||
      !files.length
    ){

      return;

    }


    const validFiles =
      files.filter(file => {

        const isImage =
          file.type
            .startsWith(
              "image/"
            );

        const isVideo =
          [
            "video/mp4",
            "video/webm",
            "video/quicktime"
          ].includes(
            file.type
          );


        if(
          !isImage &&
          !isVideo
        ){

          toast(
            `Файл ${file.name} не поддерживается`
          );

          return false;

        }


        if(
          file.size >
          100 *
          1024 *
          1024
        ){

          toast(
            `${file.name}: максимум 100 МБ`
          );

          return false;

        }


        return true;

      });


    if(
      !validFiles.length
    ){

      return;

    }


    const input =
      $("#mediaInput");


    if(input){

      input.disabled =
        true;

    }


    try{

      for(
        const file
        of validFiles
      ){

        toast(
          `Загружаем ${file.name}...`
        );


        const formData =
          new FormData();

        formData.append(
          "file",
          file
        );


        const response =
          await fetch(
            "/api/admin/upload",
            {
              method:"POST",

              headers:{
                "x-telegram-init-data":
                  getInitData()
              },

              body:
                formData
            }
          );


        let data = {};

        try{

          data =
            await response.json();

        }catch{}


        if(
          !response.ok
        ){

          throw new Error(
            data?.error ||
            `Ошибка загрузки: HTTP ${response.status}`
          );

        }


        if(
          !data?.url
        ){

          throw new Error(
            "Сервер не вернул URL загруженного файла"
          );

        }


        state.media.push({
          url:
            String(
              data.url
            ),

          type:
            file.type
              .startsWith(
                "video/"
              )
              ? "video"
              : "image"
        });

      }


      renderProductMedia();

      toast(
        "Медиа успешно загружено"
      );


    }catch(error){

      console.error(
        "UPLOAD ERROR:",
        error
      );

      toast(
        error.message ||
        "Не удалось загрузить файл"
      );


    }finally{

      if(input){

        input.disabled =
          false;

        input.value =
          "";

      }

    }

  }



  /* ======================================================
     PRODUCT OPTIONS
  ====================================================== */

  const OPTION_GROUPS = [

    {
      key:"memories",
      label:"Память",
      placeholder:
        "Например, 256 ГБ"
    },

    {
      key:"colors",
      label:"Цвет",
      placeholder:
        "Например, Orange"
    },

    {
      key:"sims",
      label:"SIM",
      placeholder:
        "Например, eSIM"
    },

    {
      key:"regions",
      label:"Регион",
      placeholder:
        "Например, EU"
    }

  ];


  function safeParse(
    value,
    fallback
  ){

    if(
      value &&
      typeof value ===
      "object"
    ){

      return value;

    }


    try{

      return JSON.parse(
        value
      );

    }catch{

      return fallback;

    }

  }


  function normalizeAdminOptions(
    value
  ){

    const source =
      value &&
      typeof value ===
      "object"
        ? value
        : {};


    const result = {};


    for(
      const group
      of OPTION_GROUPS
    ){

      const raw =
        source[group.key] ||
        source[
          group.key.slice(
            0,
            -1
          )
        ];


      const arr =
        Array.isArray(raw)
          ? raw
          : [];


      result[group.key] =
        arr
          .map(item => {

            if(
              typeof item ===
              "string"
            ){

              return {
                name:item,
                surcharge:0
              };

            }


            return {

              name:
                String(
                  item?.name ||
                  item?.value ||
                  ""
                ).trim(),

              surcharge:
                Number(
                  item?.surcharge ??
                  item?.extra ??
                  item?.price ??
                  0
                ) || 0

            };

          })
          .filter(
            item =>
              item.name
          );

    }


    return result;

  }


  function renderOptionBuilder(
    options
  ){

    const box =
      $("#optionGroups");

    if(!box){
      return;
    }


    box.innerHTML =
      OPTION_GROUPS
        .map(group => {

          const items =
            options[
              group.key
            ] || [];


          return `

            <div
              class="option-group"
              data-option-group="${group.key}"
            >

              <div
                class="option-group-head"
              >

                <div>

                  <div
                    class="option-group-title"
                  >
                    ${group.label}
                  </div>

                  <div
                    class="option-group-sub"
                  >
                    Можно добавить несколько вариантов
                  </div>

                </div>

              </div>


              <div
                class="option-chips"
              >

                ${
                  items.length

                    ? items
                        .map(
                          (item,index) => `

                            <div
                              class="option-chip"
                            >

                              <span>
                                ${esc(item.name)}
                              </span>

                              ${
                                Number(
                                  item.surcharge
                                )

                                  ? `
                                    <small>
                                      +${Number(
                                        item.surcharge
                                      ).toLocaleString(
                                        "ru-RU"
                                      )} ₽
                                    </small>
                                  `

                                  : ""
                              }

                              <button
                                type="button"
                                data-option-remove="${group.key}:${index}"
                              >
                                ×
                              </button>

                            </div>

                          `
                        )
                        .join("")

                    : `
                      <span class="muted">
                        Пока ничего не добавлено
                      </span>
                    `
                }

              </div>


              <div
                class="option-add"
              >

                <input
                  data-option-name="${group.key}"
                  placeholder="${esc(
                    group.placeholder
                  )}"
                >

                <input
                  data-option-price="${group.key}"
                  type="number"
                  min="0"
                  value="0"
                  placeholder="+ цена"
                >

                <button
                  type="button"
                  data-option-add="${group.key}"
                >
                  +
                </button>

              </div>

            </div>

          `;

        })
        .join("");


    box
      .querySelectorAll(
        "[data-option-add]"
      )
      .forEach(button => {

        button.onclick =
          () => {

            const key =
              button.dataset
                .optionAdd;


            const nameInput =
              box.querySelector(
                `[data-option-name="${key}"]`
              );


            const priceInput =
              box.querySelector(
                `[data-option-price="${key}"]`
              );


            const name =
              nameInput
                ?.value
                .trim();


            if(!name){

              toast(
                "Введите название варианта"
              );

              return;

            }


            options[key].push({

              name,

              surcharge:
                Number(
                  priceInput?.value
                ) || 0

            });


            renderOptionBuilder(
              options
            );

          };

      });


    box
      .querySelectorAll(
        "[data-option-remove]"
      )
      .forEach(button => {

        button.onclick =
          () => {

            const parts =
              String(
                button.dataset
                  .optionRemove
              )
              .split(":");


            const key =
              parts[0];

            const index =
              Number(parts[1]);


            if(
              options[key]
            ){

              options[key].splice(
                index,
                1
              );

            }


            renderOptionBuilder(
              options
            );

          };

      });

  }

  function productForm(
    product = null
  ){

    state.media =
      normalizeMedia(
        safeParse(
          product?.images,
          []
        )
      );


    /*
      Если старый товар имеет
      только image_url, добавляем
      его в галерею.
    */

    if(
      product?.image_url &&
      !state.media.some(
        item =>
          item.url ===
          product.image_url
      )
    ){

      state.media.unshift({

        url:
          String(
            product.image_url
          ),

        type:
          /\.(mp4|webm|mov)(\?|$)/i
            .test(
              product.image_url
            )
            ? "video"
            : "image"

      });

    }


    const options =
      normalizeAdminOptions(
        safeParse(
          product?.price_options,
          {}
        )
      );


    $("#content").innerHTML = `

      <section class="panel">

        <h2>
          ${
            product
              ? "Редактирование товара"
              : "Новый товар"
          }
        </h2>


        <div class="grid">

          <div class="field full">

            <label>
              Название
            </label>

            <input
              id="pName"
              value="${esc(
                product?.name ||
                ""
              )}"
              placeholder="Например, iPhone 18 Pro Max"
            >

          </div>


          <div class="field">

            <label>
              Цена
            </label>

            <input
              id="pPrice"
              type="number"
              min="0"
              value="${Number(
                product?.price ||
                0
              )}"
            >

          </div>


          <div class="field">

            <label>
              Старая цена
            </label>

            <input
              id="pOld"
              type="number"
              min="0"
              value="${Number(
                product?.old_price ||
                0
              )}"
            >

          </div>


          <div class="field">

            <label>
              Категория
            </label>

            <select id="pCat">

              <option value="">
                Без категории
              </option>

              ${
                state.categories
                  .map(
                    category => `

                      <option
                        value="${category.id}"
                        ${
                          Number(
                            category.id
                          ) ===
                          Number(
                            product?.category_id
                          )
                            ? "selected"
                            : ""
                        }
                      >
                        ${esc(
                          category.name
                        )}
                      </option>

                    `
                  )
                  .join("")
              }

            </select>

          </div>


          <div class="field">

            <label>
              Основное изображение
            </label>

            <input
              id="pImage"
              value="${esc(
                product?.image_url ||
                ""
              )}"
              placeholder="Автоматически возьмётся первое фото"
            >

          </div>


          <div class="field full">

            <label>
              Описание
            </label>

            <textarea
              id="pDesc"
              placeholder="Описание товара"
            >${esc(
              product?.description ||
              ""
            )}</textarea>

          </div>


          <div class="field full">

            <label>
              Фото и видео из галереи
            </label>


            <div
              class="media-pick"
            >

              📷 Выбрать фото или видео из галереи

              <input
                id="mediaInput"
                type="file"
                accept="image/*,video/mp4,video/webm,video/quicktime"
                multiple
              >

            </div>


            <div
              id="mediaList"
              class="media-list"
            ></div>

          </div>


          <div class="field full">

            <label>
              Варианты товара
            </label>

            <div
              id="optionGroups"
              class="option-groups"
            ></div>

          </div>


          <label class="check">

            <input
              id="pNew"
              type="checkbox"
              ${
                product?.is_new
                  ? "checked"
                  : ""
              }
            >

            Новинка

          </label>

        </div>


        <div class="actions">

          <button
            class="btn primary"
            id="saveProduct"
          >
            ${
              product
                ? "Сохранить"
                : "Добавить товар"
            }
          </button>


          <button
            class="btn"
            id="cancelProduct"
          >
            Отмена
          </button>

        </div>

      </section>

    `;


    renderProductMedia();

    renderOptionBuilder(
      options
    );


    $("#mediaInput").onchange =
      event => {

        uploadFiles(
          Array.from(
            event.target.files ||
            []
          )
        );

      };


    $("#cancelProduct").onclick =
      () => {

        renderProducts();

      };


    $("#saveProduct").onclick =
      async () => {

        const button =
          $("#saveProduct");


        button.disabled =
          true;

        button.textContent =
          "Сохраняем...";


        try{

          const name =
            $("#pName")
              .value
              .trim();


          if(!name){

            throw new Error(
              "Введите название товара"
            );

          }


          const price =
            Number(
              $("#pPrice")
                .value
            ) || 0;


          if(price < 0){

            throw new Error(
              "Цена не может быть отрицательной"
            );

          }


          /*
            ВАЖНО:

            Сервер получает images
            как массив обычных URL,
            а не как объекты.
          */

          const imageUrls =
            state.media
              .map(
                item =>
                  String(
                    item?.url ||
                    ""
                  ).trim()
              )
              .filter(Boolean);


          let primaryImage =
            $("#pImage")
              .value
              .trim();


          if(
            !primaryImage &&
            imageUrls.length
          ){

            primaryImage =
              imageUrls[0];

          }


          const payload = {

            category_id:
              Number(
                $("#pCat")
                  .value
              ) || null,

            name,

            description:
              $("#pDesc")
                .value
                .trim(),

            price,

            old_price:
              Number(
                $("#pOld")
                  .value
              ) || 0,

            image_url:
              primaryImage,

            /*
              Только URL!
            */

            images:
              imageUrls,

            price_options:
              options,

            is_new:
              $("#pNew")
                .checked

          };


          console.log(
            "SAVE PRODUCT:",
            payload
          );


          const url =
            product

              ? `/api/admin/products/${product.id}`

              : "/api/admin/products";


          const method =
            product
              ? "PUT"
              : "POST";


          await api(
            url,
            {
              method,

              body:
                JSON.stringify(
                  payload
                )
            }
          );


          toast(
            "Товар сохранён"
          );


          await renderProducts();


        }catch(error){

          console.error(
            "SAVE PRODUCT ERROR:",
            error
          );


          toast(
            error.message ||
            "Ошибка сохранения"
          );


        }finally{

          if(
            $("#saveProduct")
          ){

            $("#saveProduct")
              .disabled =
              false;

            $("#saveProduct")
              .textContent =
              product
                ? "Сохранить"
                : "Добавить товар";

          }

        }

      };

  }

  async function renderProducts(){

    const [
      productsData,
      categoriesData
    ] = await Promise.all([

      api(

      ),

      api(

    ]);


    state.products =
      productsData.products ||
      [];


    state.categories =
      categoriesData.categories ||
      [];


    $("#content").innerHTML = `

      <section class="panel">

        <div
          class="top"
          style="margin:0"
        >

          <h2>
            Товары
          </h2>

            class="btn primary"

          </button>

        </div>

      </section>

        class="cards"
        id="productList"
      ></section>

    `;


    $("#newProduct").onclick =
      () => {

        productForm();

      };


    const list =
      $("#productList");


    list.innerHTML =
      state.products
        .map(
          product => {

            const images =
              normalizeMedia(
                safeParse(
                  product.images,
                  []
                )
              );


            return `

              <article
                class="item"
              >

                <div
                  class="item-head"
                >

                  <div>

                    <div
                      class="item-title"
                    >
                      ${esc(
                        product.name
                      )}
                    </div>

                    <div
                      class="muted"
                    >
                      ${Number(
                        product.price ||
                        0
                      ).toLocaleString(
                        "ru-RU"
                      )} ₽
                    </div>

                  </div>


                  <div
                    class="actions"
                    style="margin:0"
                  >

                    <button
                      class="btn"
                      data-edit="${product.id}"
                    >
                      Изменить
                    </button>


                    <button
                      class="btn danger"
                      data-del="${product.id}"
                    >
                      Удалить
                    </button>

                  </div>

                </div>


                <div
                  class="muted"
                  style="margin-top:8px"
                >
                  Медиа:
                  ${images.length}
                </div>

              </article>

            `;

          }
        )
        .join("")


      ||
      `
        <div class="empty">
          Товаров пока нет.
        </div>
      `;


    list
      .querySelectorAll(
        "[data-edit]"
      )
      .forEach(button => {

        button.onclick =
          () => {

            const product =
              state.products.find(
                item =>
                  Number(
                    item.id
                  ) ===
                  Number(
                    button.dataset
                      .edit
                  )
              );


            if(product){

              productForm(
                product
              );

            }

          };

      });


    list
      .querySelectorAll(
        "[data-del]"
      )
      .forEach(button => {

        button.onclick =
          async () => {

            if(
              !confirm(
                "Удалить товар?"
              )
            ){

              return;

            }


            try{

              await api(
                `/api/admin/products/${button.dataset.del}`,
                {
                  method:"DELETE"
                }
              );


              toast(
                "Товар удалён"
              );


              await renderProducts();


            }catch(error){

              toast(
                error.message
              );

            }

          };

      });

  }

          ${
            card?.is_default
              ? "checked"
              : ""
          }
        >

        Использовать по умолчанию

      </label>


      <div class="actions">

        <button
          class="btn primary"
          id="saveCard"
        >
          Сохранить
        </button>

        <button
          class="btn"
          id="cancelCard"
        >
          Отмена
        </button>

      </div>

    `;


    $("#content")
      .appendChild(
        wrap
      );


    wrap.querySelector(
      "#saveCard"
    ).onclick =
      async () => {

        try{

          const payload = {

            title:
              wrap.querySelector(
                "#cTitle"
              ).value,

            card_number:
              wrap.querySelector(
                "#cNum"
              ).value,

            recipient:
              wrap.querySelector(
                "#cRec"
              ).value,

            requisites:
              wrap.querySelector(
                "#cReq"
              ).value,

            amount:
              Number(
                wrap.querySelector(
                  "#cAmt"
                ).value
              ) || 0,

            active:
              wrap.querySelector(
                "#cActive"
              ).checked,

            is_default:
              wrap.querySelector(
                "#cDefault"
              ).checked

          };


          await api(

            card

              ? `/api/admin/reservation-cards/${card.id}`

              : "/api/admin/reservation-cards",

            {

              method:
                card
                  ? "PUT"
                  : "POST",

              body:
                JSON.stringify(
                  payload
                )

            }

          );


          toast(
            "Реквизиты сохранены"
          );


          await renderDeposit();


        }catch(error){

          toast(
            error.message
          );

        }

      };


    wrap.querySelector(
      "#cancelCard"
    ).onclick =
      () => {

        wrap.remove();

      };

  }



  function renderCards(){

    const box =
      $("#cardList");

    if(!box){
      return;
    }


    box.innerHTML =
      state.cards
        .map(
          card => `

            <article
              class="item"
            >

              <div
                class="item-head"
              >

                <div>

                  <div
                    class="item-title"
                  >
                    ${esc(
                      card.title ||
                      "Реквизиты"
                    )}
                  </div>

                  <div
                    class="muted"
                  >
                    ${esc(
                      card.card_number ||
                      card.requisites ||
                      "—"
                    )}
                  </div>

                </div>


                <span
                  class="pill ${
                    card.active
                      ? "ok"
                      : "bad"
                  }"
                >
                  ${
                    card.active
                      ? "Активно"
                      : "Выключено"
                  }
                </span>

              </div>


              <div class="row">

                <span>
                  Получатель
                </span>

                <strong>
                  ${esc(
                    card.recipient ||
                    "—"
                  )}
                </strong>

              </div>


              <div class="row">

                <span>
                  Залог
                </span>

                <strong>
                  ${Number(
                    card.amount ||
                    0
                  ).toLocaleString(
                    "ru-RU"
                  )} ₽
                </strong>

              </div>


              <div
                class="actions"
              >

                <button
                  class="btn"
                  data-edit-card="${card.id}"
                >
                  Изменить
                </button>


                <button
                  class="btn danger"
                  data-del-card="${card.id}"
                >
                  Удалить
                </button>

              </div>

            </article>

          `
        )
        .join("")


      ||
      `
        <div class="empty">
          Реквизитов нет.
        </div>
      `;


    box
      .querySelectorAll(
        "[data-edit-card]"
      )
      .forEach(button => {

        button.onclick =
          () => {

            const card =
              state.cards.find(
                item =>
                  Number(
                    item.id
                  ) ===
                  Number(
                    button.dataset
                      .editCard
                  )
              );


            if(card){

              cardForm(
                card
              );

            }

          };

      });


    box
      .querySelectorAll(
        "[data-del-card]"
      )
      .forEach(button => {

        button.onclick =
          async () => {

            if(
              !confirm(
                "Удалить реквизиты?"
              )
            ){

              return;

            }


            try{

              await api(
                `/api/admin/reservation-cards/${button.dataset.delCard}`,
                {
                  method:"DELETE"
                }
              );


              toast(
                "Реквизиты удалены"
              );


              await renderDeposit();


            }catch(error){

              toast(
                error.message
              );

            }

          };

      });

  }



  /* ======================================================
     STORE SETTINGS
  ====================================================== */

  const STORE_SETTING_KEYS = [

    {
      key:"store_name",
      label:"Название магазина",
      placeholder:"IRoom"
    },

    {
      key:"contact_username",
      label:"Username менеджера",
      placeholder:"@manager"
    },

    {
      key:"contact_url",
      label:"Ссылка на менеджера",
      placeholder:"https://t.me/..."
    },

    {
      key:"channel_username",
      label:"Username канала",
      placeholder:"@channel"
    },

    {
      key:"channel_url",
      label:"Ссылка на канал",
      placeholder:"https://t.me/..."
    },

    {
      key:"reservation_text",
      label:"Текст про залог",
      placeholder:"Текст"
    },

    {
      key:"delivery_text",
      label:"Текст доставки",
      placeholder:"Текст"
    },

    {
      key:"pickup_text",
      label:"Текст самовывоза",
      placeholder:"Текст"
    }

  ];


  async function renderSettings(){

    /*
      Именно этот endpoint
      должен быть на server.js.
    */

    const data =
      await api(
        "/api/admin/settings"
      );


    state.settings =
      data.settings ||
      {};


    $("#content").innerHTML = `

      <section
        class="panel"
      >

        <h2>
          Настройки магазина
        </h2>


        <div class="grid">

          ${
            STORE_SETTING_KEYS
              .map(
                setting => `

                  <div
                    class="field full"
                  >

                    <label>
                      ${esc(
                        setting.label
                      )}
                    </label>

                    <input
                      data-setting="${setting.key}"
                      value="${esc(
                        state.settings[
                          setting.key
                        ] ||
                        ""
                      )}"
                      placeholder="${esc(
                        setting.placeholder
                      )}"
                    >

                  </div>

                `
              )
              .join("")
          }

        </div>


        <div class="actions">

          <button
            class="btn primary"
            id="saveSettings"
          >
            Сохранить настройки
          </button>

        </div>


        <div
          id="settingsSaveState"
          class="save-state"
        ></div>

      </section>

    `;


    $("#saveSettings").onclick =
      async () => {

        const button =
          $("#saveSettings");


        const stateText =
          $("#settingsSaveState");


        const settings = {};


        document
          .querySelectorAll(
            "[data-setting]"
          )
          .forEach(
            input => {

              settings[
                input.dataset
                  .setting
              ] =
                input.value;

            }
          );


        button.disabled =
          true;

        button.textContent =
          "Сохраняем...";


        if(stateText){

          stateText.textContent =
            "";

        }


        try{

          /*
            PUT /api/admin/settings
          */

          const result =
            await api(
              "/api/admin/settings",
              {
                method:"PUT",

                body:
                  JSON.stringify({
                    settings
                  })
              }
            );


          if(
            result?.ok !==
            false
          ){

            toast(
              "Настройки сохранены"
            );


            if(stateText){

              stateText.textContent =
                "Последнее сохранение: только что";

            }

          }


        }catch(error){

          console.error(
            "SETTINGS SAVE ERROR:",
            error
          );


          if(
            error.status ===
            404
          ){

            toast(
              "HTTP 404: Render запустил старый server.js. Нужно задеплоить server.js с /api/admin/settings."
            );

          }else{

            toast(
              error.message ||
              "Не удалось сохранить настройки"
            );

          }


        }finally{

          button.disabled =
            false;

          button.textContent =
            "Сохранить настройки";

        }

      };

  }



  /* ======================================================
     RENDER
  ====================================================== */

  async function render(){

    document
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        tab => {

          tab.classList.toggle(
            "active",
            tab.dataset.tab ===
              state.tab
          );

        }
      );


    try{

      if(
        state.tab ===
        "orders"
      ){

        await renderOrders();

      }

      else if(
        state.tab ===
        "products"
      ){

        await renderProducts();

      }

      else if(
        state.tab ===
        "deposit"
      ){

        await renderDeposit();

      }

      else if(
        state.tab ===
        "settings"
      ){

        await renderSettings();

      }


    }catch(error){

      console.error(
        "ADMIN RENDER ERROR:",
        error
      );


      $("#content").innerHTML = `

        <section
          class="panel"
        >

          <div
            class="empty"
          >

            ${esc(
              error.message ||
              "Ошибка загрузки"
            )}

          </div>

        </section>

      `;

    }

  }



  /* ======================================================
     TABS
  ====================================================== */

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab => {

        tab.onclick =
          () => {

            state.tab =
              tab.dataset.tab;

            render();

          };

      }
    );



  /* ======================================================
     BOOT
  ====================================================== */

  async function boot(){

    if(
      !tg?.initData
    ){

      $("#login")
        .classList
        .remove(
          "hidden"
        );

      return;

    }


    try{

      const me =
        await api(
          "/api/admin/me"
        );


      const adminId =
        String(
          me.admin_id ||
          me.user?.id ||
          ""
        );


      if(
        !ADMIN_IDS.has(
          adminId
        )
      ){

        throw new Error(
          "Доступ запрещён"
        );

      }


      $("#app")
        .classList
        .remove(
          "hidden"
        );


      await render();


    }catch(error){

      console.error(
        "ADMIN BOOT ERROR:",
        error
      );


      $("#login")
        .classList
        .remove(
          "hidden"
        );


      $("#login .muted")
        .textContent =
        error.message ||
        "Ошибка авторизации";

    }

  }


  boot();

})();
</script>

</body>
</html>
