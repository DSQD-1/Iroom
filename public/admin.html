<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>IRoom — Admin</title>
<style>
:root{--bg:#050505;--panel:#101012;--panel2:#151518;--line:rgba(255,255,255,.08);--text:#f7f7f8;--muted:#8c8c95;--pink:#ff2d8d;--pink2:#ff4da5;--green:#39d98a;--red:#ff6868;--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}body{min-height:100vh}.app{max-width:1180px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{font-size:22px;font-weight:850;letter-spacing:-.7px}.brand b{color:var(--pink)}.top-actions{display:flex;gap:8px}.btn{min-height:42px;padding:0 15px;border-radius:14px;background:#18181b;color:#ddd;border:1px solid var(--line);font-weight:750}.btn.primary{background:linear-gradient(135deg,#ff2d8d,#ff4da5);color:#fff;border:0}.btn.danger{color:#ff8585}.btn:active{transform:scale(.97)}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:14px}.tab{white-space:nowrap;padding:10px 14px;border-radius:13px;background:#0e0e10;color:#888;border:1px solid var(--line);font-size:12px;font-weight:750}.tab.active{background:rgba(255,45,141,.13);border-color:rgba(255,45,141,.3);color:#ff70ad}.panel{background:linear-gradient(180deg,#111113,#0d0d0f);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 18px 60px rgba(0,0,0,.2)}.panel h2{margin:0 0 13px;font-size:16px}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#777780;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);outline:0;background:#09090b;color:#fff;border-radius:13px;padding:12px;font-size:13px}.field textarea{min-height:90px;resize:vertical}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#bbb}.check input{accent-color:var(--pink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.media-pick{position:relative;border:1px dashed rgba(255,255,255,.14);background:#09090b;border-radius:17px;padding:16px;text-align:center;color:#aaa}.media-pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0}.media-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.media-item{position:relative;aspect-ratio:1;background:#08080a;border-radius:14px;overflow:hidden;border:1px solid var(--line)}.media-item img,.media-item video{width:100%;height:100%;object-fit:contain}.media-item .x{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff}.cards{display:grid;gap:9px}.item{padding:13px;border:1px solid var(--line);background:#0a0a0c;border-radius:16px}.item-head{display:flex;justify-content:space-between;gap:10px}.item-title{font-weight:800}.pill{font-size:10px;border-radius:99px;padding:5px 8px;background:#19191c;color:#aaa}.pill.pending{color:#ffc06b}.pill.wait{color:#ffad52}.pill.ok{color:#56df9c}.pill.bad{color:#ff7777}.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:#aaa;font-size:12px}.row strong{color:#eee;text-align:right}.empty{padding:28px;text-align:center;color:#777}.login{min-height:80vh;display:flex;align-items:center;justify-content:center}.login .panel{width:min(440px,100%);text-align:center}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#19191d;border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-size:12px;z-index:99;transition:.3s var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}.order-media{width:56px;height:56px;object-fit:contain;background:transparent;border-radius:10px}.order{display:grid;grid-template-columns:auto 1fr;gap:12px}.order-main{min-width:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.app{padding-left:12px;padding-right:12px}.top{align-items:flex-start}.brand{font-size:19px}.top-actions .btn{padding:0 11px}.media-list{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="panel">
    <div class="brand">
      IR<span style="color:#ff2d8d">oom</span>
      <small style="color:#777">ADMIN</small>
    </div>
    <p class="muted">Откройте админ-панель из Telegram.</p>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      IR<span>oom</span>
      <small style="color:#666;font-size:10px">ADMIN</small>
    </div>

    <div class="top-actions">
      <button class="btn" id="closeBtn">Закрыть</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="orders">Заказы</button>
    <button class="tab" data-tab="products">Товары</button>
    <button class="tab" data-tab="deposit">Залог</button>
    <button class="tab" data-tab="settings">Настройки</button>
  </nav>

  <main id="content"></main>
</div>

<div id="toast" class="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
(() => {
  const tg=window.Telegram?.WebApp||null;

  tg?.ready();
  tg?.expand();

  const ADMIN_IDS=new Set([
    "5082864281",
    "5975037118"
  ]);

  const state={
    tab:"orders",
    orders:[],
    products:[],
    categories:[],
    cards:[],
    settings:{},
    media:[]
  };

  const $=s=>document.querySelector(s);

  const esc=v=>String(v??"").replace(
    /[&<>\"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[c])
  );

  const init=()=>String(
    tg?.initData||""
  );

  const headers=()=>({
    "Content-Type":"application/json",
    "x-telegram-init-data":init()
  });

  function toast(t){
    const e=$("#toast");

    e.textContent=t;
    e.classList.add("show");

    clearTimeout(window.__toast);

    window.__toast=setTimeout(
      ()=>e.classList.remove("show"),
      2600
    );
  }

  async function api(url,opt={}){
    const r=await fetch(url,{
      ...opt,
      headers:{
        ...headers(),
        ...(opt.headers||{})
      }
    });

    let d={};

    try{
      d=await r.json();
    }catch{}

    if(!r.ok){
      throw new Error(
        d.error||"Ошибка запроса"
      );
    }

    return d;
  }

  function closeAdmin(){
    try{
      tg?.HapticFeedback?.impactOccurred(
        "light"
      );
    }catch{}

    if(tg?.close){
      tg.close();
    }else{
      history.back();
    }
  }

  $("#closeBtn").onclick=closeAdmin;

  async function uploadFiles(files){
    for(const file of files){
      const fd=new FormData();

      fd.append("file",file);

      const r=await fetch(
        "/api/admin/upload",
        {
          method:"POST",
          headers:{
            "x-telegram-init-data":init()
          },
          body:fd
        }
      );

      let d={};

      try{
        d=await r.json();
      }catch{}

      if(!r.ok){
        throw new Error(
          d.error||
          "Не удалось загрузить файл"
        );
      }

      state.media.push({
        url:d.url,
        type:file.type.startsWith("video/")
          ?"video"
          :"image"
      });
    }

    renderProductMedia();
  }

  function renderProductMedia(){
    const box=$("#mediaList");

    if(!box)return;

    box.innerHTML=
      state.media.map(
        (m,i)=>`
          <div class="media-item">
            ${
              m.type==="video"
              ?`
                <video
                  src="${esc(m.url)}"
                  muted
                  playsinline
                ></video>
              `
              :`
                <img
                  src="${esc(m.url)}"
                  alt=""
                >
              `
            }

            <button
              class="x"
              data-remove-media="${i}"
            >
              ×
            </button>
          </div>
        `
      ).join("")
      ||
      '<div class="muted">Файлы ещё не добавлены.</div>';

    box
      .querySelectorAll(
        "[data-remove-media]"
      )
      .forEach(
        b=>b.onclick=()=>{
          state.media.splice(
            Number(
              b.dataset.removeMedia
            ),
            1
          );

          renderProductMedia();
        }
      );
  }

  function productForm(product=null){
    state.media=[];

    const imgs=product
      ?JSON.parse(
        product.images||"[]"
      )
      :[];

    if(Array.isArray(imgs)){
      state.media=imgs
        .map(
          x=>typeof x==="string"
            ?{
              url:x,
              type:/\.(mp4|webm|mov)(\?|$)/i.test(x)
                ?"video"
                :"image"
            }
            :x
        )
        .filter(x=>x?.url);
    }

    const opts=product?.price_options
      ?JSON.parse(
        product.price_options||"{}"
      )
      :{};

    $("#content").innerHTML=`
      <section class="panel">
        <h2>
          ${product
            ?"Редактирование товара"
            :"Новый товар"}
        </h2>

        <div class="grid">

          <div class="field full">
            <label>Название</label>
            <input
              id="pName"
              value="${esc(product?.name||"")}"
            >
          </div>

          <div class="field">
            <label>Цена</label>
            <input
              id="pPrice"
              type="number"
              value="${Number(product?.price||0)}"
            >
          </div>

          <div class="field">
            <label>Старая цена</label>
            <input
              id="pOld"
              type="number"
              value="${Number(product?.old_price||0)}"
            >
          </div>

          <div class="field">
            <label>Категория</label>
            <select id="pCat">
              ${
                state.categories
                  .map(
                    c=>`
                      <option
                        value="${c.id}"
                        ${
                          Number(c.id)===
                          Number(product?.category_id)
                          ?"selected"
                          :""
                        }
                      >
                        ${esc(c.name)}
                      </option>
                    `
                  )
                  .join("")
              }
            </select>
          </div>

          <div class="field">
            <label>Изображение по умолчанию</label>
            <input
              id="pImage"
              value="${esc(product?.image_url||"")}"
              placeholder="Можно оставить пустым"
            >
          </div>

          <div class="field full">
            <label>Описание</label>
            <textarea id="pDesc">${esc(
              product?.description||""
            )}</textarea>
          </div>

          <div class="field full">
            <label>
              Медиа из галереи телефона
            </label>

            <div class="media-pick">
              📷 Выбрать фото или видео

              <input
                id="mediaInput"
                type="file"
                accept="image/*,video/*"
                multiple
              >
            </div>

            <div
              id="mediaList"
              class="media-list"
            ></div>
          </div>

          <div class="field full">
            <label>
              Опции товара (JSON, необязательно)
            </label>

            <textarea id="pOpts">${esc(
              JSON.stringify(
                opts,
                null,
                2
              )
            )}</textarea>
          </div>

          <label class="check">
            <input
              id="pNew"
              type="checkbox"
              ${
                product?.is_new
                  ?"checked"
                  :""
              }
            >
            Новинка
          </label>

        </div>

        <div class="actions">
          <button
            class="btn primary"
            id="saveProduct"
          >
            ${product
              ?"Сохранить"
              :"Добавить товар"}
          </button>

          <button
            class="btn"
            id="cancelProduct"
          >
            Отмена
          </button>
        </div>
      </section>
    `;

    renderProductMedia();

    $("#mediaInput").onchange=e=>
      uploadFiles([
        ...e.target.files
      ]).catch(
        err=>toast(err.message)
      );

    $("#cancelProduct").onclick=()=>{
      renderProducts();
    };

    $("#saveProduct").onclick=async()=>{
      let opts={};

      try{
        opts=JSON.parse(
          $("#pOpts").value||"{}"
        );
      }catch{
        toast(
          "JSON опций заполнен неправильно"
        );
        return;
      }

      const payload={
        category_id:
          Number($("#pCat").value)||null,

        name:
          $("#pName").value.trim(),

        description:
          $("#pDesc").value.trim(),

        price:
          Number($("#pPrice").value)||0,

        old_price:
          Number($("#pOld").value)||0,

        image_url:
          $("#pImage").value.trim()||
          state.media.find(
            x=>x.type==="image"
          )?.url||
          "",

        images:
          state.media,

        price_options:
          opts,

        is_new:
          $("#pNew").checked
      };

      if(!payload.name){
        toast("Введите название");
        return;
      }

      try{
        await api(
          product
            ?`/api/admin/products/${product.id}`
            :"/api/admin/products",
          {
            method:
              product
                ?"PUT"
                :"POST",

            body:
              JSON.stringify(payload)
          }
        );

        toast("Товар сохранён");

        renderProducts();
      }catch(e){
        toast(e.message);
      }
    };
  }

  async function renderProducts(){
    const [
      pr,
      ca
    ]=await Promise.all([
      api("/api/admin/products"),
      api("/api/admin/categories")
    ]);

    state.products=
      pr.products||[];

    state.categories=
      ca.categories||[];

    $("#content").innerHTML=`
      <section class="panel">
        <div
          class="top"
          style="margin:0"
        >
          <h2>Товары</h2>

          <button
            class="btn primary"
            id="newProduct"
          >
            + Добавить
          </button>
        </div>
      </section>

      <section
        class="cards"
        id="productList"
      ></section>
    `;

    $("#newProduct").onclick=()=>{
      productForm();
    };

    $("#productList").innerHTML=
      state.products
        .map(
          p=>`
            <article class="item">

              <div class="item-head">

                <div>
                  <div class="item-title">
                    ${esc(p.name)}
                  </div>

                  <div class="muted">
                    ${Number(
                      p.price
                    ).toLocaleString(
                      "ru-RU"
                    )} ₽
                  </div>
                </div>

                <div
                  class="actions"
                  style="margin:0"
                >
                  <button
                    class="btn"
                    data-edit="${p.id}"
                  >
                    Изменить
                  </button>

                  <button
                    class="btn danger"
                    data-del="${p.id}"
                  >
                    Удалить
                  </button>
                </div>

              </div>

              <div
                class="muted"
                style="margin-top:8px"
              >
                Медиа:
                ${
                  JSON.parse(
                    p.images||"[]"
                  ).length||0
                }
              </div>

            </article>
          `
        )
        .join("")
        ||
        '<div class="empty">Товаров пока нет.</div>';

    $("#productList")
      .querySelectorAll("[data-edit]")
      .forEach(
        b=>b.onclick=()=>{
          productForm(
            state.products.find(
              p=>Number(p.id)===
                Number(
                  b.dataset.edit
                )
            )
          );
        }
      );

    $("#productList")
      .querySelectorAll("[data-del]")
      .forEach(
        b=>b.onclick=async()=>{
          if(
            !confirm(
              "Удалить товар?"
            )
          )return;

          try{
            await api(
              `/api/admin/products/${b.dataset.del}`,
              {
                method:"DELETE"
              }
            );

            renderProducts();
          }catch(e){
            toast(e.message);
          }
        }
      );
  }

  function orderStatusLabel(s){
    return ({
      new:"🆕 Новый",
      confirmed:"🔵 Подтверждён",
      processing:"⚙️ В обработке",
      ready:"📦 Готов к выдаче",
      completed:"🏁 Завершён",
      cancelled:"❌ Отменён"
    }[s]||s||"—");
  }

  function depLabel(s){
    return ({
      not_required:"Не требуется",
      pending_payment:"🟡 Ожидает оплаты",
      pending:"🟡 Ожидает оплаты",
      awaiting_confirmation:
        "🟠 Ожидает проверки",
      confirmed:
        "🟢 Залог подтверждён",
      rejected:
        "🔴 Залог отклонён"
    }[s]||s||"—");
  }

  async function renderOrders(){
    state.orders=
      (
        await api(
          "/api/admin/orders"
        )
      ).orders||[];

    $("#content").innerHTML=`
      <section
        class="cards"
        id="ordersList"
      ></section>
    `;

    const box=$("#ordersList");

    box.innerHTML=
      state.orders
        .map(
          o=>`
            <article class="item">

              <div class="order">

                <div>
                  ${
                    o.product_id
                    ?`
                      <img
                        class="order-media"
                        src="${esc(
                          o.image_url||""
                        )}"
                        onerror="
                          this.style.display='none'
                        "
                      >
                    `
                    :""
                  }
                </div>

                <div class="order-main">

                  <div class="item-head">

                    <div>
                      <div class="item-title">
                        ${esc(
                          o.display_id||
                          ("IR-"+o.id)
                        )}
                      </div>

                      <div class="muted">
                        ${esc(
                          o.product_name||
                          "Товар"
                        )}
                      </div>
                    </div>

                    <span class="pill">
                      ${esc(
                        orderStatusLabel(
                          o.status
                        )
                      )}
                    </span>

                  </div>

                  <div class="row">
                    <span>Клиент</span>
                    <strong>
                      ${esc(
                        o.customer_name||
                        "Покупатель"
                      )}
                      ${esc(
                        o.customer_username||
                        ""
                      )}
                    </strong>
                  </div>

                  <div class="row">
                    <span>Сумма</span>
                    <strong>
                      ${Number(
                        o.price||0
                      ).toLocaleString(
                        "ru-RU"
                      )} ₽
                    </strong>
                  </div>

                  <div class="row">
                    <span>Залог</span>
                    <strong>
                      ${Number(
                        o.reservation_amount||0
                      ).toLocaleString(
                        "ru-RU"
                      )} ₽
                    </strong>
                  </div>

                  <div class="row">
                    <span>
                      Статус залога
                    </span>

                    <strong>
                      ${esc(
                        depLabel(
                          o.reservation_status
                        )
                      )}
                    </strong>
                  </div>

                  <div class="actions">

                    <select
                      class="btn"
                      data-status="${o.id}"
                    >
                      ${
                        [
                          "new",
                          "confirmed",
                          "processing",
                          "ready",
                          "completed",
                          "cancelled"
                        ]
                        .map(
                          s=>`
                            <option
                              value="${s}"
                              ${
                                s===o.status
                                  ?"selected"
                                  :""
                              }
                            >
                              ${orderStatusLabel(s)}
                            </option>
                          `
                        )
                        .join("")
                      }
                    </select>

                    <select
                      class="btn"
                      data-res="${o.id}"
                    >
                      ${
                        [
                          "pending_payment",
                          "awaiting_confirmation",
                          "confirmed",
                          "rejected",
                          "not_required"
                        ]
                        .map(
                          s=>`
                            <option
                              value="${s}"
                              ${
                                s===
                                o.reservation_status
                                  ?"selected"
                                  :""
                              }
                            >
                              ${depLabel(s)}
                            </option>
                          `
                        )
                        .join("")
                      }
                    </select>

                  </div>

                </div>

              </div>

            </article>
          `
        )
        .join("")
        ||
        '<div class="empty">Заказов пока нет.</div>';

    box
      .querySelectorAll(
        "[data-status]"
      )
      .forEach(
        s=>s.onchange=async()=>{
          try{
            await api(
              `/api/admin/orders/${s.dataset.status}/status`,
              {
                method:"PUT",
                body:JSON.stringify({
                  status:s.value
                })
              }
            );

            toast(
              "Статус заказа обновлён"
            );
          }catch(e){
            toast(e.message);
          }
        }
      );

    box
      .querySelectorAll(
        "[data-res]"
      )
      .forEach(
        s=>s.onchange=async()=>{
          try{
            await api(
              `/api/admin/orders/${s.dataset.res}/reservation`,
              {
                method:"PUT",
                body:JSON.stringify({
                  reservation_status:
                    s.value
                })
              }
            );

            toast(
              "Статус залога обновлён"
            );
          }catch(e){
            toast(e.message);
            renderOrders();
          }
        }
      );
  }

  async function renderDeposit(){
    const [
      c,
      st
    ]=await Promise.all([
      api(
        "/api/admin/reservation-cards"
      ),
      api(
        "/api/admin/settings"
      )
    ]);

    state.cards=
      c.reservation_cards||[];

    state.settings=
      st.settings||{};

    $("#content").innerHTML=`
      <section class="panel">

        <h2>Залог</h2>

        <div class="grid">

          <div class="field">
            <label>
              Размер залога по умолчанию
            </label>

            <input
              id="depAmount"
              type="number"
              value="${
                Number(
                  state.settings
                    .reservation_amount||0
                )
              }"
            >
          </div>

          <div class="field">
            <label>
              Текст залога
            </label>

            <input
              id="depText"
              value="${esc(
                state.settings
                  .reservation_text||""
              )}"
            >
          </div>

        </div>

        <div class="actions">
          <button
            class="btn primary"
            id="saveDep"
          >
            Сохранить настройки
          </button>
        </div>

      </section>

      <section class="panel">

        <div
          class="top"
          style="margin:0"
        >
          <h2>Реквизиты</h2>

          <button
            class="btn primary"
            id="newCard"
          >
            + Добавить
          </button>
        </div>

        <div
          class="cards"
          style="margin-top:10px"
          id="cardList"
        ></div>

      </section>
    `;

    $("#saveDep").onclick=async()=>{
      try{
        await api(
          "/api/admin/settings",
          {
            method:"PUT",
            body:JSON.stringify({
              settings:{
                reservation_amount:
                  $("#depAmount").value,

                reservation_text:
                  $("#depText").value
              }
            })
          }
        );

        toast(
          "Настройки залога сохранены"
        );
      }catch(e){
        toast(e.message);
      }
    };

    $("#newCard").onclick=()=>{
      cardForm();
    };

    renderCards();
  }

  function cardForm(card=null){
    const wrap=
      document.createElement(
        "div"
      );

    wrap.className="panel";

    wrap.innerHTML=`
      <h2>
        ${
          card
            ?"Изменить реквизиты"
            :"Новые реквизиты"
        }
      </h2>

      <div class="grid">

        <div class="field">
          <label>Название</label>
          <input
            id="cTitle"
            value="${esc(
              card?.title||""
            )}"
          >
        </div>

        <div class="field">
          <label>Карта / телефон</label>
          <input
            id="cNum"
            value="${esc(
              card?.card_number||""
            )}"
          >
        </div>

        <div class="field">
          <label>Получатель</label>
          <input
            id="cRec"
            value="${esc(
              card?.recipient||""
            )}"
          >
        </div>

        <div class="field">
          <label>Сумма залога</label>
          <input
            id="cAmt"
            type="number"
            value="${Number(
              card?.amount||0
            )}"
          >
        </div>

        <div class="field full">
          <label>
            Дополнительные реквизиты
          </label>

          <textarea id="cReq">${esc(
            card?.requisites||""
          )}</textarea>
        </div>

      </div>

      <label class="check">
        <input
          id="cActive"
          type="checkbox"
          ${
            card?.active!==0
              ?"checked"
              :""
          }
        >
        Активные реквизиты
      </label>

      <label class="check">
        <input
          id="cDefault"
          type="checkbox"
          ${
            card?.is_default
              ?"checked"
              :""
          }
        >
        Использовать по умолчанию
      </label>

      <div class="actions">

        <button
          class="btn primary"
          id="saveCard"
        >
          Сохранить
        </button>

        <button
          class="btn"
          id="cancelCard"
        >
          Отмена
        </button>

      </div>
    `;

    const panel=
      [
        ...document.querySelectorAll(
          "#content>.panel"
        )
      ][1];

    panel.after(wrap);

    $("#saveCard").onclick=async()=>{
      const payload={
        title:
          $("#cTitle").value,

        card_number:
          $("#cNum").value,

        recipient:
          $("#cRec").value,

        requisites:
          $("#cReq").value,

        amount:
          Number(
            $("#cAmt").value
          )||0,

        active:
          $("#cActive").checked,

        is_default:
          $("#cDefault").checked
      };

      try{
        await api(
          card
            ?`/api/admin/reservation-cards/${card.id}`
            :"/api/admin/reservation-cards",
          {
            method:
              card
                ?"PUT"
                :"POST",

            body:
              JSON.stringify(payload)
          }
        );

        toast(
          "Реквизиты сохранены"
        );

        renderDeposit();
      }catch(e){
        toast(e.message);
      }
    };

    $("#cancelCard").onclick=()=>{
      wrap.remove();
    };
  }

  function renderCards(){
    const box=$("#cardList");

    if(!box)return;

    box.innerHTML=
      state.cards
        .map(
          c=>`
            <article class="item">

              <div class="item-head">

                <div>

                  <div class="item-title">
                    ${esc(
                      c.title||
                      "Реквизиты"
                    )}
                  </div>

                  <div class="muted">
                    ${esc(
                      c.card_number||
                      c.requisites||
                      "—"
                    )}
                  </div>

                </div>

                <span
                  class="pill ${
                    c.active
                      ?"ok"
                      :"bad"
                  }"
                >
                  ${
                    c.active
                      ?"Активно"
                      :"Выключено"
                  }
                </span>

              </div>

              <div class="row">
                <span>Получатель</span>
                <strong>
                  ${esc(
                    c.recipient||"—"
                  )}
                </strong>
              </div>

              <div class="row">
                <span>Залог</span>
                <strong>
                  ${Number(
                    c.amount||0
                  ).toLocaleString(
                    "ru-RU"
                  )} ₽
                </strong>
              </div>

              <div class="actions">

                <button
                  class="btn"
                  data-edit-card="${c.id}"
                >
                  Изменить
                </button>

                <button
                  class="btn danger"
                  data-del-card="${c.id}"
                >
                  Удалить
                </button>

              </div>

            </article>
          `
        )
        .join("")
        ||
        '<div class="empty">Реквизитов нет.</div>';

    box
      .querySelectorAll(
        "[data-edit-card]"
      )
      .forEach(
        b=>b.onclick=()=>{
          cardForm(
            state.cards.find(
              c=>Number(c.id)===
                Number(
                  b.dataset.editCard
                )
            )
          );
        }
      );

    box
      .querySelectorAll(
        "[data-del-card]"
      )
      .forEach(
        b=>b.onclick=async()=>{
          if(
            !confirm(
              "Удалить реквизиты?"
            )
          )return;

          try{
            await api(
              `/api/admin/reservation-cards/${b.dataset.delCard}`,
              {
                method:"DELETE"
              }
            );

            renderDeposit();
          }catch(e){
            toast(e.message);
          }
        }
      );
  }

  async function renderSettings(){
    const d=
      await api(
        "/api/admin/settings"
      );

    state.settings=
      d.settings||{};

    const keys=[
      "store_name",
      "contact_username",
      "contact_url",
      "channel_username",
      "channel_url",
      "reservation_text",
      "delivery_text",
      "pickup_text"
    ];

    $("#content").innerHTML=`
      <section class="panel">

        <h2>
          Настройки магазина
        </h2>

        <div class="grid">

          ${
            keys
              .map(
                k=>`
                  <div class="field full">

                    <label>
                      ${esc(k)}
                    </label>

                    <input
                      data-setting="${k}"
                      value="${esc(
                        state.settings[k]||""
                      )}"
                    >

                  </div>
                `
              )
              .join("")
          }

        </div>

        <div class="actions">

          <button
            class="btn primary"
            id="saveSettings"
          >
            Сохранить
          </button>

        </div>

      </section>
    `;

    $("#saveSettings").onclick=async()=>{
      const settings={};

      document
        .querySelectorAll(
          "[data-setting]"
        )
        .forEach(
          e=>settings[
            e.dataset.setting
          ]=e.value
        );

      try{
        await api(
          "/api/admin/settings",
          {
            method:"PUT",
            body:JSON.stringify({
              settings
            })
          }
        );

        toast(
          "Настройки сохранены"
        );
      }catch(e){
        toast(e.message);
      }
    };
  }

  async function render(){
    document
      .querySelectorAll(".tab")
      .forEach(
        t=>t.classList.toggle(
          "active",
          t.dataset.tab===
            state.tab
        )
      );

    try{
      if(
        state.tab==="orders"
      ){
        await renderOrders();
      }else if(
        state.tab==="products"
      ){
        await renderProducts();
      }else if(
        state.tab==="deposit"
      ){
        await renderDeposit();
      }else{
        await renderSettings();
      }
    }catch(e){
      $("#content").innerHTML=`
        <section class="panel">
          <div class="empty">
            ${esc(e.message)}
          </div>
        </section>
      `;
    }
  }

  document
    .querySelectorAll(".tab")
    .forEach(
      t=>t.onclick=()=>{
        state.tab=t.dataset.tab;
        render();
      }
    );

  async function boot(){
    if(!tg?.initData){
      $("#login")
        .classList
        .remove("hidden");

      return;
    }

    try{
      const me=
        await api(
          "/api/admin/me"
        );

      if(
        !ADMIN_IDS.has(
          String(me.admin_id)
        )
      ){
        throw new Error(
          "Доступ запрещён"
        );
      }

      $("#app")
        .classList
        .remove("hidden");

      await render();

    }catch(e){
      $("#login")
        .classList
        .remove("hidden");

      $("#login .muted")
        .textContent=e.message;
    }
  }

  boot();

})();
</script>
</body>
</html>
