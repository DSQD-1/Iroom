<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>IRoom Admin</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/admin.css" />
</head>

<body>

  <div class="admin-app">

    <header class="admin-header">
      <div>
        <div class="admin-brand">
          <span class="brand-pink">IR</span><span>oom</span>
        </div>
        <div class="admin-subtitle">Панель управления</div>
      </div>

      <button id="backToStore" class="header-button">
        Магазин
      </button>
    </header>


    <main>

      <section id="accessScreen" class="screen center-screen">
        <div class="access-card">
          <div class="loader"></div>
          <div id="accessText">Проверяем доступ...</div>
        </div>
      </section>


      <section id="adminScreen" class="screen hidden">

        <div class="tabs">
          <button class="tab active" data-tab="products">
            Товары
          </button>

          <button class="tab" data-tab="categories">
            Категории
          </button>

          <button class="tab" data-tab="orders">
            Заказы
          </button>
        </div>


        <!-- ТОВАРЫ -->

        <section id="productsTab" class="tab-content">

          <div class="section-header">
            <div>
              <h1>Товары</h1>
              <p>Управление каталогом IRoom</p>
            </div>

            <button id="addProductButton" class="primary-button">
              + Добавить
            </button>
          </div>

          <div id="productsList" class="items-list"></div>

        </section>


        <!-- КАТЕГОРИИ -->

        <section id="categoriesTab" class="tab-content hidden">

          <div class="section-header">
            <div>
              <h1>Категории</h1>
              <p>Разделы магазина</p>
            </div>

            <button id="addCategoryButton" class="primary-button">
              + Добавить
            </button>
          </div>

          <div id="categoriesList" class="items-list"></div>

        </section>


        <!-- ЗАКАЗЫ -->

        <section id="ordersTab" class="tab-content hidden">

          <div class="section-header">
            <div>
              <h1>Заказы</h1>
              <p>Заявки на бронирование</p>
            </div>
          </div>

          <div id="ordersList" class="items-list"></div>

        </section>

      </section>

    </main>


    <!-- МОДАЛКА ТОВАРА -->

    <div id="productModal" class="modal hidden">

      <div class="modal-overlay" data-close-modal="product"></div>

      <div class="modal-card">

        <div class="modal-header">
          <div>
            <h2 id="productModalTitle">Новый товар</h2>
            <p>Заполните информацию о товаре</p>
          </div>

          <button
            class="close-button"
            data-close-modal="product"
          >
            ×
          </button>
        </div>


        <form id="productForm">

          <input type="hidden" id="productId" />


          <label>
            Название
            <input
              id="productName"
              type="text"
              placeholder="iPhone 17 Pro Max"
              required
            />
          </label>


          <label>
            Категория
            <select id="productCategory">
              <option value="">Без категории</option>
            </select>
          </label>


          <label>
            Описание
            <textarea
              id="productDescription"
              placeholder="Описание товара"
              rows="4"
            ></textarea>
          </label>


          <label>
            Цена
            <input
              id="productPrice"
              type="number"
              min="0"
              step="1"
              placeholder="100000"
              required
            />
          </label>


          <label>
            Изображение
            <input
              id="productImage"
              type="file"
              accept="image/*"
            />
          </label>


          <div id="currentProductImage" class="current-image hidden"></div>


          <div class="form-section">

            <div class="form-section-title">
              Варианты товара
            </div>

            <div id="variantsContainer"></div>

            <button
              type="button"
              id="addVariantButton"
              class="secondary-button"
            >
              + Добавить вариант
            </button>

          </div>


          <div class="form-actions">

            <button
              type="button"
              class="secondary-button"
              data-close-modal="product"
            >
              Отмена
            </button>

            <button
              type="submit"
              class="primary-button"
            >
              Сохранить
            </button>

          </div>

        </form>

      </div>

    </div>


    <!-- МОДАЛКА КАТЕГОРИИ -->

    <div id="categoryModal" class="modal hidden">

      <div class="modal-overlay" data-close-modal="category"></div>

      <div class="modal-card">

        <div class="modal-header">
          <div>
            <h2 id="categoryModalTitle">Новая категория</h2>
            <p>Название раздела магазина</p>
          </div>

          <button
            class="close-button"
            data-close-modal="category"
          >
            ×
          </button>
        </div>


        <form id="categoryForm">

          <input type="hidden" id="categoryId" />

          <label>
            Название
            <input
              id="categoryName"
              type="text"
              placeholder="iPhone"
              required
            />
          </label>


          <label>
            Изображение
            <input
              id="categoryImage"
              type="file"
              accept="image/*"
            />
          </label>


          <div class="form-actions">

            <button
              type="button"
              class="secondary-button"
              data-close-modal="category"
            >
              Отмена
            </button>

            <button
              type="submit"
              class="primary-button"
            >
              Сохранить
            </button>

          </div>

        </form>

      </div>

    </div>


    <div id="toast" class="toast"></div>

    <div id="pageLoader" class="page-loader hidden">
      <div class="loader"></div>
    </div>

  </div>


  <script src="/admin.js"></script>

</body>
</html>
