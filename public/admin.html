<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>IRoom — Admin</title>

<style>
:root{
  --bg:#050505;
  --panel:#101012;
  --panel2:#151518;
  --line:rgba(255,255,255,.08);
  --text:#f7f7f8;
  --muted:#8c8c95;
  --pink:#ff2d8d;
  --pink2:#ff4da5;
  --green:#39d98a;
  --red:#ff6868;
  --ease:cubic-bezier(.22,.8,.25,1)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  border:0;
  color:inherit;
  cursor:pointer
}

body{
  min-height:100vh
}

.app{
  max-width:1180px;
  margin:auto;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom))
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}

.brand{
  font-size:22px;
  font-weight:850;
  letter-spacing:-.7px
}

.brand span{
  color:var(--pink)
}

.top-actions{
  display:flex;
  gap:8px
}

.btn{
  min-height:42px;
  padding:0 15px;
  border-radius:14px;
  background:#18181b;
  color:#ddd;
  border:1px solid var(--line);
  font-weight:750
}

.btn.primary{
  background:linear-gradient(135deg,#ff2d8d,#ff4da5);
  color:#fff;
  border:0
}

.btn.danger{
  color:#ff8585
}

.btn:active{
  transform:scale(.97)
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:14px
}

.tab{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:13px;
  background:#0e0e10;
  color:#888;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750
}

.tab.active{
  background:rgba(255,45,141,.13);
  border-color:rgba(255,45,141,.3);
  color:#ff70ad
}

.panel{
  background:linear-gradient(180deg,#111113,#0d0d0f);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.2)
}

.panel h2{
  margin:0 0 13px;
  font-size:16px
}

.muted{
  color:var(--muted);
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field.full{
  grid-column:1/-1
}

.field label{
  font-size:10px;
  color:#777780;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#09090b;
  color:#fff;
  border-radius:13px;
  padding:12px;
  font-size:13px
}

.field textarea{
  min-height:90px;
  resize:vertical
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#bbb
}

.check input{
  accent-color:var(--pink)
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.media-pick{
  position:relative;
  border:1px dashed rgba(255,255,255,.14);
  background:#09090b;
  border-radius:17px;
  padding:16px;
  text-align:center;
  color:#aaa
}

.media-pick input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0
}

.media-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px
}

.media-item{
  position:relative;
  aspect-ratio:1;
  background:#08080a;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line)
}

.media-item img,
.media-item video{
  width:100%;
  height:100%;
  object-fit:contain
}

.media-item .x{
  position:absolute;
  right:5px;
  top:5px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff
}

.cards{
  display:grid;
  gap:9px
}

.item{
  padding:13px;
  border:1px solid var(--line);
  background:#0a0a0c;
  border-radius:16px
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.item-title{
  font-weight:800
}

.pill{
  font-size:10px;
  border-radius:99px;
  padding:5px 8px;
  background:#19191c;
  color:#aaa
}

.pill.pending{
  color:#ffc06b
}

.pill.wait{
  color:#ffad52
}

.pill.ok{
  color:#56df9c
}

.pill.bad{
  color:#ff7777
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  color:#aaa;
  font-size:12px
}

.row strong{
  color:#eee;
  text-align:right
}

.empty{
  padding:28px;
  text-align:center;
  color:#777
}

.login{
  min-height:80vh;
  display:flex;
  align-items:center;
  justify-content:center
}

.login .panel{
  width:min(440px,100%);
  text-align:center
}

.hidden{
  display:none!important
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#19191d;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:14px;
  font-size:12px;
  z-index:99;
  transition:.3s var(--ease)
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.order-media{
  width:56px;
  height:56px;
  object-fit:contain;
  background:transparent;
  border-radius:10px
}

.order{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px
}

.order-main{
  min-width:0
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .app{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    align-items:flex-start
  }

  .brand{
    font-size:19px
  }

  .top-actions .btn{
    padding:0 11px
  }

  .media-list{
    grid-template-columns:repeat(3,1fr)
  }
}

.option-groups{
  display:grid;
  gap:12px;
  margin-top:2px
}

.option-group{
  padding:13px;
  border:1px solid var(--line);
  background:#09090b;
  border-radius:16px
}

.option-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px
}

.option-group-title{
  font-size:12px;
  font-weight:800
}

.option-group-sub{
  font-size:10px;
  color:#666
}

.option-add{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px 42px;
  gap:7px
}

.option-add input{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#101012;
  color:#fff;
  border-radius:11px;
  padding:10px;
  font-size:13px
}

.option-add input[type=number]{
  text-align:right
}

.option-add button{
  border:0;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800
}

.option-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:9px
}

.option-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:0 8px 0 11px;
  border:1px solid rgba(255,45,141,.24);
  border-radius:10px;
  background:rgba(255,45,141,.08);
  color:#eee;
  font-size:11px
}

.option-chip small{
  color:#ff77b1
}

.option-chip button{
  width:20px;
  height:20px;
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:#aaa;
  padding:0
}

@media(max-width:650px){

  .option-add{
    grid-template-columns:minmax(0,1fr) 85px 42px
  }

}
</style>
</head>

<body>

<div id="login" class="login hidden">

  <div class="panel">

    <div class="brand">
      IR<span style="color:#ff2d8d">oom</span>
      <small style="color:#777">ADMIN</small>
    </div>

    <p class="muted">
      Откройте админ-панель из Telegram.
    </p>

  </div>

</div>


<div id="app" class="app hidden">

  <header class="top">

    <div class="brand">
      IR<span>oom</span>

      <small
        style="
          color:#666;
          font-size:10px
        ">
        ADMIN
      </small>

    </div>

    <div class="top-actions">

      <button
        class="btn"
        id="closeBtn">
        Закрыть
      </button>

    </div>

  </header>


  <nav class="tabs" id="tabs">

    <button
      class="tab active"
      data-tab="orders">
      Заказы
    </button>

    <button
      class="tab"
      data-tab="products">
      Товары
    </button>

    <button
      class="tab"
      data-tab="deposit">
      Залог
    </button>

    <button
      class="tab"
      data-tab="settings">
      Настройки
    </button>

  </nav>


  <main id="content"></main>

</div>


<div id="toast" class="toast"></div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

(() => {

  const tg =
    window.Telegram?.WebApp || null;

  tg?.ready();
  tg?.expand();


  const ADMIN_IDS =
    new Set([
      "5082864281",
      "5975037118"
    ]);


  const state = {

    tab:"orders",

    orders:[],

    products:[],

    categories:[],

    cards:[],

    settings:{},

    media:[]

  };


  const $ =
    s =>
      document.querySelector(s);


  const esc =
    v =>
      String(v ?? "")
        .replace(
          /[&<>"']/g,
          c =>
            ({
              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              "\"":"&quot;",
              "'":"&#039;"
            }[c])
        );


  const init =
    () =>
      String(
        tg?.initData || ""
      );


  const headers =
    () => ({
      "Content-Type":
        "application/json",

      "x-telegram-init-data":
        init()
    });


  function toast(text){

    const e =
      $("#toast");

    e.textContent =
      text;

    e.classList.add(
      "show"
    );

    clearTimeout(
      window.__toast
    );

    window.__toast =
      setTimeout(
        () =>
          e.classList.remove(
            "show"
          ),
        2600
      );

  }


  async function api(
    url,
    opt={}
  ){

    const r =
      await fetch(
        url,
        {
          ...opt,

          headers:{
            ...headers(),

            ...(opt.headers || {})
          }
        }
      );


    let d={};

    try{

      d =
        await r.json();

    }catch{}


    if(!r.ok){

      throw new Error(
        d.error ||
        d.message ||
        `HTTP ${r.status}`
      );

    }


    return d;

  }


  function statusText(
    status
  ){

    const map = {

      new:
        "Новый",

      confirmed:
        "Подтверждён",

      processing:
        "В обработке",

      ready:
        "Готов",

      completed:
        "Завершён",

      cancelled:
        "Отменён",

      rejected:
        "Отклонён"

    };


    return (
      map[status] ||
      status ||
      "—"
    );

  }


  function reservationText(
    status
  ){

    const map = {

      not_required:
        "Не требуется",

      pending_payment:
        "Ожидается залог",

      pending:
        "Ожидается",

      awaiting_confirmation:
        "Проверка залога",

      confirmed:
        "Залог подтверждён",

      rejected:
        "Залог отклонён"

    };


    return (
      map[status] ||
      status ||
      "—"
    );

  }


  function statusClass(
    status
  ){

    return [
      "new",
      "confirmed",
      "processing",
      "ready",
      "completed",
      "cancelled",
      "rejected"
    ].includes(status)
      ? status
      : "new";

  }


  function reservationClass(
    status
  ){

    if(
      status ===
      "confirmed"
    ){

      return "ok";

    }


    if(
      status ===
      "rejected"
    ){

      return "bad";

    }


    if(
      status ===
      "awaiting_confirmation"
    ){

      return "wait";

    }


    if(
      status ===
      "pending_payment"
    ){

      return "pending";

    }


    return "";

  }


  async function loadOrders(){

    const d =
      await api(
        "/api/admin/orders"
      );


    state.orders =
      Array.isArray(
        d.orders
      )
        ? d.orders
        : [];

  }


  async function renderOrders(){

    await loadOrders();


    $("#content").innerHTML = `

      <section class="panel">

        <div
          class="item-head">

          <div>

            <h2>
              Заказы
            </h2>

            <div class="muted">

              Всего:
              ${state.orders.length}

            </div>

          </div>


          <button
            class="btn danger"
            id="clearOrdersBtn">

            Очистить заказы

          </button>

        </div>

      </section>


      <section class="panel">

        <div
          id="ordersList"
          class="cards">

        </div>

      </section>

    `;


    $("#clearOrdersBtn")
      .onclick =
      clearAllOrders;


    renderOrderList();

  }


  function renderOrderList(){

    const box =
      $("#ordersList");


    if(!box){

      return;

    }


    if(
      !state.orders.length
    ){

      box.innerHTML = `

        <div class="empty">

          Заказов пока нет.

        </div>

      `;

      return;

    }


    box.innerHTML =
      state.orders
        .map(
          order =>
            `

            <article
              class="item">

              <div
                class="item-head">

                <div>

                  <div
                    class="item-title">

                    ${esc(
                      order.order_number ||
                      order.public_number ||
                      `#${order.id}`
                    )}

                  </div>

                  <div
                    class="muted">

                    ${esc(
                      order.product_name ||
                      order.title ||
                      "Товар"
                    )}

                  </div>

                </div>


                <span
                  class="pill">

                  ${esc(
                    statusText(
                      order.status
                    )
                  )}

                </span>

              </div>


              <div class="row">

                <span>
                  Клиент
                </span>

                <strong>

                  ${esc(
                    order.customer_name ||
                    order.name ||
                    "—"
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Телефон / @username
                </span>

                <strong>

                  ${esc(
                    order.contact ||
                    order.phone ||
                    order.username ||
                    "—"
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Сумма
                </span>

                <strong>

                  ${Number(
                    order.total_price ||
                    order.price ||
                    0
                  ).toLocaleString(
                    "ru-RU"
                  )} ₽

                </strong>

              </div>


              <div class="row">

                <span>
                  Залог
                </span>

                <strong>

                  ${esc(
                    reservationText(
                      order.reservation_status
                    )
                  )}

                </strong>

              </div>


              <div class="actions">

                <select
                  class="btn"
                  data-status-id="${order.id}">

                  ${[
                    ["new","Новый"],
                    ["confirmed","Подтверждён"],
                    ["processing","В обработке"],
                    ["ready","Готов"],
                    ["completed","Завершён"],
                    ["cancelled","Отменён"],
                    ["rejected","Отклонён"]
                  ]
                  .map(
                    ([value,label]) =>
                      `
                      <option
                        value="${value}"
                        ${
                          order.status ===
                          value
                            ? "selected"
                            : ""
                        }>

                        ${label}

                      </option>
                      `
                  )
                  .join("")}

                </select>


                <button
                  class="btn"
                  data-save-status="${order.id}">

                  Сохранить статус

                </button>


                <select
                  class="btn"
                  data-reservation-id="${order.id}">

                  ${[
                    ["not_required","Не требуется"],
                    ["pending_payment","Ожидается залог"],
                    ["pending","Ожидается"],
                    ["awaiting_confirmation","Проверка залога"],
                    ["confirmed","Залог подтверждён"],
                    ["rejected","Залог отклонён"]
                  ]
                  .map(
                    ([value,label]) =>
                      `
                      <option
                        value="${value}"
                        ${
                          order.reservation_status ===
                          value
                            ? "selected"
                            : ""
                        }>

                        ${label}

                      </option>
                      `
                  )
                  .join("")}

                </select>


                <button
                  class="btn"
                  data-save-reservation="${order.id}">

                  Сохранить залог

                </button>

              </div>

            </article>

            `
        )
        .join("");


    box
      .querySelectorAll(
        "[data-save-status]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              updateOrderStatus(
                button.dataset.saveStatus
              );

        }
      );


    box
      .querySelectorAll(
        "[data-save-reservation]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              updateReservation(
                button.dataset.saveReservation
              );

        }
      );

  }


  async function updateOrderStatus(
    id
  ){

    const select =
      document.querySelector(
        `[data-status-id="${CSS.escape(String(id))}"]`
      );


    if(!select){

      return;

    }


    try{

      await api(
        `/api/admin/orders/${encodeURIComponent(id)}/status`,
        {
          method:"PUT",

          body:
            JSON.stringify({
              status:
                select.value
            })
        }
      );


      toast(
        "Статус заказа сохранён"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }


  async function updateReservation(
    id
  ){

    const select =
      document.querySelector(
        `[data-reservation-id="${CSS.escape(String(id))}"]`
      );


    if(!select){

      return;

    }


    try{

      await api(
        `/api/admin/orders/${encodeURIComponent(id)}/reservation`,
        {
          method:"PUT",

          body:
            JSON.stringify({
              reservation_status:
                select.value
            })
        }
      );


      toast(
        "Статус залога сохранён"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }


  async function clearAllOrders(){

    const confirmed =
      confirm(
        "Удалить ВСЕ заказы?\n\n" +
        "Будут удалены все заказы и " +
        "связанные с ними данные.\n\n" +
        "Товары, категории, пользователи " +
        "и промокоды останутся."
      );


    if(!confirmed){

      return;

    }


    const second =
      confirm(
        "Точно удалить все заказы?\n\n" +
        "Это действие нельзя отменить."
      );


    if(!second){

      return;

    }


    try{

      await api(
        "/api/admin/orders",
        {
          method:"DELETE"
        }
      );


      toast(
        "Все заказы удалены"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }


  async function renderProducts(){

    const d =
      await api(
        "/api/admin/products"
      );


    state.products =
      Array.isArray(
        d.products
      )
        ? d.products
        : [];


    $("#content").innerHTML = `

      <section class="panel">

        <div class="item-head">

          <div>

            <h2>
              Товары
            </h2>

            <div class="muted">

              Управление каталогом.

            </div>

          </div>


          <button
            class="btn primary"
            id="addProduct">

            Добавить товар

          </button>

        </div>

      </section>


      <section class="panel">

        <div
          id="productsList"
          class="cards">

        </div>

      </section>

    `;


    $("#addProduct")
      .onclick =
      () =>
        productForm();


    const box =
      $("#productsList");


    if(
      !state.products.length
    ){

      box.innerHTML = `

        <div class="empty">

          Товаров нет.

        </div>

      `;

      return;

    }


    box.innerHTML =
      state.products
        .map(
          p =>
            `

            <article
              class="item">

              <div
                class="item-head">

                <div>

                  <div
                    class="item-title">

                    ${esc(
                      p.name ||
                      p.title ||
                      "Без названия"
                    )}

                  </div>

                  <div
                    class="muted">

                    ${esc(
                      p.category_name ||
                      "Без категории"
                    )}

                  </div>

                </div>


                <span
                  class="pill">

                  ${Number(
                    p.price ||
                    0
                  ).toLocaleString(
                    "ru-RU"
                  )} ₽

                </span>

              </div>


              <div class="actions">

                <button
                  class="btn"
                  data-edit-product="${p.id}">

                  Изменить

                </button>


                <button
                  class="btn danger"
                  data-delete-product="${p.id}">

                  Удалить

                </button>

              </div>

            </article>

            `
        )
        .join("");


    box
      .querySelectorAll(
        "[data-edit-product]"
      )
      .forEach(
        button =>
          button.onclick =
            () =>
              productForm(
                state.products.find(
                  p =>
                    Number(p.id) ===
                    Number(
                      button.dataset.editProduct
                    )
                )
              )
      );


    box
      .querySelectorAll(
        "[data-delete-product]"
      )
      .forEach(
        button =>
          button.onclick =
            async () => {

              if(
                !confirm(
                  "Удалить товар?"
                )
              ){

                return;

              }


              try{

                await api(
                  `/api/admin/products/${button.dataset.deleteProduct}`,
                  {
                    method:"DELETE"
                  }
                );


                toast(
                  "Товар удалён"
                );


                renderProducts();

              }catch(error){

                toast(
                  error.message
                );

              }

            }
      );

  }


  async function productForm(
    product=null
  ){

    const wrap =
      document.createElement(
        "section"
      );


    wrap.className =
      "panel";


    wrap.innerHTML = `

      <h2>

        ${
          product
            ? "Изменение товара"
            : "Новый товар"
        }

      </h2>


      <div class="grid">

        <div class="field">

          <label>
            Название
          </label>

          <input
            id="pName"
            value="${esc(
              product?.name ||
              ""
            )}">

        </div>


        <div class="field">

          <label>
            Цена
          </label>

          <input
            id="pPrice"
            type="number"
            value="${
              product?.price ||
              0
            }">

        </div>


        <div class="field full">

          <label>
            Описание
          </label>

          <textarea
            id="pDescription">${esc(
              product?.description ||
              ""
            )}</textarea>

        </div>


        <div class="field">

          <label>
            Изображение
          </label>

          <input
            id="pImage"
            value="${esc(
              product?.image ||
              product?.image_url ||
              ""
            )}">

        </div>


        <div class="field">

          <label>
            Артикул
          </label>

          <input
            id="pSku"
            value="${esc(
              product?.sku ||
              ""
            )}">

        </div>

      </div>


      <div class="actions">

        <button
          class="btn primary"
          id="saveProduct">

          Сохранить

        </button>


        <button
          class="btn"
          id="cancelProduct">

          Отмена

        </button>

      </div>

    `;


    $("#content")
      .prepend(
        wrap
      );


    $("#saveProduct")
      .onclick =
      async () => {

        const payload = {

          name:
            $("#pName")
              .value
              .trim(),

          price:
            Number(
              $("#pPrice")
                .value
            ) || 0,

          description:
            $("#pDescription")
              .value,

          image:
            $("#pImage")
              .value
              .trim(),

          sku:
            $("#pSku")
              .value
              .trim()

        };


        try{

          await api(
            product
              ? `/api/admin/products/${product.id}`
              : "/api/admin/products",
            {
              method:
                product
                  ? "PUT"
                  : "POST",

              body:
                JSON.stringify(
                  payload
                )
            }
          );


          toast(
            "Товар сохранён"
          );


          renderProducts();

        }catch(error){

          toast(
            error.message
          );

        }

      };


    $("#cancelProduct")
      .onclick =
      () =>
        wrap.remove();

  }


  async function renderDeposit(){

    const d =
      await api(
        "/api/admin/reservation-cards"
      );


    state.cards =
      Array.isArray(
        d.cards
      )
        ? d.cards
        : [];


    $("#content").innerHTML = `

      <section class="panel">

        <div class="item-head">

          <div>

            <h2>
              Реквизиты залога
            </h2>

            <div class="muted">

              Карты и реквизиты,
              которые увидит покупатель.

            </div>

          </div>


          <button
            class="btn primary"
            id="addCard">

            Добавить реквизиты

          </button>

        </div>

      </section>


      <section class="panel">

        <div
          id="cardList"
          class="cards">

        </div>

      </section>

    `;


    $("#addCard")
      .onclick =
      () =>
        cardForm();


    renderCards();

  }


  function cardForm(
    card=null
  ){

    const wrap =
      document.createElement(
        "section"
      );


    wrap.className =
      "panel";


    wrap.innerHTML = `

      <h2>

        ${
          card
            ? "Изменение реквизитов"
            : "Новые реквизиты"
        }

      </h2>


      <div class="grid">

        <div class="field">

          <label>
            Название
          </label>

          <input
            id="cTitle"
            value="${esc(
              card?.title ||
              ""
            )}">

        </div>


        <div class="field">

          <label>
            Номер карты
          </label>

          <input
            id="cNum"
            value="${esc(
              card?.card_number ||
              ""
            )}">

        </div>


        <div class="field">

          <label>
            Получатель
          </label>

          <input
            id="cRec"
            value="${esc(
              card?.recipient ||
              ""
            )}">

        </div>


        <div class="field">

          <label>
            Сумма залога
          </label>

          <input
            id="cAmt"
            type="number"
            value="${
              card?.amount ||
              0
            }">

        </div>


        <div class="field full">

          <label>
            Дополнительные реквизиты
          </label>

          <textarea
            id="cReq">${esc(
              card?.requisites ||
              ""
            )}</textarea>

        </div>

      </div>


      <div
        style="
          display:flex;
          flex-direction:column;
          gap:9px;
          margin-top:12px
        ">

        <label class="check">

          <input
            id="cActive"
            type="checkbox"
            ${
              card?.active !== 0
                ? "checked"
                : ""
            }>

          Активные реквизиты

        </label>


        <label class="check">

          <input
            id="cDefault"
            type="checkbox"
            ${
              card?.is_default
                ? "checked"
                : ""
            }>

          Использовать по умолчанию

        </label>

      </div>


      <div class="actions">

        <button
          class="btn primary"
          id="saveCard">

          Сохранить

        </button>


        <button
          class="btn"
          id="cancelCard">

          Отмена

        </button>

      </div>

    `;


    const panel =
      [
        ...document.querySelectorAll(
          "#content>.panel"
        )
      ][1];


    panel.after(
      wrap
    );


    $("#saveCard").onclick =
      async () => {

        const payload = {

          title:
            $("#cTitle")
              .value,

          card_number:
            $("#cNum")
              .value,

          recipient:
            $("#cRec")
              .value,

          requisites:
            $("#cReq")
              .value,

          amount:
            Number(
              $("#cAmt")
                .value
            ) || 0,

          active:
            $("#cActive")
              .checked,

          is_default:
            $("#cDefault")
              .checked

        };


        try{

          await api(
            card
              ? `/api/admin/reservation-cards/${card.id}`
              : "/api/admin/reservation-cards",
            {
              method:
                card
                  ? "PUT"
                  : "POST",

              body:
                JSON.stringify(
                  payload
                )
            }
          );


          toast(
            "Реквизиты сохранены"
          );


          renderDeposit();

        }catch(error){

          toast(
            error.message
          );

        }

      };


    $("#cancelCard").onclick =
      () =>
        wrap.remove();

  }


  function renderCards(){

    const box =
      $("#cardList");

    if(!box){

      return;

    }


    box.innerHTML =
      state.cards
        .map(
          c =>
            `

            <article
              class="item">

              <div
                class="item-head">

                <div>

                  <div
                    class="item-title">

                    ${esc(
                      c.title ||
                      "Реквизиты"
                    )}

                  </div>


                  <div
                    class="muted">

                    ${esc(
                      c.card_number ||
                      c.requisites ||
                      "—"
                    )}

                  </div>

                </div>


                <span
                  class="pill ${
                    c.active
                      ? "ok"
                      : "bad"
                  }">

                  ${
                    c.active
                      ? "Активно"
                      : "Выключено"
                  }

                </span>

              </div>


              <div class="row">

                <span>
                  Получатель
                </span>

                <strong>

                  ${esc(
                    c.recipient ||
                    "—"
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Залог
                </span>

                <strong>

                  ${Number(
                    c.amount ||
                    0
                  ).toLocaleString(
                    "ru-RU"
                  )} ₽

                </strong>

              </div>


              <div class="actions">

                <button
                  class="btn"
                  data-edit-card="${c.id}">

                  Изменить

                </button>


                <button
                  class="btn danger"
                  data-del-card="${c.id}">

                  Удалить

                </button>

              </div>

            </article>

            `
        )
        .join("")
      ||
      `
      <div class="empty">
        Реквизитов нет.
      </div>
      `;


    box
      .querySelectorAll(
        "[data-edit-card]"
      )
      .forEach(
        b =>
          b.onclick =
            () =>
              cardForm(
                state.cards.find(
                  c =>
                    Number(c.id) ===
                    Number(
                      b.dataset.editCard
                    )
                )
              )
      );


    box
      .querySelectorAll(
        "[data-del-card]"
      )
      .forEach(
        b =>
          b.onclick =
            async () => {

              if(
                !confirm(
                  "Удалить реквизиты?"
                )
              ){

                return;

              }


              try{

                await api(
                  `/api/admin/reservation-cards/${b.dataset.delCard}`,
                  {
                    method:"DELETE"
                  }
                );


                renderDeposit();

              }catch(error){

                toast(
                  error.message
                );

              }

            }
      );

  }


  async function renderSettings(){

    const d =
      await api(
        "/api/admin/settings"
      );


    state.settings =
      d.settings ||
      {};


    const keys = [

      "store_name",

      "contact_username",

      "contact_url",

      "channel_username",

      "channel_url",

      "reservation_text",

      "delivery_text",

      "pickup_text"

    ];


    $("#content").innerHTML = `

      <section class="panel">

        <h2>
          Настройки магазина
        </h2>


        <div class="grid">

          ${
            keys
              .map(
                key =>
                  `

                  <div
                    class="field full">

                    <label>
                      ${esc(key)}
                    </label>

                    <input
                      data-setting="${key}"
                      value="${esc(
                        state.settings[
                          key
                        ] ||
                        ""
                      )}">

                  </div>

                  `
              )
              .join("")
          }

        </div>


        <div class="actions">

          <button
            class="btn primary"
            id="saveSettings">

            Сохранить

          </button>

        </div>

      </section>

    `;


    $("#saveSettings").onclick =
      async () => {

        const settings={};


        document
          .querySelectorAll(
            "[data-setting]"
          )
          .forEach(
            element =>
              settings[
                element.dataset.setting
              ] =
                element.value
          );


        try{

          await api(
            "/api/admin/settings",
            {
              method:"PUT",

              body:
                JSON.stringify({
                  settings
                })
            }
          );


          toast(
            "Настройки сохранены"
          );

        }catch(error){

          toast(
            error.message
          );

        }

      };

  }


  async function render(){

    document
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        tab =>
          tab.classList.toggle(
            "active",
            tab.dataset.tab ===
            state.tab
          )
      );


    try{

      if(
        state.tab ===
        "orders"
      ){

        await renderOrders();

      }else if(
        state.tab ===
        "products"
      ){

        await renderProducts();

      }else if(
        state.tab ===
        "deposit"
      ){

        await renderDeposit();

      }else{

        await renderSettings();

      }

    }catch(error){

      $("#content").innerHTML = `

        <section class="panel">

          <div class="empty">

            ${esc(
              error.message
            )}

          </div>

        </section>

      `;

    }

  }


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab => {

        tab.onclick =
          () => {

            state.tab =
              tab.dataset.tab;

            render();

          };

      }
    );


  $("#closeBtn")
    ?.addEventListener(
      "click",
      () => {

        window.location.href =
          "/";

      }
    );


  async function boot(){

    $("#app")
      .classList
      .remove(
        "hidden"
      );


    if(!tg?.initData){

      $("#content").innerHTML = `

        <section class="panel">

          <div class="empty">

            Откройте админ-панель
            из Telegram.

          </div>

        </section>

      `;

      return;

    }


    try{

      const me =
        await api(
          "/api/admin/me"
        );


      if(
        !ADMIN_IDS.has(
          String(
            me.admin_id
          )
        )
      ){

        throw new Error(
          "Доступ запрещён"
        );

      }


      await render();

    }catch(e){

      $("#content").innerHTML = `

        <section class="panel">

          <h2>
            Ошибка загрузки
          </h2>

          <div class="muted">

            ${esc(
              e.message ||
              "Не удалось загрузить админ-панель"
            )}

          </div>


          <div class="actions">

            <button
              class="btn primary"
              id="retryAdmin">

              Повторить

            </button>

          </div>

        </section>

      `;


      $("#retryAdmin")
        ?.addEventListener(
          "click",
          boot
        );

    }

  }


  boot();

})();

</script>

</body>
</html>
