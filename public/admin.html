<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>IRoom — Admin</title>

<style>
:root{
  --bg:#050505;
  --panel:#101012;
  --panel2:#151518;
  --line:rgba(255,255,255,.08);
  --text:#f7f7f8;
  --muted:#8c8c95;
  --pink:#ff2d8d;
  --pink2:#ff4da5;
  --green:#39d98a;
  --red:#ff6868;
  --ease:cubic-bezier(.22,.8,.25,1)
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  border:0;
  color:inherit;
  cursor:pointer
}

body{
  min-height:100vh
}

.app{
  max-width:1180px;
  margin:auto;
  padding:
    calc(16px + env(safe-area-inset-top))
    16px
    calc(30px + env(safe-area-inset-bottom))
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}

.brand{
  font-size:22px;
  font-weight:850;
  letter-spacing:-.7px
}

.brand span{
  color:var(--pink)
}

.top-actions{
  display:flex;
  gap:8px
}

.btn{
  min-height:42px;
  padding:0 15px;
  border-radius:14px;
  background:#18181b;
  color:#ddd;
  border:1px solid var(--line);
  font-weight:750
}

.btn.primary{
  background:linear-gradient(135deg,#ff2d8d,#ff4da5);
  color:#fff;
  border:0
}

.btn.danger{
  color:#ff8585
}

.btn:active{
  transform:scale(.97)
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  padding-bottom:5px;
  margin-bottom:14px
}

.tab{
  white-space:nowrap;
  padding:10px 14px;
  border-radius:13px;
  background:#0e0e10;
  color:#888;
  border:1px solid var(--line);
  font-size:12px;
  font-weight:750
}

.tab.active{
  background:rgba(255,45,141,.13);
  border-color:rgba(255,45,141,.3);
  color:#ff70ad
}

.panel{
  background:linear-gradient(180deg,#111113,#0d0d0f);
  border:1px solid var(--line);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 18px 60px rgba(0,0,0,.2)
}

.panel h2{
  margin:0 0 13px;
  font-size:16px
}

.muted{
  color:var(--muted);
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px
}

.field.full{
  grid-column:1/-1
}

.field label{
  font-size:10px;
  color:#777780;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#09090b;
  color:#fff;
  border-radius:13px;
  padding:12px;
  font-size:13px
}

.field textarea{
  min-height:90px;
  resize:vertical
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#bbb
}

.check input{
  accent-color:var(--pink)
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px
}

.media-pick{
  position:relative;
  border:1px dashed rgba(255,255,255,.14);
  background:#09090b;
  border-radius:17px;
  padding:16px;
  text-align:center;
  color:#aaa
}

.media-pick input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0
}

.media-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px
}

.media-item{
  position:relative;
  aspect-ratio:1;
  background:#08080a;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line)
}

.media-item img,
.media-item video{
  width:100%;
  height:100%;
  object-fit:contain
}

.media-item .x{
  position:absolute;
  right:5px;
  top:5px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff
}

.cards{
  display:grid;
  gap:9px
}

.item{
  padding:13px;
  border:1px solid var(--line);
  background:#0a0a0c;
  border-radius:16px
}

.item-head{
  display:flex;
  justify-content:space-between;
  gap:10px
}

.item-title{
  font-weight:800
}

.pill{
  font-size:10px;
  border-radius:99px;
  padding:5px 8px;
  background:#19191c;
  color:#aaa
}

.pill.pending{
  color:#ffc06b
}

.pill.wait{
  color:#ffad52
}

.pill.ok{
  color:#56df9c
}

.pill.bad{
  color:#ff7777
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:6px 0;
  color:#aaa;
  font-size:12px
}

.row strong{
  color:#eee;
  text-align:right
}

.empty{
  padding:28px;
  text-align:center;
  color:#777
}

.login{
  min-height:80vh;
  display:flex;
  align-items:center;
  justify-content:center
}

.login .panel{
  width:min(440px,100%);
  text-align:center
}

.hidden{
  display:none!important
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#19191d;
  border:1px solid var(--line);
  padding:12px 16px;
  border-radius:14px;
  font-size:12px;
  z-index:99;
  transition:.3s var(--ease)
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.order-media{
  width:56px;
  height:56px;
  object-fit:contain;
  background:transparent;
  border-radius:10px
}

.order{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px
}

.order-main{
  min-width:0
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr
  }

  .field.full{
    grid-column:auto
  }

  .app{
    padding-left:12px;
    padding-right:12px
  }

  .top{
    align-items:flex-start
  }

  .brand{
    font-size:19px
  }

  .top-actions .btn{
    padding:0 11px
  }

  .media-list{
    grid-template-columns:repeat(3,1fr)
  }
}

.option-groups{
  display:grid;
  gap:12px;
  margin-top:2px
}

.option-group{
  padding:13px;
  border:1px solid var(--line);
  background:#09090b;
  border-radius:16px
}

.option-group-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px
}

.option-group-title{
  font-size:12px;
  font-weight:800
}

.option-group-sub{
  font-size:10px;
  color:#666
}

.option-add{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px 42px;
  gap:7px
}

.option-add input{
  width:100%;
  border:1px solid var(--line);
  outline:0;
  background:#101012;
  color:#fff;
  border-radius:11px;
  padding:10px;
  font-size:13px
}

.option-add input[type=number]{
  text-align:right
}

.option-add button{
  border:0;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800
}

.option-chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:9px
}

.option-chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:32px;
  padding:0 8px 0 11px;
  border:1px solid rgba(255,45,141,.24);
  border-radius:10px;
  background:rgba(255,45,141,.08);
  color:#eee;
  font-size:11px
}

.option-chip small{
  color:#ff77b1
}

.option-chip button{
  width:20px;
  height:20px;
  border-radius:7px;
  background:rgba(255,255,255,.07);
  color:#aaa;
  padding:0
}

@media(max-width:650px){

  .option-add{
    grid-template-columns:minmax(0,1fr) 85px 42px
  }

}
</style>
</head>

<body>

<div
  id="login"
  class="login hidden">

  <div class="panel">

    <div class="brand">

      IR<span style="color:#ff2d8d">
        oom
      </span>

      <small style="color:#777">
        ADMIN
      </small>

    </div>

    <p class="muted">
      Откройте админ-панель из Telegram.
    </p>

  </div>

</div>


<div
  id="app"
  class="app hidden">

  <header class="top">

    <div class="brand">

      IR<span>oom</span>

      <small
        style="
          color:#666;
          font-size:10px
        ">

        ADMIN

      </small>

    </div>

    <div class="top-actions">

      <button
        class="btn"
        id="closeBtn">

        Закрыть

      </button>

    </div>

  </header>


  <nav
    class="tabs"
    id="tabs">

    <button
      class="tab active"
      data-tab="orders">

      Заказы

    </button>

    <button
      class="tab"
      data-tab="products">

      Товары

    </button>

    <button
      class="tab"
      data-tab="deposit">

      Залог

    </button>

    <button
      class="tab"
      data-tab="settings">

      Настройки

    </button>

  </nav>


  <main id="content"></main>

</div>


<div
  id="toast"
  class="toast">
</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

(() => {

  const tg =
    window.Telegram?.WebApp || null;

  tg?.ready();
  tg?.expand();


  const ADMIN_IDS =
    new Set([
      "5082864281",
      "5975037118"
    ]);


  const state = {

    tab:"orders",

    orders:[],

    products:[],

    categories:[],

    cards:[],

    settings:{},

    media:[]

  };


  const $ =
    s =>
      document.querySelector(s);


  const esc =
    v =>
      String(v ?? "")
        .replace(
          /[&<>"']/g,
          c =>
            ({
              "&":"&amp;",
              "<":"&lt;",
              ">":"&gt;",
              "\"":"&quot;",
              "'":"&#039;"
            }[c])
        );


  const init =
    () =>
      String(
        tg?.initData || ""
      );


  const headers =
    () => ({
      "Content-Type":
        "application/json",

      "x-telegram-init-data":
        init()
    });


  function toast(text){

    const e =
      $("#toast");

    e.textContent =
      text;

    e.classList.add(
      "show"
    );

    clearTimeout(
      window.__toast
    );

    window.__toast =
      setTimeout(
        () =>
          e.classList.remove(
            "show"
          ),
        2600
      );

  }


  async function api(
    url,
    opt={}
  ){

    const r =
      await fetch(
        url,
        {
          ...opt,

          headers:{
            ...headers(),

            ...(opt.headers || {})
          }
        }
      );


    let d={};

    try{

      d =
        await r.json();

    }catch{}


    if(!r.ok){

      throw new Error(
        d.error ||
        "Ошибка запроса"
      );

    }


    return d;

  }


  function closeAdmin(){

    try{

      tg?.HapticFeedback
        ?.impactOccurred(
          "light"
        );

    }catch{}


    window.location.href = "/";

  }


  $("#closeBtn").onclick =
    closeAdmin;


  async function uploadFiles(
    files
  ){

    for(
      const file of files
    ){

      const fd =
        new FormData();

      fd.append(
        "file",
        file
      );


      const r =
        await fetch(
          "/api/admin/upload",
          {
            method:"POST",

            headers:{
              "x-telegram-init-data":
                init()
            },

            body:fd
          }
        );


      let d={};

      try{

        d =
          await r.json();

      }catch{}


      if(!r.ok){

        throw new Error(
          d.error ||
          "Не удалось загрузить файл"
        );

      }


      state.media.push({

        url:d.url,

        type:
          file.type.startsWith(
            "video/"
          )
          ? "video"
          : "image"

      });

    }


    renderProductMedia();

  }


  function renderProductMedia(){

    const box =
      $("#mediaList");

    if(!box) return;


    box.innerHTML =
      state.media
        .map(
          (m,i) =>
            `
            <div
              class="media-item">

              ${
                m.type === "video"
                ?
                `
                <video
                  src="${esc(m.url)}"
                  controls>
                </video>
                `
                :
                `
                <img
                  src="${esc(m.url)}"
                  alt="">
                `
              }

              <button
                type="button"
                class="x"
                data-remove-media="${i}">

                ×

              </button>

            </div>
            `
        )
        .join("");


    box
      .querySelectorAll(
        "[data-remove-media]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () => {

              state.media.splice(
                Number(
                  btn.dataset.removeMedia
                ),
                1
              );

              renderProductMedia();

            };

        }
      );

  }


  function statusText(
    status
  ){

    const found = {

      new:
        "Новый",

      confirmed:
        "Подтверждён",

      processing:
        "В обработке",

      ready:
        "Готов",

      completed:
        "Завершён",

      cancelled:
        "Отменён",

      rejected:
        "Отклонён"

    }[status];


    return found ||
      status ||
      "—";

  }


  function reservationText(
    status
  ){

    const found = {

      not_required:
        "Не требуется",

      pending_payment:
        "Ожидается оплата",

      pending:
        "Ожидается",

      awaiting_confirmation:
        "Проверка залога",

      confirmed:
        "Залог подтверждён",

      rejected:
        "Залог отклонён"

    }[status];


    return found ||
      status ||
      "—";

  }


  function formatPrice(
    value
  ){

    return Number(
      value || 0
    ).toLocaleString(
      "ru-RU"
    ) + " ₽";

  }


  async function loadOrders(){

    const data =
      await api(
        "/api/admin/orders"
      );


    state.orders =
      Array.isArray(
        data.orders
      )
      ?
      data.orders
      :
      [];

  }


  async function loadProducts(){

    const data =
      await api(
        "/api/admin/products"
      );


    state.products =
      Array.isArray(
        data.products
      )
      ?
      data.products
      :
      [];

  }


  async function loadCategories(){

    const data =
      await api(
        "/api/admin/categories"
      );


    state.categories =
      Array.isArray(
        data.categories
      )
      ?
      data.categories
      :
      [];

  }


  async function loadBanners(){

    const data =
      await api(
        "/api/admin/banners"
      );


    state.banners =
      Array.isArray(
        data.banners
      )
      ?
      data.banners
      :
      [];

  }


  async function renderOrders(){

    await loadOrders();


    $("#content").innerHTML = `

      <section class="panel">

        <div class="item-head">

          <div>

            <h2>
              Заказы
            </h2>

            <div class="muted">

              Всего:
              ${state.orders.length}

            </div>

          </div>


          <button
            class="btn danger"
            id="clearOrdersBtn">

            Очистить все заказы

          </button>

        </div>

      </section>


      <section class="panel">

        <div
          id="ordersList"
          class="cards">

        </div>

      </section>

    `;


    $("#clearOrdersBtn").onclick =
      clearAllOrders;


    renderOrderList();

  }


  function renderOrderList(){

    const box =
      $("#ordersList");

    if(!box) return;


    if(
      !state.orders.length
    ){

      box.innerHTML = `

        <div class="empty">

          Заказов пока нет.

        </div>

      `;

      return;

    }


    box.innerHTML =
      state.orders
        .map(
          order =>
            `

            <article
              class="item">

              <div
                class="item-head">

                <div>

                  <div
                    class="item-title">

                    ${esc(
                      order.order_number ||
                      order.public_number ||
                      `#${order.id}`
                    )}

                  </div>

                  <div
                    class="muted">

                    ${esc(
                      order.product_name ||
                      order.title ||
                      "Товар"
                    )}

                  </div>

                </div>


                <span
                  class="pill">

                  ${esc(
                    statusText(
                      order.status
                    )
                  )}

                </span>

              </div>


              <div class="row">

                <span>
                  Клиент
                </span>

                <strong>

                  ${esc(
                    order.customer_name ||
                    order.name ||
                    "—"
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Телефон / @username
                </span>

                <strong>

                  ${esc(
                    order.contact ||
                    order.phone ||
                    order.username ||
                    "—"
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Сумма
                </span>

                <strong>

                  ${formatPrice(
                    order.total_price ||
                    order.price
                  )}

                </strong>

              </div>


              <div class="row">

                <span>
                  Залог
                </span>

                <strong>

                  ${esc(
                    reservationText(
                      order.reservation_status
                    )
                  )}

                </strong>

              </div>


              <div class="actions">

                <select
                  class="btn"
                  data-status-id="${order.id}">

                  <option
                    value="new"
                    ${
                      order.status === "new"
                      ? "selected"
                      : ""
                    }>

                    Новый

                  </option>

                  <option
                    value="confirmed"
                    ${
                      order.status === "confirmed"
                      ? "selected"
                      : ""
                    }>

                    Подтверждён

                  </option>

                  <option
                    value="processing"
                    ${
                      order.status === "processing"
                      ? "selected"
                      : ""
                    }>

                    В обработке

                  </option>

                  <option
                    value="ready"
                    ${
                      order.status === "ready"
                      ? "selected"
                      : ""
                    }>

                    Готов

                  </option>

                  <option
                    value="completed"
                    ${
                      order.status === "completed"
                      ? "selected"
                      : ""
                    }>

                    Завершён

                  </option>

                  <option
                    value="cancelled"
                    ${
                      order.status === "cancelled"
                      ? "selected"
                      : ""
                    }>

                    Отменён

                  </option>

                  <option
                    value="rejected"
                    ${
                      order.status === "rejected"
                      ? "selected"
                      : ""
                    }>

                    Отклонён

                  </option>

                </select>


                <button
                  class="btn"
                  data-save-status="${order.id}">

                  Сохранить статус

                </button>


                <select
                  class="btn"
                  data-reservation-id="${order.id}">

                  <option
                    value="not_required"
                    ${
                      order.reservation_status === "not_required"
                      ? "selected"
                      : ""
                    }>

                    Не требуется

                  </option>

                  <option
                    value="pending_payment"
                    ${
                      order.reservation_status === "pending_payment"
                      ? "selected"
                      : ""
                    }>

                    Ожидается оплата

                  </option>

                  <option
                    value="pending"
                    ${
                      order.reservation_status === "pending"
                      ? "selected"
                      : ""
                    }>

                    Ожидается

                  </option>

                  <option
                    value="awaiting_confirmation"
                    ${
                      order.reservation_status === "awaiting_confirmation"
                      ? "selected"
                      : ""
                    }>

                    Проверка залога

                  </option>

                  <option
                    value="confirmed"
                    ${
                      order.reservation_status === "confirmed"
                      ? "selected"
                      : ""
                    }>

                    Залог подтверждён

                  </option>

                  <option
                    value="rejected"
                    ${
                      order.reservation_status === "rejected"
                      ? "selected"
                      : ""
                    }>

                    Залог отклонён

                  </option>

                </select>


                <button
                  class="btn"
                  data-save-reservation="${order.id}">

                  Сохранить залог

                </button>

              </div>

            </article>

            `
        )
        .join("");


    box
      .querySelectorAll(
        "[data-save-status]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              updateOrderStatus(
                btn.dataset.saveStatus
              );

        }
      );


    box
      .querySelectorAll(
        "[data-save-reservation]"
      )
      .forEach(
        btn => {

          btn.onclick =
            () =>
              updateReservation(
                btn.dataset.saveReservation
              );

        }
      );

  }


  async function updateOrderStatus(
    id
  ){

    const select =
      document.querySelector(
        `[data-status-id="${CSS.escape(String(id))}"]`
      );


    if(!select){

      return;

    }


    try{

      await api(
        `/api/admin/orders/${encodeURIComponent(id)}/status`,
        {
          method:"PUT",

          body:
            JSON.stringify({
              status:
                select.value
            })
        }
      );


      toast(
        "Статус заказа сохранён"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }


  async function updateReservation(
    id
  ){

    const select =
      document.querySelector(
        `[data-reservation-id="${CSS.escape(String(id))}"]`
      );


    if(!select){

      return;

    }


    try{

      await api(
        `/api/admin/orders/${encodeURIComponent(id)}/reservation`,
        {
          method:"PUT",

          body:
            JSON.stringify({
              reservation_status:
                select.value
            })
        }
      );


      toast(
        "Статус залога сохранён"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }


  async function clearAllOrders(){

    if(
      !confirm(
        "Удалить все заказы?\n\n" +
        "Это действие нельзя отменить."
      )
    ){

      return;

    }


    if(
      !confirm(
        "Точно удалить ВСЕ заказы?"
      )
    ){

      return;

    }


    try{

      await api(
        "/api/admin/orders",
        {
          method:"DELETE"
        }
      );


      toast(
        "Все заказы удалены"
      );


      await renderOrders();

    }catch(error){

      toast(
        error.message
      );

    }

  }

</script>

  function renderProductList(){

    const box =
      $("#productsList");


    if(!box){

      return;

    }


    const query =
      String(
        $("#productSearch")
          ?.value ||
        ""
      )
      .trim()
      .toLowerCase();


    const category =
      String(
        $("#productCategoryFilter")
          ?.value ||
        ""
      );


    const list =
      state.products.filter(
        product => {

          const name =
            String(
              product.name ||
              product.title ||
              ""
            )
            .toLowerCase();


          const matchesQuery =
            !query ||
            name.includes(
              query
            );


          const matchesCategory =
            !category ||
            String(
              product.category_id ||
              ""
            ) ===
            category;


          return (
            matchesQuery &&
            matchesCategory
          );

        }
      );


    if(!list.length){

      box.innerHTML = `

        <div class="empty">

          Товары не найдены.

        </div>

      `;

      return;

    }


    box.innerHTML =
      list
        .map(
          product => {

            const image =
              product.image_url ||
              product.image ||
              "";


            return `

              <article
                class="item">

                <div
                  class="item-head">

                  <div
                    style="
                      display:flex;
                      gap:10px;
                      align-items:center;
                    ">

                    ${
                      image
                      ?
                      `
                      <img
                        src="${esc(image)}"
                        style="
                          width:58px;
                          height:58px;
                          border-radius:13px;
                          object-fit:contain;
                          background:#070709;
                        ">
                      `
                      :
                      ""
                    }


                    <div>

                      <div
                        class="item-title">

                        ${esc(
                          product.name ||
                          product.title ||
                          "Без названия"
                        )}

                      </div>


                      <div
                        class="muted">

                        ${esc(
                          product.category_name ||
                          "Без категории"
                        )}

                      </div>

                    </div>

                  </div>


                  <span
                    class="pill">

                    ${formatPrice(
                      product.price
                    )}

                  </span>

                </div>


                <div class="row">

                  <span>
                    Артикул
                  </span>

                  <strong>

                    ${esc(
                      product.sku ||
                      "—"
                    )}

                  </strong>

                </div>


                <div class="row">

                  <span>
                    ID
                  </span>

                  <strong>

                    ${esc(
                      product.id
                    )}

                  </strong>

                </div>


                <div class="actions">

                  <button
                    class="btn"
                    data-edit-product="${product.id}">

                    Изменить

                  </button>


                  <button
                    class="btn danger"
                    data-delete-product="${product.id}">

                    Удалить

                  </button>

                </div>

              </article>

            `;

          }
        )
        .join("");


    box
      .querySelectorAll(
        "[data-edit-product]"
      )
      .forEach(
        button => {

          button.onclick =
            () => {

              const product =
                state.products.find(
                  item =>
                    String(
                      item.id
                    ) ===
                    String(
                      button.dataset.editProduct
                    )
                );


              if(product){

                openProductModal(
                  product
                );

              }

            };

        }
      );


    box
      .querySelectorAll(
        "[data-delete-product]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              deleteProduct(
                button.dataset.deleteProduct
              );

        }
      );

  }


  async function deleteProduct(
    id
  ){

    if(
      !confirm(
        "Удалить этот товар?"
      )
    ){

      return;

    }


    try{

      await api(
        `/api/admin/products/${encodeURIComponent(id)}`,
        {
          method:"DELETE"
        }
      );


      toast(
        "Товар удалён"
      );


      await renderProducts();

    }catch(error){

      toast(
        error.message
      );

    }

  }

                          }>

                          )}

                        </option>
                        `
                    )

                }

              </select>

            </div>


            <div class="field">

              <label>
                Цена
              </label>

              <input
                id="pmPrice"
                type="number"
                min="0"
                value="${
                  Number(
                    product?.price ||

                  )

            </div>


            <div class="field">

              <label>
                Старая цена
              </label>

              <input
                id="pmOldPrice"

                min="0"
                value="${
                  Number(
                    product?.old_price ||
                    0
                  )
                }">

            </div>


            <div class="field full">

              <label>
                Описание
              </label>

              <textarea
                id="pmDescription">${esc(
                  product?.description ||
                  ""
                )}</textarea>

            </div>


            <div class="field">

              <label>
                Артикул
              </label>

              <input
                id="pmSku"
                value="${esc(
                  product?.sku ||
                  ""
                )}">

            </div>


            <div class="field">

              <label>
                Сортировка
              </label>

              <input
                id="pmSort"
                type="number"
                min="0"
                value="${
                  Number(
                    product?.sort_order ||
                    0
                  )
                }">

            </div>


            <div class="field full">

              <label>
                Основное изображение
              </label>

              <input
                id="pmImage"
                value="${esc(
                  product?.image_url ||
                  product?.image ||
                  ""
                )}">

            </div>

          </div>


          <div
            style="
              margin-top:14px;
            ">

            <div
              style="
                font-size:12px;
                font-weight:800;
                margin-bottom:8px;
              ">

              Фото и видео

            </div>


            <label
              class="media-pick">

              <input
                id="pmMedia"

            <div

            </div>

          </div>


          <div
            class="option-groups"

            ">


            <div
              class="option-group">

              <div
                class="option-group-head">

                <div>

                  <div
                    class="option-group-title">

                    Память

                  </div>

                  <div
                    class="option-group-sub">

                    Например 256GB / 512GB / 1TB

                  </div>

                </div>

              </div>


              <div
                id="memoryOptions"
                class="option-chips">
              </div>


              <div
                class="option-add">

                <input
                  id="newMemory"
                  placeholder="256GB">


                <input
                  id="newMemoryPrice"
                  type="number"
                  placeholder="+ ₽">


                <button
                  type="button"
                  id="addMemory">

                  +

                </button>

              </div>

            </div>


            <div
              class="option-group">

              <div
                class="option-group-head">

                <div>

                  <div
                    class="option-group-title">

                    Цвет

                  </div>

                  <div
                    class="option-group-sub">

                    Например Orange / Black

                  </div>

                </div>

              </div>


              <div
                id="colorOptions"
                class="option-chips">
              </div>


              <div
                class="option-add">

                <input
                  id="newColor"
                  placeholder="Orange">


                <input
                  id="newColorPrice"
                  type="number"
                  placeholder="+ ₽">


                <button
                  type="button"
                  id="addColor">

                  +

                </button>

              </div>

            </div>


            <div
              class="option-group">

              <div
                class="option-group-head">

                <div>

                  <div
                    class="option-group-title">

                    SIM

                  </div>

                  <div
                    class="option-group-sub">

                    eSIM + eSIM / SIM + eSIM / SIM + SIM

                  </div>

                </div>

              </div>


              <div
                id="simOptions"
                class="option-chips">
              </div>


              <div
                class="option-add">

                <input
                  id="newSim"
                  placeholder="eSIM + eSIM">


                <input
                  id="newSimPrice"
                  type="number"
                  placeholder="+ ₽">


                <button
                  type="button"
                  id="addSim">

                  +

                </button>

              </div>

            </div>


            <div
              class="option-group">

              <div
                class="option-group-head">

                <div>

                  <div
                    class="option-group-title">

                    Регион

                  </div>

                  <div
                    class="option-group-sub">

                    США / Индия / Гонконг / Китай / Япония

                  </div>

                </div>

              </div>


              <div
                id="regionOptions"
                class="option-chips">
              </div>


              <div
                class="option-add">

                <input
                  id="newRegion"
                  placeholder="США">


                <input
                  id="newRegionPrice"
                  type="number"
                  placeholder="+ ₽">


                <button
                  type="button"
                  id="addRegion">

                  +

                </button>

              </div>

          </div>


          <div

            ">

            <div

                font-size:12px;

                margin-bottom:8px;
              ">

            </div>


            <div

          </div>

        </div>

          <button

          "string"

            url:item,
            type:"image"

        }else if(
          item &&
          item.url
        ){

          state.media.push({
            url:item.url,
            type:
              item.type ||
              "image"
          });

        }

      }
    );


    renderProductMedia();


    document
      .querySelectorAll(
        "[data-close-product-modal]"
      )
      .forEach(
        element => {

          element.onclick =
            () =>
              modal.remove();

        }
      );


    $("#pmMedia").onchange =
      async event => {

        const files =
          Array.from(
            event.target.files ||
            []
          );


        if(!files.length){

          return;

        }


        try{

          await uploadFiles(
            files
          );

          toast(
            "Файлы загружены"
          );

        }catch(error){

          toast(
            error.message
          );

        }


        event.target.value =
          "";

      };


    const optionState = {

      memory:
        Array.isArray(
          product?.memories
        )
        ?
        product.memories
        :
        [],

      color:
        Array.isArray(
          product?.colors
        )
        ?
        product.colors
        :
        [],

      sim:
        Array.isArray(
          product?.sim_types
        )
        ?
        product.sim_types
        :
        [],

      region:
        Array.isArray(
          product?.regions
        )
        ?
        product.regions
        :
        []

    };


    function renderOptions(){

      const configs = [

        [
          "memory",
          "#memoryOptions"
        ],

        [
          "color",
          "#colorOptions"
        ],

        [
          "sim",
          "#simOptions"
        ],

        [
          "region",
          "#regionOptions"
        ]

      ];


      configs.forEach(
        ([type,selector]) => {

          const box =
            $(selector);

          if(!box){

            return;

          }


          box.innerHTML =
            optionState[type]
              .map(
                (item,index) => {

                  const value =
                    typeof item ===
                    "string"
                    ?
                    item
                    :
                    item.name ||
                    item.value ||
                    "";


                  const price =
                    typeof item ===
                    "object"
                    ?
                    Number(
                      item.price ||
                      item.price_delta ||
                      0
                    )
                    :
                    0;


                  return `

                    <span
                      class="option-chip">

                      ${esc(value)}

                      ${
                        price
                        ?
                        `
                        <small>
                          ${
                            price > 0
                            ? "+"
                            : ""
                          }${formatPrice(
                            price
                          )}
                        </small>
                        `
                        :
                        ""
                      }


                      <button
                        type="button"
                        data-remove-option="${type}:${index}">

                        ×

                      </button>

                    </span>

                  `;

                }
              )
              .join("");


          box
            .querySelectorAll(
              "[data-remove-option]"
            )
            .forEach(
              button => {

                button.onclick =
                  () => {

                    const [
                      type,
                      index
                    ] =
                      button
                        .dataset
                        .removeOption
                        .split(":");


                    optionState[type]
                      .splice(
                        Number(index),
                        1
                      );


                    renderOptions();
                    renderMatrix();

                  };

              }
            );

        }
      );

    }


    function addOption(
      type,
      value,
      price
    ){

      const clean =
        String(
          value ||
          ""
        ).trim();


      if(!clean){

        return;

      }


      optionState[type]
        .push({
          name:clean,
          price:
            Number(
              price ||
              0
            )
        });


      renderOptions();
      renderMatrix();

    }


    $("#addMemory").onclick =
      () => {

        addOption(
          "memory",
          $("#newMemory").value,
          $("#newMemoryPrice").value
        );


        $("#newMemory").value="";
        $("#newMemoryPrice").value="";

      };


    $("#addColor").onclick =
      () => {

        addOption(
          "color",
          $("#newColor").value,
          $("#newColorPrice").value
        );


        $("#newColor").value="";
        $("#newColorPrice").value="";

      };


    $("#addSim").onclick =
      () => {

        addOption(
          "sim",
          $("#newSim").value,
          $("#newSimPrice").value
        );


        $("#newSim").value="";
        $("#newSimPrice").value="";

      };


    $("#addRegion").onclick =
      () => {

        addOption(
          "region",
          $("#newRegion").value,
          $("#newRegionPrice").value
        );


        $("#newRegion").value="";
        $("#newRegionPrice").value="";

      };


    function renderMatrix(){

      const box =
        $("#priceMatrix");


      if(!box){

        return;

      }


      const memories =
        optionState.memory;


      const colors =
        optionState.color;


      const sims =
        optionState.sim;


      const regions =
        optionState.region;


      if(
        !memories.length &&
        !colors.length &&
        !sims.length &&
        !regions.length
      ){

        box.innerHTML = `

          <div class="empty">

            Добавьте варианты товара.

          </div>

        `;

        return;

      }


      const values = {


        memory:
          memories.length
          ?
          memories
          :
          [{name:"—",price:0}],


        color:
          colors.length
          ?
          colors
          :
          [{name:"—",price:0}],


        sim:
          sims.length
          ?
          sims
          :
          [{name:"—",price:0}],


        region:
          regions.length
          ?
          regions
          :
          [{name:"—",price:0}]

      };


      const rows=[];


      values.region.forEach(
        region => {

          values.memory.forEach(
            memory => {

              values.color.forEach(
                color => {

                  values.sim.forEach(
                    sim => {

                      const key =
                        [
                          region.name,
                          memory.name,
                          color.name,
                          sim.name
                        ]
                        .join("|");


                      const base =
                        Number(
                          product?.price ||
                          0
                        );


                      const delta =
                        Number(
                          region.price ||
                          0
                        ) +
                        Number(
                          memory.price ||
                          0
                        ) +
                        Number(
                          color.price ||
                          0
                        ) +
                        Number(
                          sim.price ||
                          0
                        );


                      rows.push({

                        key,

                        region:
                          region.name,

                        memory:
                          memory.name,

                        color:
                          color.name,

                        sim:
                          sim.name,

                        price:
                          base + delta

                      });

                    }
                  );

                }
              );

            }
          );

        }
      );


      box.innerHTML =
        rows
          .map(
            row =>
              `

              <div
                class="item">

                <div
                  class="row">

                  <span>
                    Регион
                  </span>

                  <strong>
                    ${esc(row.region)}
                  </strong>

                </div>


                <div
                  class="row">

                  <span>
                    Память
                  </span>

                  <strong>
                    ${esc(row.memory)}
                  </strong>

                </div>


                <div
                  class="row">

                  <span>
                    Цвет
                  </span>

                  <strong>
                    ${esc(row.color)}
                  </strong>

                </div>


                <div
                  class="row">

                  <span>
                    SIM
                  </span>

                  <strong>
                    ${esc(row.sim)}
                  </strong>

                </div>


                <div
                  class="field"
                  style="
                    margin-top:8px;
                  ">

                  <label>
                    Цена
                  </label>

                  <input
                    type="number"
                    min="0"
                    value="${row.price}"
                    data-matrix-price="${esc(row.key)}">

                </div>

              </div>

              `
          )
          .join("");

    }


    renderOptions();
    renderMatrix();


    $("#saveProduct").onclick =
      async () => {

        const payload = {

          name:
            $("#pmName").value.trim(),

          category_id:
            $("#pmCategory").value
              ?
              Number(
                $("#pmCategory").value
              )
              :
              null,

          price:
            Number(
              $("#pmPrice").value
            ) || 0,

          old_price:

        element => {

          element.classList.toggle(
            "active",
            element.dataset.tab ===
            tab
          );

        }
      );


    try{

      if(
        tab === "orders"
      ){

        await renderOrders();

      }else if(
        tab === "products"
      ){

        await renderProducts();

      }else if(
        tab === "deposit"
      ){

        await renderReservation();

      }else if(
        tab === "categories"
      ){

        await renderCategories();

      }else if(
        tab === "banners"
      ){

        await renderBanners();

      }else if(
        tab === "pickup"
      ){

        await renderPickup();

      }else if(
        tab === "promocodes"
      ){

        await renderPromocodes();

      }else{

        await renderSettings();

      }

      $("#content").innerHTML = `

        <section class="panel">

              "Не удалось загрузить раздел"

        await api(
          "/api/admin/me"
