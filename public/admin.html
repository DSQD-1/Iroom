<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>IRoom — Admin</title>

  <style>

    :root{
      --bg:#050505;
      --panel:#101012;
      --panel2:#151518;
      --line:rgba(255,255,255,.08);
      --text:#f7f7f8;
      --muted:#8c8c95;

      --pink:#ff2d8d;
      --pink2:#ff4da5;

      --green:#39d98a;
      --red:#ff6868;

      --ease:cubic-bezier(.22,.8,.25,1);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      border:0;
      color:inherit;
      cursor:pointer;
    }

    body{
      min-height:100vh;
    }

    .app{
      max-width:1180px;
      margin:auto;

      padding:
        calc(16px + env(safe-area-inset-top))
        16px
        calc(24px + env(safe-area-inset-bottom));

      min-height:100vh;
    }

    .hidden{
      display:none !important;
    }

    /* =====================================================
       LOGIN
    ====================================================== */

    #login{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,45,141,.10),
          transparent 40%
        ),
        #050505;
    }

    .login-card{
      width:100%;
      max-width:390px;

      padding:28px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:24px;

      background:
        linear-gradient(
          180deg,
          #111114,
          #0b0b0d
        );

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.45);
    }

    .login-logo{
      width:58px;
      height:58px;

      display:grid;
      place-items:center;

      margin-bottom:18px;

      border-radius:17px;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--pink2)
        );

      color:#fff;

      font-size:25px;
      font-weight:900;

      box-shadow:
        0 12px 30px
        rgba(255,45,141,.25);
    }

    .login-title{
      font-size:25px;
      font-weight:900;

      margin-bottom:7px;
    }

    .login-subtitle{
      color:var(--muted);
      font-size:14px;
      line-height:1.45;
    }

    /* =====================================================
       HEADER
    ====================================================== */

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:14px;

      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-logo{
      width:44px;
      height:44px;

      display:grid;
      place-items:center;

      border-radius:13px;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--pink2)
        );

      color:#fff;

      font-weight:900;
      font-size:19px;
    }

    .brand-title{
      font-size:18px;
      font-weight:900;
    }

    .brand-subtitle{
      color:var(--muted);
      font-size:11px;
      margin-top:2px;
    }

    /* =====================================================
       AI BUTTON
    ====================================================== */

    .ai-admin-open{
      display:flex;
      align-items:center;
      gap:7px;

      min-height:42px;

      padding:
        0
        13px;

      border:
        1px solid
        rgba(255,45,141,.28);

      border-radius:13px;

      background:
        linear-gradient(
          180deg,
          rgba(255,45,141,.15),
          rgba(255,45,141,.07)
        );

      color:#ff5ba8;

      font-size:13px;
      font-weight:800;

      transition:
        transform .18s var(--ease),
        background .18s var(--ease);
    }

    .ai-admin-open:active{
      transform:scale(.96);
    }

    .ai-admin-open-icon{
      font-size:16px;
      line-height:1;
    }

    /* =====================================================
       TABS
    ====================================================== */

    .tabs{
      display:flex;

      gap:7px;

      padding:5px;

      margin-bottom:16px;

      overflow-x:auto;

      border:
        1px solid
        rgba(255,255,255,.06);

      border-radius:15px;

      background:#0d0d0f;

      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      flex:
        0 0 auto;

      min-height:38px;

      padding:
        0
        13px;

      border-radius:10px;

      background:transparent;

      color:#85858d;

      font-size:13px;
      font-weight:700;

      transition:
        background .18s var(--ease),
        color .18s var(--ease);
    }

    .tab.active{
      background:#1a1a1e;
      color:#fff;
    }

    /* =====================================================
       CONTENT
    ====================================================== */

    #content{
      min-height:300px;
    }

    .panel{
      background:var(--panel);

      border:
        1px solid
        var(--line);

      border-radius:20px;

      padding:16px;

      margin-bottom:14px;
    }

    .panel-title{
      font-size:17px;
      font-weight:900;
    }

    .panel-subtitle{
      margin-top:4px;

      color:var(--muted);

      font-size:12px;
      line-height:1.4;
    }

    /* =====================================================
       ORDERS
    ====================================================== */

    .order-card{
      padding:15px;

      margin-bottom:10px;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius:16px;

      background:#111114;
    }

    .order-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;

      gap:10px;
    }

    .order-title{
      font-weight:800;
      font-size:14px;
    }

    .order-id{
      margin-top:4px;

      color:#77777f;

      font-size:11px;
    }

    .status{
      padding:
        6px
        9px;

      border-radius:9px;

      font-size:10px;
      font-weight:800;

      white-space:nowrap;
    }

    .status.pending{
      background:rgba(255,193,7,.10);
      color:#ffc107;
    }

    .status.ready{
      background:rgba(57,217,138,.10);
      color:var(--green);
    }

    .status.completed{
      background:rgba(57,217,138,.10);
      color:var(--green);
    }

    .status.cancelled{
      background:rgba(255,104,104,.10);
      color:var(--red);
    }

    /* =====================================================
       PRODUCTS
    ====================================================== */

    .products-grid{
      display:grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(220px,1fr)
        );

      gap:12px;
    }

    .product-card{
      overflow:hidden;

      border:
        1px solid
        rgba(255,255,255,.07);

      border-radius:17px;

      background:#111114;
    }

    .product-image{
      width:100%;
      aspect-ratio:1/1;

      object-fit:cover;

      background:#18181b;
    }

    .product-body{
      padding:13px;
    }

    .product-name{
      font-size:14px;
      font-weight:800;

      margin-bottom:6px;
    }

    .product-price{
      font-size:16px;
      font-weight:900;

      color:#fff;
    }

    .product-old-price{
      margin-left:6px;

      color:#6e6e75;

      text-decoration:line-through;

      font-size:12px;
    }

    .product-actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:7px;

      margin-top:11px;
    }

    .product-actions button{
      min-height:36px;

      border-radius:10px;

      background:#19191d;

      color:#fff;

      font-size:12px;
      font-weight:700;
    }

    .product-actions button.primary{
      background:var(--pink);
    }

    /* =====================================================
       FORMS
    ====================================================== */

    .form-grid{
      display:grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap:12px;
    }

    .form-group{
      margin-bottom:13px;
    }

    .form-group.full{
      grid-column:1/-1;
    }

    .form-label{
      display:block;

      margin-bottom:7px;

      color:#8c8c95;

      font-size:11px;
      font-weight:700;
    }

    .form-input,
    .form-textarea,
    .form-select{
      width:100%;

      padding:
        11px
        12px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:11px;

      outline:none;

      background:#151518;

      color:#fff;

      font-size:13px;
    }

    .form-textarea{
      min-height:90px;
      resize:vertical;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus{
      border-color:
        rgba(255,45,141,.55);
    }

    .save-btn{
      width:100%;

      min-height:44px;

      border-radius:12px;

      background:var(--pink);

      color:#fff;

      font-weight:900;

      font-size:13px;
    }

    /* =====================================================
       TOAST
    ====================================================== */

    .toast{
      position:fixed;

      left:50%;
      bottom:
        calc(
          20px +
          env(safe-area-inset-bottom)
        );

      transform:
        translateX(-50%)
        translateY(20px);

      z-index:10000;

      max-width:
        calc(100vw - 30px);

      padding:
        11px
        15px;

      border:
        1px solid
        rgba(255,255,255,.10);

      border-radius:12px;

      background:#18181b;

      color:#fff;

      font-size:12px;
      font-weight:700;

      opacity:0;
      pointer-events:none;

      transition:
        opacity .2s var(--ease),
        transform .2s var(--ease);
    }

    .toast.show{
      opacity:1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =====================================================
       AI OVERLAY
    ====================================================== */

    .ai-admin-overlay{
      position:fixed;

      inset:0;

      z-index:9999;

      display:none;
    }

    .ai-admin-overlay.active{
      display:block;
    }

    .ai-admin-overlay.hidden{
      display:none;
    }

    .ai-admin-backdrop{
      position:absolute;

      inset:0;

      background:
        rgba(0,0,0,.72);

      backdrop-filter:
        blur(9px);
    }

    .ai-admin-sheet{
      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:
        min(
          760px,
          94vh
        );

      display:flex;
      flex-direction:column;

      overflow:hidden;

      background:
        linear-gradient(
          180deg,
          #0b0b0e,
          #070709
        );

      border:
        1px solid
        rgba(255,255,255,.09);

      border-bottom:0;

      border-radius:
        24px
        24px
        0
        0;

      box-shadow:
        0 -25px 80px
        rgba(0,0,0,.6);
    }

    .ai-admin-header{
      display:flex;
      align-items:center;

      gap:11px;

      padding:
        14px
        15px;

      border-bottom:
        1px solid
        rgba(255,255,255,.07);
    }

    .ai-admin-avatar{
      width:38px;
      height:38px;

      flex:0 0 38px;

      display:grid;
      place-items:center;

      border-radius:12px;

      background:
        linear-gradient(
          135deg,
          rgba(255,45,141,.22),
          rgba(255,45,141,.08)
        );

      border:
        1px solid
        rgba(255,45,141,.25);

      color:#ff5ba8;

      font-size:19px;
      font-weight:900;
    }

    .ai-admin-title{
      min-width:0;
      flex:1;

      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .ai-admin-title strong{
      font-size:15px;
      font-weight:900;
    }

    .ai-admin-title span{
      color:#77777f;
      font-size:11px;
    }

    .ai-admin-close{
      width:36px;
      height:36px;

      display:grid;
      place-items:center;

      border-radius:11px;

      background:#151518;

      color:#fff;

      font-size:21px;
    }

    .ai-admin-messages{
      flex:1;

      overflow-y:auto;

      padding:
        15px;

      display:flex;
      flex-direction:column;

      gap:9px;
    }

    .ai-admin-message{
      max-width:88%;

      padding:
        10px
        12px;

      border-radius:15px;

      font-size:13px;
      line-height:1.45;

      white-space:pre-wrap;
      word-break:break-word;
    }

    .ai-admin-message.user{
      align-self:flex-end;

      background:var(--pink);

      color:#fff;

      border-bottom-right-radius:5px;
    }

    .ai-admin-message.assistant{
      align-self:flex-start;

      background:#151518;

      border:
        1px solid
        rgba(255,255,255,.08);

      color:#eee;

      border-bottom-left-radius:5px;
    }

    .ai-admin-quick{
      display:flex;

      gap:7px;

      padding:
        9px
        11px;

      overflow-x:auto;

      border-top:
        1px solid
        rgba(255,255,255,.06);

      scrollbar-width:none;
    }

    .ai-admin-quick::-webkit-scrollbar{
      display:none;
    }

    .ai-admin-quick button{
      flex:0 0 auto;

      padding:
        8px
        11px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:20px;

      background:#111114;

      color:#ddd;

      font-size:11px;
      font-weight:700;

      white-space:nowrap;
    }

    .ai-admin-input-wrap{
      display:flex;
      align-items:flex-end;

      gap:8px;

      padding:
        9px
        11px
        calc(
          10px +
          env(safe-area-inset-bottom)
        );

      border-top:
        1px solid
        rgba(255,255,255,.07);

      background:#09090b;
    }

    .ai-admin-input{
      flex:1;

      min-height:44px;
      max-height:130px;

      resize:none;

      padding:
        12px
        13px;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius:14px;

      outline:none;

      background:#151518;

      color:#fff;

      font-size:13px;
    }

    .ai-admin-input:focus{
      border-color:
        rgba(255,45,141,.55);
    }

    .ai-admin-send{
      width:44px;
      height:44px;

      flex:0 0 44px;

      display:grid;
      place-items:center;

      border-radius:14px;

      background:var(--pink);

      color:#fff;

      font-size:17px;
    }

    .ai-admin-send:disabled{
      opacity:.45;
    }

    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:650px){

      .app{
        padding-left:12px;
        padding-right:12px;
      }

      .header{
        align-items:flex-start;
      }

      .ai-admin-open{
        padding:0 11px;
      }

      .ai-admin-open span{
        display:none;
      }

      .products-grid{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

      .form-grid{
        grid-template-columns:1fr;
      }

      .form-group.full{
        grid-column:auto;
      }

      .product-actions{
        grid-template-columns:1fr;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <div
    id="login"
  >

    <div
      class="login-card"
    >

      <div
        class="login-logo"
      >
        I
      </div>

      <div
        class="login-title"
      >
        IRoom Admin
      </div>

      <div
        class="login-subtitle"
      >
        Проверяем доступ к панели управления...
      </div>

    </div>

  </div>


  <!-- =====================================================
       APP
  ====================================================== -->

  <main
    id="app"
    class="app hidden"
  >

    <header
      class="header"
    >

      <div
        class="brand"
      >

        <div
          class="brand-logo"
        >
          I
        </div>

        <div>

          <div
            class="brand-title"
          >
            IRoom
          </div>

          <div
            class="brand-subtitle"
          >
            Панель администратора
          </div>

        </div>

      </div>


      <button
        id="aiAdminBtn"
        class="ai-admin-open"
        type="button"
      >

        <span
          class="ai-admin-open-icon"
        >
          ✦
        </span>

        <span>
          IRoom AI
        </span>

      </button>

    </header>


    <!-- ===================================================
         TABS
    ==================================================== -->

    <nav
      class="tabs"
    >

      <button
        class="tab active"
        data-tab="orders"
        type="button"
      >
        Заказы
      </button>

      <button
        class="tab"
        data-tab="products"
        type="button"
      >
        Товары
      </button>

      <button
        class="tab"
        data-tab="deposit"
        type="button"
      >
        Залог
      </button>

      <button
        class="tab"
        data-tab="settings"
        type="button"
      >
        Настройки
      </button>

    </nav>


    <section
      id="content"
    ></section>

  </main>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =====================================================
       IROOM AI
  ====================================================== -->

  <div
    id="aiAdminOverlay"
    class="ai-admin-overlay hidden"
  >

    <div
      class="ai-admin-backdrop"
      id="aiAdminBackdrop"
    ></div>

    <section
      class="ai-admin-sheet"
      role="dialog"
      aria-modal="true"
      aria-label="IRoom AI"
    >

      <header
        class="ai-admin-header"
      >

        <div
          class="ai-admin-avatar"
        >
          ✦
        </div>

        <div
          class="ai-admin-title"
        >

          <strong>
            IRoom AI
          </strong>

          <span>
            Управление магазином
          </span>

        </div>

        <button
          class="ai-admin-close"
          id="aiAdminClose"
          type="button"
        >
          ×
        </button>

      </header>


      <div
        id="aiAdminMessages"
        class="ai-admin-messages"
      ></div>


      <div
        class="ai-admin-quick"
        id="aiAdminQuick"
      >

        <button
          type="button"
          data-ai-command="Покажи список товаров"
        >
          📦 Товары
        </button>

        <button
          type="button"
          data-ai-command="Покажи категории"
        >
          🗂 Категории
        </button>

        <button
          type="button"
          data-ai-command="Поставь цену выбранному товару"
        >
          💰 Цена
        </button>

        <button
          type="button"
          data-ai-command="Создай новый товар"
        >
          ➕ Создать
        </button>

      </div>


      <form
        class="ai-admin-input-wrap"
        id="aiAdminForm"
      >

        <textarea
          id="aiAdminInput"
          class="ai-admin-input"
          rows="1"
          maxlength="4000"
          placeholder="Напиши команду для IRoom AI..."
        ></textarea>

        <button
          class="ai-admin-send"
          id="aiAdminSend"
          type="submit"
          aria-label="Отправить"
        >
          ➤
        </button>

      </form>

    </section>

  </div>


  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>

    const tg =
      window.Telegram?.WebApp || null;

    if(tg){

      tg.ready();

      tg.expand();

      try{
        tg.setHeaderColor("#050505");
        tg.setBackgroundColor("#050505");
      }catch{}

    }


    /* =====================================================
       CONFIG
    ====================================================== */

    const ADMIN_IDS =
      new Set([
        "5082864281",
        "5975037118"
      ]);


    let currentUser = null;

    let currentTab =
      "orders";

    let products = [];

    let categories = [];

    let orders = [];

    let currentProduct = null;


    /* =====================================================
       TELEGRAM
    ====================================================== */

    function getInitData(){

      return String(
        tg?.initData || ""
      );

    }


    function telegramUser(){

      return (
        tg?.initDataUnsafe?.user ||
        null
      );

    }


    function isAdmin(){

      const user =
        telegramUser();

      return Boolean(
        user &&
        ADMIN_IDS.has(
          String(user.id)
        )
      );

    }


    /* =====================================================
       API
    ====================================================== */

    async function api(
      url,
      options = {}
    ){

      const response =
        await fetch(
          url,
          {
            ...options,

            headers:{
              "Content-Type":
                "application/json",

              "x-telegram-init-data":
                getInitData(),

              ...(options.headers || {})
            }
          }
        );


      let data = {};

      try{
        data =
          await response.json();
      }catch{}


      if(!response.ok){

        throw new Error(
          data.error ||
          "Ошибка запроса"
        );

      }


      return data;

    }


    /* =====================================================
       HELPERS
    ====================================================== */

    function esc(value){

      return String(
        value ?? ""
      )
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

    }


    function money(value){

      const number =
        Number(value) || 0;

      return number
        .toLocaleString(
          "ru-RU"
        )
        .replaceAll(

    function toast(message){

      const element =
        document.getElementById(
          "toast"
        );

      if(!element){
        return;
      }

      element.textContent =
        String(message || "");

      element.classList.add(
        "show"
      );

      clearTimeout(
        window.__iroomToast
      );

      window.__iroomToast =
        setTimeout(
          () => {
            element.classList.remove(
              "show"
            );
          },
          2200
        );

    /* =====================================================
       SAVE PRODUCT
    ====================================================== */

    async function saveProduct(){

      const name =
        document
          .getElementById(
            "productName"
          )
          ?.value
          .trim();


      const price =
        Number(
          document
            .getElementById(
              "productPrice"
            )
            ?.value
        );


      const oldPriceRaw =
        document
          .getElementById(
            "productOldPrice"
          )
          ?.value;


      const oldPrice =
        oldPriceRaw === ""
          ? null
          : Number(
              oldPriceRaw
            );


      const image =
        document
          .getElementById(
            "productImage"
          )
          ?.value
          .trim();


      const description =
        document
          .getElementById(
            "productDescription"
          )
          ?.value
          .trim();


      const categoryId =
        document
          .getElementById(
            "productCategory"
          )
          ?.value || null;


      const stockRaw =
        document
          .getElementById(
            "productStock"
          )
          ?.value;


      const stock =
        stockRaw === ""
          ? null
          : Number(
              stockRaw
            );


      if(!name){

        toast(
          "Введите название товара"
        );

        return;

      }


      if(
        !Number.isFinite(price) ||
        price < 0
      ){

        toast(
          "Введите корректную цену"
        );

        return;

      }


      const button =
        document
          .getElementById(
            "saveProductBtn"
          );


      if(button){
        button.disabled =
          true;

        button.textContent =
          "Сохраняем...";
      }


      try{

        const payload = {

          name,

          price,

          old_price:
            Number.isFinite(
              oldPrice
            )
              ? oldPrice
              : null,

          image,

          description,

          category_id:
            categoryId,

          stock:
            Number.isFinite(
              stock
            )
              ? stock
              : null

        };


        if(currentProduct){

          await api(
            `/api/admin/products/${encodeURIComponent(
              currentProduct.id
            )}`,
            {
              method:"PUT",

              body:
                JSON.stringify(
                  payload
                )
            }
          );


          toast(
            "Товар обновлён"
          );

        }else{

          await api(
            "/api/admin/products",
            {
              method:"POST",

              body:
                JSON.stringify(
                  payload
                )
            }
          );


          toast(
            "Товар создан"
          );

        }


        await loadProducts();


        document
          .getElementById(
            "productEditor"
          )
          ?.remove();


        currentProduct =
          null;


        if(
          currentTab ===
          "products"
        ){

          renderProducts(
            document.getElementById(
              "content"
            )
          );

        }

      }catch(error){

        toast(
          error.message ||
          "Не удалось сохранить товар"
        );

      }finally{

        if(button){
          button.disabled =
            false;
        }

      }

    }

          }
        );

    }


    /* =====================================================
       SETTINGS
    ====================================================== */

    function renderSettings(container){

      container.innerHTML = `

        <div class="panel">

          <div class="panel-title">
            Настройки магазина
          </div>

          <div class="panel-subtitle">
            Основные настройки IRoom.
          </div>

        </div>


        <div class="panel">

          <div class="form-group">

            <label class="form-label">
              Название магазина
            </label>

            <input
              id="shopName"
              class="form-input"
              value="IRoom"
            >

          </div>


          <div class="form-group">

            <label class="form-label">
              Описание
            </label>

            <textarea
              id="shopDescription"
              class="form-textarea"
              placeholder="Описание магазина..."
            ></textarea>

          </div>


          <div class="form-group">

            <label class="form-label">
              Менеджер
            </label>

            <input
              id="managerUsername"
              class="form-input"
              placeholder="@manager"
            >

          </div>


          <div class="form-group">

            <label class="form-label">
              Telegram-канал
            </label>

            <input
              id="channelUsername"
              class="form-input"
              placeholder="@channel"
            >

          </div>


          <button
            id="saveSettingsBtn"
            class="save-btn"
            type="button"
          >
            Сохранить настройки
          </button>

        </div>


        <div class="panel">

          <div class="panel-title">
            Администраторы
          </div>

          <div class="panel-subtitle">
            Оба администратора имеют одинаковые права.
          </div>


          <div
            style="
              display:grid;
              gap:8px;
              margin-top:13px;
            "
          >

            <div
              style="
                padding:12px;
                border-radius:12px;
                background:#151518;
              "
            >
              5082864281
            </div>


            <div
              style="
                padding:12px;
                border-radius:12px;
                background:#151518;
              "
            >
              5975037118
            </div>

          </div>

        </div>


        <div class="panel">

          <div class="panel-title">
            IRoom AI
          </div>

          <div class="panel-subtitle">
            ИИ может работать с каталогом прямо из
            админ-панели.
          </div>


          <button
            id="settingsAIButton"
            class="ai-admin-open"
            style="
              width:100%;
              justify-content:center;
              margin-top:13px;
            "
            type="button"
          >

            <span class="ai-admin-open-icon">
              ✦
            </span>

            <span>
              Открыть IRoom AI
            </span>

          </button>

        </div>

      `;


      document
        .getElementById(
          "settingsAIButton"
        )
        ?.addEventListener(
          "click",
          openAdminAI
        );


      document
        .getElementById(
          "saveSettingsBtn"
        )
        ?.addEventListener(
          "click",
          async () => {

            const name =
              document
                .getElementById(
                  "shopName"
                )
                ?.value
                .trim() || "IRoom";


            const description =
              document
                .getElementById(
                  "shopDescription"
                )
                ?.value
                .trim() || "";


            const manager =
              document
                .getElementById(
                  "managerUsername"
                )
                ?.value
                .trim() || "";


            const channel =
              document
                .getElementById(
                  "channelUsername"
                )
                ?.value
                .trim() || "";


            try{

              await api(
                "/api/admin/settings",
                {
                  method:"POST",

                  body:
                    JSON.stringify({

                      shop_name:
                        name,

                      shop_description:
                        description,

                      manager_username:
                        manager,

                      channel_username:
                        channel

                    })
                }
              );


              toast(
                "Настройки сохранены"
              );

            }catch(error){

              toast(
                error.message ||
                "Ошибка сохранения"
              );

            }

          }
        );

    }


    /* =====================================================
       IROOM AI
    ====================================================== */

    let aiAdminHistory = [];


    function openAdminAI(){

      const overlay =
        document.getElementById(
          "aiAdminOverlay"
        );


      if(!overlay){
        return;
      }


      overlay.classList.remove(
        "hidden"
      );

      overlay.classList.add(
        "active"
      );


      const messages =
        document.getElementById(
          "aiAdminMessages"
        );


      if(
        messages &&
        !messages.children.length
      ){

        appendAdminAIMessage(
          "assistant",
          "Привет! Я IRoom AI.\n\nЯ могу помочь управлять магазином: посмотреть товары, изменить цены или создать новый товар."
        );

      }


      setTimeout(
        () => {

          document
            .getElementById(
              "aiAdminInput"
            )
            ?.focus();

        },
        100
      );

    }


    function closeAdminAI(){

      const overlay =
        document.getElementById(
          "aiAdminOverlay"
        );


      if(!overlay){
        return;
      }


      overlay.classList.remove(
        "active"
      );

      overlay.classList.add(
        "hidden"
      );

    }


    function appendAdminAIMessage(
      role,
      text
    ){

      const messages =
        document.getElementById(
          "aiAdminMessages"
        );


      if(!messages){
        return;
      }


      const element =
        document.createElement(
          "div"
        );


      element.className =
        `ai-admin-message ${role}`;


      element.textContent =
        String(
          text || ""
        );


      messages.appendChild(
        element
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    function setAdminAITyping(
      visible
    ){

      const messages =
        document.getElementById(
          "aiAdminMessages"
        );


      if(!messages){
        return;
      }


      const old =
        document.getElementById(
          "aiAdminTyping"
        );


      if(!visible){

        old?.remove();

        return;

      }


      if(old){
        return;
      }


      const element =
        document.createElement(
          "div"
        );


      element.id =
        "aiAdminTyping";


      element.className =
        "ai-admin-message assistant";


      element.innerHTML = `
        <span
          style="
            display:inline-flex;
            gap:4px;
          "
        >
          <span
            style="
              width:5px;
              height:5px;
              border-radius:50%;
              background:#888;
              animation:aiDot 1s infinite;
            "
          ></span>

          <span
            style="
              width:5px;
              height:5px;
              border-radius:50%;
              background:#888;
              animation:aiDot 1s .15s infinite;
            "
          ></span>

          <span
            style="
              width:5px;
              height:5px;
              border-radius:50%;
              background:#888;
              animation:aiDot 1s .3s infinite;
            "
          ></span>
        </span>
      `;


      messages.appendChild(
        element
      );


      messages.scrollTop =
        messages.scrollHeight;

    }


    async function sendAdminAIMessage(
      forcedText = null
    ){

      const input =
        document.getElementById(
          "aiAdminInput"
        );


      const send =
        document.getElementById(
          "aiAdminSend"
        );


      if(!input){
        return;
      }


      const text =
        String(
          forcedText !== null
            ? forcedText
            : input.value
        ).trim();


      if(!text){
        return;
      }


      if(send){
        send.disabled =
          true;
      }


      if(forcedText === null){
        input.value = "";
      }


      appendAdminAIMessage(
        "user",
        text
      );


      aiAdminHistory.push({

        role:"user",

        content:text

      });


      setAdminAITyping(
        true
      );


      try{

        const response =
          await fetch(
            "/api/ai/chat",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "x-telegram-init-data":
                  getInitData()
              },

              body:
                JSON.stringify({

                  message:
                    text,

                  history:
                    aiAdminHistory
                      .slice(-12)

                })
            }
          );


        let data = {};


        try{

          data =
            await response.json();

        }catch{

          data = {};

        }


        if(!response.ok){

          throw new Error(
            data.error ||
            "IRoom AI вернул ошибку."
          );

        }


        const answer =
          data.reply ||
          data.message ||
          "Готово.";


        setAdminAITyping(
          false
        );


        appendAdminAIMessage(
          "assistant",
          answer
        );


        aiAdminHistory.push({

          role:"assistant",

          content:
            String(answer)

        });


        /*
         * Если AI что-либо изменил
         * в каталоге — обновляем его
         * без перезагрузки страницы.
         */

        if(
          data.changed ||
          data.action ===
            "create_product" ||
          data.action ===
            "update_product" ||
          data.action ===
            "set_price"
        ){

          await loadProducts();


          if(
            currentTab ===
            "products"
          ){

            renderProducts(
              document.getElementById(
                "content"
              )
            );

          }


          toast(
            "Каталог обновлён"
          );

        }

      }catch(error){

        setAdminAITyping(
          false
        );


        appendAdminAIMessage(
          "assistant",
          error.message ||
          "Не удалось связаться с IRoom AI."
        );

      }finally{

        if(send){
          send.disabled =
            false;
        }


        input.focus();

      }

    }


    /* =====================================================
       AI EVENTS
    ====================================================== */

    document
      .getElementById(
        "aiAdminBtn"
      )
      ?.addEventListener(
        "click",
        openAdminAI
      );


    document
      .getElementById(
        "aiAdminClose"
      )
      ?.addEventListener(
        "click",
        closeAdminAI
      );


    document
      .getElementById(
        "aiAdminBackdrop"
      )
      ?.addEventListener(
        "click",
        closeAdminAI
      );


    document
      .getElementById(
        "aiAdminForm"
      )
      ?.addEventListener(
        "submit",
        event => {

          event.preventDefault();

          sendAdminAIMessage();

        }
      );


    document
      .getElementById(
        "aiAdminInput"
      )
      ?.addEventListener(
        "keydown",
        event => {

          if(
            event.key ===
              "Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();

            sendAdminAIMessage();

          }

        }
      );


    document
      .querySelectorAll(
        "[data-ai-command]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const command =
                button.dataset.aiCommand;


              if(command){

                sendAdminAIMessage(
                  command
                );

              }

            }
          );

        }
      );


    /* =====================================================
       AI ANIMATION
    ====================================================== */

    const aiStyle =
      document.createElement(
        "style"
      );


    aiStyle.textContent = `

      @keyframes aiDot{

        0%,100%{
          transform:translateY(0);
          opacity:.35;
        }

        50%{
          transform:translateY(-3px);
          opacity:1;
        }

      }

    `;


    document.head.appendChild(
      aiStyle
    );


    /* =====================================================
       START ADMIN
    ====================================================== */

    async function initAdmin(){

      try{

        await checkAccess();

        await loadAll();

        renderTab();

      }catch(error){

        console.error(
          "IRoom Admin:",
          error
        );


        const login =
          document.getElementById(
            "login"
          );


        if(login){

          login.innerHTML = `

            <div
              class="login-card"
              style="text-align:center"
            >

              <div
                class="login-logo"
                style="
                  margin-left:auto;
                  margin-right:auto;
                  background:#ff3d5a;
                "
              >
                !
              </div>

              <div
                class="login-title"
              >
                Доступ запрещён
              </div>

              <div
                class="login-subtitle"
              >
                ${esc(
                  error.message ||
                  "Не удалось открыть админ-панель."
                )}
              </div>

            </div>

          `;

        }

      }

    }


    initAdmin();

  </script>
