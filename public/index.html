<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#070709">

  <title>IRoom</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header class="store-header">

    <button
      id="storeLogo"
      class="logo"
      type="button"
      aria-label="На главную"
    >
      <span class="logo-pink">IR</span><span class="logo-white">oom</span>
    </button>

    <button
      id="searchButton"
      class="search-button"
      type="button"
      aria-label="Поиск"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="M16 16L21 21"></path>
      </svg>
    </button>

  </header>


  <div id="searchBox" class="search-box">

    <div class="search-box-inner">

      <input
        id="searchInput"
        type="search"
        placeholder="Поиск товара..."
        autocomplete="off"
        enterkeyhint="search"
      >

      <button
        id="closeSearch"
        class="search-close"
        type="button"
        aria-label="Закрыть поиск"
      >
        ×
      </button>

    </div>

  </div>


  <main id="homePage" class="home-page">

    <section class="hero">

      <div class="hero-content">

        <span class="hero-label">IROOM</span>

        <h1>
          Техника Apple<br>
          в одном месте
        </h1>

        <p>
          Актуальные модели, цвета<br>
          и конфигурации
        </p>

      </div>

    </section>


    <section
      id="searchResultsSection"
      class="content-section hidden"
    >

      <div class="section-heading">

        <div>
          <span class="section-label">ПОИСК</span>
          <h2>Результаты</h2>
        </div>

      </div>

      <div
        id="searchResults"
        class="catalog-grid"
      ></div>

    </section>


    <section id="newSection" class="content-section">

      <div class="section-heading">

        <div>
          <span class="section-label">НОВИНКИ</span>
          <h2>Новинки</h2>
        </div>

      </div>

      <div
        id="newProducts"
        class="new-products"
      ></div>

    </section>


    <section id="categoriesSection" class="content-section">

      <div class="section-heading">

        <div>
          <span class="section-label">КАТЕГОРИИ</span>
          <h2>Каталог</h2>
        </div>

      </div>

      <div
        id="categories"
        class="categories"
      ></div>

    </section>


    <section id="catalogSection" class="content-section">

      <div class="section-heading">

        <div>
          <span class="section-label">IROOM</span>
          <h2>Все товары</h2>
        </div>

      </div>

      <div
        id="catalog"
        class="catalog-grid"
      ></div>

    </section>

  </main>


  <main id="productPage" class="product-page hidden">

    <button
      id="backButton"
      class="back-button"
      type="button"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>

      <span>Назад</span>
    </button>


    <section class="product-detail">

      <div class="product-detail-image">

        <img
          id="productImage"
          src=""
          alt=""
        >

        <div
          id="productImagePlaceholder"
          class="product-image-placeholder"
        >
          <span><b>IR</b>oom</span>
        </div>

      </div>


      <div class="product-detail-info">

        <div
          id="productCategory"
          class="product-category"
        ></div>

        <h1
          id="productName"
          class="product-title"
        ></h1>

        <div
          id="productMeta"
          class="product-meta"
        ></div>

        <div
          id="productPrice"
          class="product-price"
        ></div>

        <div class="product-actions">

          <button
            id="bookButton"
            class="primary-button"
            type="button"
          >
            Забронировать
          </button>

          <button
            id="consultButton"
            class="secondary-button"
            type="button"
          >
            Проконсультироваться
          </button>

        </div>

      </div>

    </section>

  </main>


  <footer class="store-footer">

    <div class="store-footer-brand">
      <span class="footer-pink">IR</span><span>oom</span>
    </div>

    <div class="store-footer-links">

      <a
        href="https://t.me/iroom_market"
        class="store-footer-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Канал</span>
        <strong>@iroom_market</strong>
      </a>

      <a
        href="https://t.me/iroom_24"
        class="store-footer-link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span>Связь</span>
        <strong>@iroom_24</strong>
      </a>

    </div>

    <div class="store-footer-copy">
      IRoom · Apple техника
    </div>

  </footer>


  <button
    id="adminBottomButton"
    class="admin-bottom-button hidden"
    type="button"
  >
    Админ-панель
  </button>


  <div id="toast" class="toast"></div>


  <script src="/app.js"></script>

</body>
</html>
