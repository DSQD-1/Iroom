<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>IRoom</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- =========================
       STARTUP SCREEN
  ========================== -->

  <div id="startupScreen">

    <div class="startup-content">

      <div class="startup-logo">
        <span class="pink">IR</span><span class="white">oom</span>
      </div>

      <div class="startup-loader"></div>

    </div>

  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="topbar">

      <button
        id="logoButton"
        class="logo-button"
        type="button"
        aria-label="IRoom"
      >
        <span class="logo-pink">IR</span><span class="logo-white">oom</span>
      </button>

      <button
        id="searchButton"
        class="search-button"
        type="button"
        aria-label="Поиск"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M16 16L21 21"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- =========================
         SEARCH
    ========================== -->

    <div
      id="searchPanel"
      class="search-panel hidden"
    >

      <div class="search-panel-inner">

        <button
          id="closeSearchButton"
          class="search-close"
          type="button"
          aria-label="Закрыть поиск"
        >
          ×
        </button>

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Поиск товара"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

      </div>

      <div id="searchResults"></div>

    </div>


    <!-- =========================
         HOME
    ========================== -->

    <main
      id="homePage"
      class="page"
    >

      <!-- =========================
           HERO
      ========================== -->

      <section class="hero">

        <div class="hero-content">

          <div class="hero-label">
            IRoom
          </div>

          <h1>
            Техника,
            <br>
            которую хочется.
          </h1>

          <p>
            Актуальные устройства
            и лучшие варианты
            в одном месте.
          </p>

          <button
            id="heroCatalogButton"
            class="hero-button"
            type="button"
          >
            Смотреть каталог
          </button>

        </div>

      </section>


      <!-- =========================
           NEW PRODUCTS
      ========================== -->

      <section
        id="newSection"
        class="section"
      >

        <div class="section-heading">

          <div>

            <div class="section-kicker">
              IRoom
            </div>

            <h2>
              Новинки
            </h2>

          </div>

        </div>

        <div
          id="newProducts"
          class="products-row"
        ></div>

      </section>


      <!-- =========================
           CATEGORIES
      ========================== -->

      <section
        id="categoriesSection"
        class="section categories-section"
      >

        <div class="section-heading">

          <div>

            <div class="section-kicker">
              Каталог
            </div>

            <h2>
              Категории
            </h2>

          </div>

        </div>

        <div
          id="categories"
          class="categories-row"
        ></div>

      </section>


      <!-- =========================
           CATALOG
      ========================== -->

      <section
        id="catalogSection"
        class="section catalog-section"
      >

        <div class="section-heading">

          <div>

            <div class="section-kicker">
              IRoom Store
            </div>

            <h2>
              Каталог
            </h2>

          </div>

        </div>

        <div
          id="catalog"
          class="catalog-grid"
        ></div>

      </section>


      <!-- =========================
           FOOTER
      ========================== -->

      <footer class="footer">

        <div class="footer-logo">

          <span class="logo-pink">IR</span><span class="logo-white">oom</span>

        </div>

        <div class="footer-links">

          <a
            href="https://t.me/iroom_market"
            target="_blank"
            rel="noopener noreferrer"
          >
            Канал
          </a>

          <a
            href="https://t.me/iroom_24"
            target="_blank"
            rel="noopener noreferrer"
          >
            Связь
          </a>

        </div>

      </footer>

    </main>


    <!-- =========================
         PRODUCT PAGE
    ========================== -->

    <main
      id="productPage"
      class="page hidden"
    >

      <div class="product-page-header">

        <button
          id="productBackButton"
          class="back-button"
          type="button"
        >
          <span class="back-arrow">←</span>
          <span>Назад</span>
        </button>

      </div>

      <div
        id="productDetails"
        class="product-details"
      ></div>

    </main>


    <!-- =========================
         ADMIN BUTTON
    ========================== -->

    <button
      id="adminButton"
      class="admin-floating-button hidden"
      type="button"
    >
      Админ
    </button>


    <!-- =========================
         TOAST
    ========================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>


    <!-- =========================
         LEGACY LOADER
    ========================== -->

    <div
      id="loader"
      class="hidden"
      aria-hidden="true"
    ></div>

  </div>


  <!-- =========================
       APP JS
  ========================== -->

  <script src="/app.js"></script>


  <!-- =========================
       STARTUP LOGIC
  ========================== -->

  <script>
    (() => {
      const startup = document.getElementById("startupScreen");
      const app = document.getElementById("app");

      function showApp() {
        if (app) {
          app.classList.add("app-ready");
        }

        if (startup) {
          startup.classList.add("hidden");
        }
      }

      /*
       * Нормальное открытие после загрузки страницы.
       */
      window.addEventListener("load", () => {
        setTimeout(showApp, 350);
      });

      /*
       * Если API или app.js завис,
       * Mini App всё равно откроется.
       */
      setTimeout(showApp, 4000);
    })();
  </script>

</body>
</html>
