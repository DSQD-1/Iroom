<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>iroom</title>

  <meta
    name="theme-color"
    content="#000000"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <div id="app">

    <!-- HEADER -->
    <header class="header">

      <button
        class="header-menu"
        id="menuBtn"
        type="button"
        aria-label="Меню"
      >
        ☰
      </button>

      <div
        class="header-logo"
        id="headerLogo"
      >
        iroom
      </div>

      <button
        class="header-profile"
        id="profileBtn"
        type="button"
        aria-label="Профиль"
      >
        <span id="profileAvatar">
          👤
        </span>
      </button>

    </header>


    <!-- MAIN -->
    <main id="main">

      <!-- HOME -->
      <section
        id="homePage"
        class="page active"
      >

        <div
          id="homeContent"
          class="page-content"
        ></div>

      </section>


      <!-- CATALOG -->
      <section
        id="catalogPage"
        class="page"
      >

        <div
          id="catalogContent"
          class="page-content"
        ></div>

      </section>


      <!-- PRODUCT -->
      <section
        id="productPage"
        class="page"
      >

        <div
          id="productContent"
          class="page-content"
        ></div>

      </section>


      <!-- PROFILE -->
      <section
        id="profilePage"
        class="page"
      >

        <div
          id="profileContent"
          class="page-content"
        ></div>

      </section>


      <!-- CHECKOUT -->
      <section
        id="checkoutPage"
        class="page"
      >

        <div
          id="checkoutContent"
          class="page-content"
        ></div>

      </section>


      <!-- ORDER -->
      <section
        id="orderPage"
        class="page"
      >

        <div
          id="orderContent"
          class="page-content"
        ></div>

      </section>

    </main>


    <!-- BOTTOM NAV -->
    <nav
      class="bottom-nav"
      id="bottomNav"
    >

      <button
        type="button"
        data-nav="home"
      >
        <span>⌂</span>
        <small>Главная</small>
      </button>

      <button
        type="button"
        data-nav="catalog"
      >
        <span>⌕</span>
        <small>Каталог</small>
      </button>

      <button
        type="button"
        data-nav="profile"
      >
        <span>♙</span>
        <small>Профиль</small>
      </button>

    </nav>


    <!-- SIDE MENU -->
    <div
      id="menuOverlay"
      class="menu-overlay"
    ></div>

    <aside
      id="sideMenu"
      class="side-menu"
    >

      <div class="side-menu-header">

        <strong>iroom</strong>

        <button
          id="closeMenuBtn"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        id="sideMenuContent"
        class="side-menu-content"
      ></div>

    </aside>


    <!-- MODALS -->
    <div
      id="modalRoot"
      class="modal-root"
    ></div>


    <!-- TOAST -->
    <div
      id="toast"
      class="toast"
    ></div>

  </div>


  <!-- TELEGRAM WEB APP -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- APP -->
  <script src="/app.js"></script>

</body>
</html>
