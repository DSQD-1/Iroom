<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>IRoom — техника Apple</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- APP -->
  <div id="app">

    <!-- HEADER -->
    <header class="topbar">

      <button
        id="logoButton"
        class="logo"
        type="button"
        aria-label="IRoom"
      >
        <span class="logo-pink">IR</span><span class="logo-white">oom</span>
      </button>

      <button
        id="searchButton"
        class="icon-button"
        type="button"
        aria-label="Поиск"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M16 16L21 21"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- SEARCH -->
    <section id="searchPanel" class="search-panel" hidden>

      <div class="search-box">

        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="M16 16L21 21"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Поиск товара"
          autocomplete="off"
          enterkeyhint="search"
        />

        <button
          id="searchClose"
          type="button"
          aria-label="Закрыть поиск"
        >
          ×
        </button>

      </div>

    </section>


    <!-- HOME -->
    <main id="homePage" class="page">

      <!-- HERO -->
      <section class="hero">

        <div class="hero-content">

          <div class="hero-label">
            IROOM
          </div>

          <h1>
            Техника Apple<br />
            без лишнего.
          </h1>

          <p>
            Оригинальные устройства.<br />
            Подбор под ваши задачи.
          </p>

        </div>

      </section>


      <!-- NEW -->
      <section
        id="newProductsSection"
        class="content-section"
      >

        <div class="section-heading">

          <h2>Новинки</h2>

        </div>

        <div
          id="newProducts"
          class="products-slider"
        ></div>

      </section>


      <!-- CATEGORIES -->
      <section
        id="categoriesSection"
        class="content-section"
      >

        <div class="section-heading">

          <h2>Категории</h2>

        </div>

        <div
          id="categories"
          class="categories-list"
        ></div>

      </section>


      <!-- CATALOG -->
      <section
        id="catalogSection"
        class="content-section catalog-section"
      >

        <div class="section-heading">

          <h2 id="catalogTitle">
            Каталог
          </h2>

        </div>

        <div
          id="products"
          class="products-grid"
        ></div>

        <div
          id="emptyProducts"
          class="empty-state"
          hidden
        >
          <div class="empty-state-title">
            Ничего не найдено
          </div>

          <div class="empty-state-text">
            Попробуйте изменить запрос или выбрать другую категорию.
          </div>
        </div>

      </section>

    </main>


    <!-- PRODUCT PAGE -->
    <main
      id="productPage"
      class="page product-page"
      hidden
    >

      <div class="product-topbar">

        <button
          id="productBack"
          class="back-button"
          type="button"
        >
          <span>‹</span>
          Назад
        </button>

      </div>


      <div
        id="productContent"
        class="product-content"
      ></div>

    </main>


    <!-- ADMIN PAGE -->
    <main
      id="adminPage"
      class="page admin-page"
      hidden
    >

      <div class="product-topbar">

        <button
          id="adminBackButton"
          class="back-button"
          type="button"
        >
          <span>‹</span>
          Назад
        </button>

      </div>

      <div
        id="adminContent"
        class="admin-content"
      ></div>

    </main>


    <!-- FOOTER -->
    <footer
      id="storeFooter"
      class="footer"
    >

      <div class="footer-logo">
        <span class="logo-pink">IR</span><span class="logo-white">oom</span>
      </div>

      <div class="footer-links">

        <a
          href="https://t.me/iroom_market"
          target="_blank"
          rel="noopener noreferrer"
        >
          Канал
        </a>

        <a
          href="https://t.me/iroom_24"
          target="_blank"
          rel="noopener noreferrer"
        >
          Связь
        </a>

      </div>

    </footer>


    <!-- ADMIN BUTTON -->
    <button
      id="adminButton"
      class="admin-floating-button"
      type="button"
      hidden
    >
      Админ-панель
    </button>


    <!-- TOAST -->
    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>


    <!-- LOADER -->
    <div
      id="loader"
      class="loader-overlay"
      hidden
    >
      <div class="loader-spinner"></div>
    </div>

  </div>


  <!-- SCRIPTS -->
  <script src="/app.js"></script>
  <script src="/admin.js"></script>

</body>
</html>
