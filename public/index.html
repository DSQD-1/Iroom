<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#08080a">

  <title>IRoom</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="topbar">

      <div class="brand">
        <div class="logo" id="storeLogo">
          <span class="logo-pink">IR</span><span class="logo-white">oom</span>
        </div>
      </div>

      <button
        id="adminButton"
        class="admin-button hidden"
        type="button"
      >
        Админ
      </button>

    </header>


    <!-- SEARCH -->
    <section class="search-section">

      <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
          id="searchInput"
          type="search"
          placeholder="Поиск товаров"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

      </div>

    </section>


    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <div class="hero-label">
          IRoom
        </div>

        <h1>
          Техника,<br>
          которую хочется
        </h1>

        <p>
          Apple и другие устройства<br>
          в одном месте.
        </p>

      </div>

    </section>


    <!-- НОВИНКИ -->
    <section class="section">

      <div class="section-header">

        <h2>
          Новинки
        </h2>

        <div class="slider-controls">

          <button
            id="newPrev"
            type="button"
            aria-label="Предыдущие товары"
          >
            ‹
          </button>

          <button
            id="newNext"
            type="button"
            aria-label="Следующие товары"
          >
            ›
          </button>

        </div>

      </div>

      <div
        id="newProducts"
        class="new-products"
      ></div>

    </section>


    <!-- КАТЕГОРИИ -->
    <section class="section">

      <div class="section-header">

        <h2>
          Категории
        </h2>

      </div>

      <div
        id="categories"
        class="categories"
      ></div>

    </section>


    <!-- РЕЗУЛЬТАТЫ ПОИСКА -->
    <section
      id="searchResultsSection"
      class="section hidden"
    >

      <div class="section-header">

        <h2>
          Результаты поиска
        </h2>

      </div>

      <div
        id="searchResults"
        class="catalog"
      ></div>

    </section>


    <!-- КАТАЛОГ -->
    <section
      id="catalogSection"
      class="section"
    >

      <div class="section-header">

        <h2>
          Все товары
        </h2>

      </div>

      <div
        id="catalog"
        class="catalog"
      ></div>

    </section>


    <!-- СТРАНИЦА ТОВАРА -->
    <section
      id="productPage"
      class="product-page hidden"
    >

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        ← Назад
      </button>


      <div class="product-detail">

        <!-- ФОТО -->
        <div class="product-detail-image-wrap">

          <img
            id="productImage"
            class="product-detail-image"
            src=""
            alt=""
          >

        </div>


        <!-- ИНФОРМАЦИЯ -->
        <div class="product-detail-info">

          <div
            id="productCategory"
            class="product-category"
          ></div>


          <h1
            id="productName"
            class="product-detail-name"
          ></h1>


          <div
            id="productMeta"
            class="product-meta"
          ></div>


          <div
            id="productPrice"
            class="product-detail-price"
          ></div>


          <!-- ДЕЙСТВИЯ -->
          <div class="product-actions">

            <button
              id="bookButton"
              class="primary-button"
              type="button"
            >
              Забронировать
            </button>


            <button
              id="consultButton"
              class="secondary-button"
              type="button"
            >
              Проконсультироваться
            </button>

          </div>

        </div>

      </div>

    </section>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
  ></div>


  <!-- APP -->
  <script src="/app.js"></script>

</body>
</html>
