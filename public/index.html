<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <title>IRoom</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div id="app">

    <!-- =========================
         SHOP PAGE
    ========================== -->

    <main id="homePage" class="page active">

      <!-- HEADER -->

      <header class="topbar">

        <button
          id="logoButton"
          class="logo"
          type="button"
          aria-label="IRoom"
        >
          <span class="logo-pink">IR</span><span>oom</span>
        </button>

        <button
          id="searchButton"
          class="icon-button"
          type="button"
          aria-label="Поиск"
        >
          <svg
            width="21"
            height="21"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>
        </button>

      </header>


      <!-- SEARCH -->

      <section
        id="searchPanel"
        class="search-panel hidden"
      >

        <div class="search-input-wrap">

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4-4"></path>
          </svg>

          <input
            id="searchInput"
            type="search"
            placeholder="Поиск товара"
            autocomplete="off"
          >

          <button
            id="closeSearchButton"
            type="button"
            aria-label="Закрыть поиск"
          >
            ×
          </button>

        </div>

        <div
          id="searchResults"
          class="search-results"
        ></div>

      </section>


      <!-- HERO -->

      <section class="hero">

        <div class="hero-content">

          <div class="hero-label">
            IRoom
          </div>

          <h1>
            Техника Apple<br>
            в IRoom
          </h1>

          <p>
            Оригинальные устройства.
            Актуальные модели.
            Быстрая связь с нами.
          </p>

          <button
            id="heroCatalogButton"
            class="hero-button"
            type="button"
          >
            Смотреть каталог
          </button>

        </div>

      </section>


      <!-- NEW PRODUCTS -->

      <section class="store-section">

        <div class="section-heading">

          <div>
            <span class="section-kicker">IRoom</span>
            <h2>Новинки</h2>
          </div>

        </div>

        <div
          id="newProducts"
          class="new-products-row"
        ></div>

      </section>


      <!-- CATEGORIES -->

      <section class="store-section categories-section">

        <div class="section-heading">

          <div>
            <span class="section-kicker">Каталог</span>
            <h2>Категории</h2>
          </div>

        </div>

        <div
          id="categories"
          class="categories-row"
        ></div>

      </section>


      <!-- CATALOG -->

      <section
        id="catalogSection"
        class="store-section catalog-section"
      >

        <div class="section-heading">

          <div>
            <span class="section-kicker">IRoom</span>
            <h2>Все товары</h2>
          </div>

        </div>

        <div
          id="catalog"
          class="catalog-grid"
        ></div>

      </section>


      <!-- FOOTER -->

      <footer class="store-footer">

        <div class="footer-logo">
          <span class="logo-pink">IR</span><span>oom</span>
        </div>

        <div class="footer-links">

          <a
            href="https://t.me/iroom_market"
            target="_blank"
            rel="noopener"
          >
            Канал
          </a>

          <a
            href="https://t.me/iroom_24"
            target="_blank"
            rel="noopener"
          >
            Связь
          </a>

        </div>

        <div class="footer-copy">
          IRoom © 2026
        </div>

      </footer>


      <!-- ADMIN BUTTON -->

      <button
        id="adminButton"
        class="admin-floating-button hidden"
        type="button"
      >
        Админ-панель
      </button>

    </main>


    <!-- =========================
         PRODUCT PAGE
    ========================== -->

    <main
      id="productPage"
      class="page hidden"
    >

      <header class="product-header">

        <button
          id="productBackButton"
          class="back-button"
          type="button"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M15 18l-6-6 6-6"></path>
          </svg>

          <span>Назад</span>
        </button>

      </header>


      <section
        id="productDetails"
        class="product-details"
      ></section>

    </main>


    <!-- TOAST -->

    <div
      id="toast"
      class="toast"
      aria-live="polite"
    ></div>


    <!-- LOADER -->

    <div
      id="loader"
      class="loader-overlay hidden"
    >

      <div class="loader-spinner"></div>

    </div>

  </div>


  <script src="/app.js"></script>

</body>
</html>
