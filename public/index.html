<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>IRoom</title>

  <link rel="stylesheet" href="/style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

  <div id="app">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

      <button
        class="header-button"
        id="menuButton"
        aria-label="Открыть меню"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>


      <button
        class="logo"
        id="homeButton"
        aria-label="IRoom"
      >
        <span>IR</span><b>oom</b>
      </button>


      <div class="header-right">

        <button
          class="header-button"
          id="searchButton"
          aria-label="Поиск"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="M16 16L21 21"></path>
          </svg>
        </button>


        <button
          class="header-button cart-button"
          id="cartButton"
          aria-label="Корзина"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"></path>
            <circle cx="10" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>

          <i id="cartBadge">0</i>

        </button>


        <button
          class="header-button"
          id="profileButton"
          aria-label="Мои заказы"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 21c.7-4 3-6 7-6s6.3 2 7 6"></path>
          </svg>
        </button>

      </div>

    </header>


    <!-- =========================
         SEARCH
    ========================== -->

    <div
      class="search-container"
      id="searchContainer"
    >

      <div class="search-box">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="M16 16L21 21"></path>
        </svg>

        <input
          id="globalSearch"
          type="search"
          placeholder="Поиск товаров"
          autocomplete="off"
        >

        <button id="clearSearch">
          ×
        </button>

      </div>

    </div>


    <!-- =========================
         MAIN
    ========================== -->

    <main id="screen"></main>


    <!-- =========================
         DRAWER
    ========================== -->

    <div
      class="drawer"
      id="drawer"
      aria-hidden="true"
    >

      <div
        class="drawer-backdrop"
        id="drawerBackdrop"
      ></div>


      <aside class="drawer-panel">

        <div class="drawer-header">

          <div class="logo drawer-logo">
            <span>IR</span><b>oom</b>
          </div>

          <button
            class="drawer-close"
            id="closeDrawer"
          >
            ×
          </button>

        </div>


        <div class="drawer-menu">

          <button
            class="drawer-item"
            data-route="home"
          >
            <span class="drawer-icon">⌂</span>
            <span>Главная</span>
          </button>


          <button
            class="drawer-item"
            data-route="catalog"
          >
            <span class="drawer-icon">▦</span>
            <span>Каталог</span>
          </button>


          <button
            class="drawer-item"
            data-route="orders"
          >
            <span class="drawer-icon">▣</span>
            <span>Мои заказы</span>
          </button>


          <button
            class="drawer-item"
            data-route="cart"
          >
            <span class="drawer-icon">🛒</span>
            <span>Корзина</span>
            <em id="drawerBadge">0</em>
          </button>


          <div class="drawer-divider"></div>


          <div class="drawer-label">
            КАТЕГОРИИ
          </div>


          <div id="drawerCategories"></div>


          <div class="drawer-divider"></div>


          <a
            class="drawer-item"
            href="https://t.me/iroom_24"
            target="_blank"
          >
            <span class="drawer-icon">◉</span>
            <span>Связаться с менеджером</span>
          </a>


          <a
            class="drawer-item"
            href="https://t.me/iroom_market"
            target="_blank"
          >
            <span class="drawer-icon">◎</span>
            <span>Канал IRoom</span>
          </a>

        </div>

      </aside>

    </div>


    <!-- =========================
         TOAST
    ========================== -->

    <div
      class="toast"
      id="toast"
    ></div>

  </div>


  <script src="/app.js"></script>

</body>
</html>
