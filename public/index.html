<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#070707"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="format-detection"
    content="telephone=no"
  >

  <title>IRoom — техника</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <script
    src="https://telegram.org/js/telegram-web-app.js"
  ></script>
</head>

<body>

  <!-- =====================================================
       APP
  ====================================================== -->

  <div
    id="app"
    class="app"
  >

    <!-- ===================================================
         HEADER
    ==================================================== -->

    <header
      class="header"
      id="header"
    >

      <div class="header-left">

        <button
          id="menuButton"
          class="header-button"
          type="button"
          aria-label="Меню"
        >
          <span></span>
          <span></span>
        </button>

      </div>

      <button
        id="homeButton"
        class="logo"
        type="button"
        aria-label="IRoom"
      >
        <span class="logo-main">
          IRoom
        </span>

        <span class="logo-dot">
          •
        </span>
      </button>

      <div class="header-right">

        <button
          id="searchButton"
          class="header-button"
          type="button"
          aria-label="Поиск"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
            ></circle>

            <path
              d="M16 16L21 21"
            ></path>
          </svg>
        </button>

        <button
          id="cartButton"
          class="header-button cart-button"
          type="button"
          aria-label="Корзина"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M4 5h2l1.5 10h9.8L20 8H7"
            ></path>

            <circle
              cx="9"
              cy="19"
              r="1"
            ></circle>

            <circle
              cx="17"
              cy="19"
              r="1"
            ></circle>
          </svg>

          <span
            id="cartBadge"
            class="cart-badge hidden"
          >
            0
          </span>

        </button>

        <button
          id="profileButton"
          class="header-button"
          type="button"
          aria-label="Профиль"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="8"
              r="3.5"
            ></circle>

            <path
              d="M5 20c.8-3.4 3.1-5.2 7-5.2s6.2 1.8 7 5.2"
            ></path>
          </svg>
        </button>

      </div>

    </header>


    <!-- ===================================================
         SEARCH
    ==================================================== -->

    <div
      id="searchContainer"
      class="search-container"
    >

      <div class="search-box">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
          ></circle>

          <path
            d="M16 16L21 21"
          ></path>
        </svg>

        <input
          id="globalSearch"
          type="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Поиск по каталогу"
        >

        <button
          id="clearSearch"
          type="button"
          aria-label="Очистить"
        >
          ×
        </button>

      </div>

    </div>


    <!-- ===================================================
         MAIN
    ==================================================== -->

    <main
      id="screen"
      class="screen-root"
    ></main>


    <!-- ===================================================
         DRAWER
    ==================================================== -->

    <div
      id="drawer"
      class="drawer"
      aria-hidden="true"
    >

      <div
        id="drawerBackdrop"
        class="drawer-backdrop"
      ></div>

      <aside
        class="drawer-panel"
        aria-label="Меню IRoom"
      >

        <div class="drawer-header">

          <div>

            <span class="eyebrow">
              IROOM
            </span>

            <h2>
              Меню
            </h2>

          </div>

          <button
            id="closeDrawer"
            class="drawer-close"
            type="button"
            aria-label="Закрыть"
          >
            ×
          </button>

        </div>


        <nav class="drawer-nav">

          <button
            class="drawer-item drawer-main-item"
            data-route="home"
            data-action="home"
            type="button"
          >
            <span>
              Главная
            </span>

            <b>
              →
            </b>
          </button>

          <button
            class="drawer-item drawer-main-item"
            data-route="catalog"
            data-action="catalog"
            type="button"
          >
            <span>
              Каталог
            </span>

            <b>
              →
            </b>
          </button>

          <button
            class="drawer-item drawer-main-item"
            data-route="cart"
            data-action="cart"
            type="button"
          >
            <span>
              Корзина
            </span>

            <b>
              →
            </b>
          </button>

          <button
            class="drawer-item drawer-main-item"
            data-route="orders"
            data-action="orders"
            type="button"
          >
            <span>
              Мои заказы
            </span>

            <b>
              →
            </b>
          </button>

        </nav>


        <div class="drawer-section">

          <div class="drawer-section-title">
            Категории
          </div>

          <div
            id="drawerCategories"
            class="drawer-categories"
          ></div>

        </div>


        <div class="drawer-spacer"></div>


        <div class="drawer-manager">

          <span class="eyebrow">
            MANAGER
          </span>

          <strong>
            Нужна консультация?
          </strong>

          <p>
            Поможем подобрать
            нужное устройство.
          </p>

          <a
            id="managerLink"
            href="https://t.me/iroom_24"
            target="_blank"
            rel="noopener"
            class="drawer-manager-link"
          >
            Написать менеджеру
            <span>↗</span>
          </a>

        </div>


        <div class="drawer-footer">

          <a
            id="channelLink"
            href="https://t.me/iroom_market"
            target="_blank"
            rel="noopener"
          >
            Telegram-канал
          </a>

          <button
            id="adminLink"
            class="admin-link hidden"
            type="button"
          >
            Админ-панель
          </button>

        </div>

      </aside>

    </div>


    <!-- ===================================================
         TOAST
    ==================================================== -->

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>

  </div>


  <!-- =====================================================
       APP JS
  ====================================================== -->

  <script
    src="/app.js"
    defer
  ></script>

</body>
</html>
