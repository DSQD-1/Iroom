<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>IRoom</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div id="app">

    <!-- HEADER -->
    <header class="header">

      <button
        id="homeButton"
        class="logo"
        type="button"
        aria-label="На главную"
      >
        <span class="logo-pink">IR</span><span>oom</span>
      </button>

      <button
        id="searchButton"
        class="search-button"
        type="button"
        aria-label="Поиск"
      >
        <svg
          viewBox="0 0 24 24"
          width="21"
          height="21"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
      </button>

    </header>


    <!-- SEARCH -->
    <div
      id="searchPanel"
      class="search-panel"
      hidden
    >
      <div class="search-input-wrap">

        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="Поиск"
          autocomplete="off"
        >

        <button
          id="searchClose"
          type="button"
          aria-label="Закрыть поиск"
        >
          ×
        </button>

      </div>
    </div>


    <!-- HOME PAGE -->
    <main id="homePage">

      <!-- HERO -->
      <section class="hero">

        <div class="hero-content">

          <div class="hero-small">
            IROOM
          </div>

          <h1>
            Техника Apple
            <br>
            без лишнего.
          </h1>

          <p>
            Актуальные модели.
            <br>
            Честные цены.
          </p>

        </div>

      </section>


      <!-- NEW PRODUCTS -->
      <section class="section">

        <div class="section-head">
          <h2>Новинки</h2>
        </div>

        <div
          id="newProducts"
          class="products-row"
        >

          <div class="loading-card"></div>
          <div class="loading-card"></div>
          <div class="loading-card"></div>

        </div>

      </section>


      <!-- CATEGORIES -->
      <section class="section categories-section">

        <div class="section-head">
          <h2>Категории</h2>
        </div>

        <div
          id="categories"
          class="categories-row"
        ></div>

      </section>


      <!-- CATALOG -->
      <section class="section catalog-section">

        <div class="section-head">

          <h2 id="catalogTitle">
            Каталог
          </h2>

        </div>

        <div
          id="products"
          class="products-grid"
        ></div>

      </section>

    </main>


    <!-- PRODUCT PAGE -->
    <main
      id="productPage"
      class="product-page"
      hidden
    >

      <button
        id="backButton"
        class="back-button"
        type="button"
      >
        <span>‹</span>
        Назад
      </button>

      <div
        id="productContent"
        class="product-content"
      ></div>

    </main>


    <!-- ADMIN BUTTON -->
    <button
      id="adminButton"
      class="admin-floating"
      type="button"
      hidden
    >
      Админ-панель
    </button>


    <!-- ADMIN PAGE -->
    <main
      id="adminPage"
      class="admin-page"
      hidden
    >

      <div class="admin-page-inner">

        <button
          id="adminBackButton"
          class="back-button"
          type="button"
        >
          <span>‹</span>
          Назад
        </button>

        <div id="adminContent"></div>

      </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

      <div class="footer-logo">
        <span class="logo-pink">IR</span><span>oom</span>
      </div>

      <div class="footer-links">

        <a
          href="https://t.me/iroom_market"
          target="_blank"
          rel="noopener noreferrer"
        >
          Канал
        </a>

        <a
          href="https://t.me/iroom_24"
          target="_blank"
          rel="noopener noreferrer"
        >
          Связь
        </a>

      </div>

      <div class="footer-copy">
        © IRoom
      </div>

    </footer>


    <!-- TOAST -->
    <div
      id="toast"
      class="toast"
      hidden
    ></div>


    <!-- LOADER -->
    <div
      id="loader"
      class="loader-overlay"
      hidden
    >
      <div class="loader"></div>
    </div>

  </div>


  <!-- STORE APP -->
  <script src="/app.js"></script>

  <!-- ADMIN APP -->
  <script src="/admin.js"></script>

</body>
</html>
