<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

<meta
name=“viewport”
content=“width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no”

<meta
name=“theme-color”
content=”#050505”

  <title>IRoom</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #050505;
      --pink: #ff2d75;
      --white: #ffffff;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--white);
    }
    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Arial,
        sans-serif;
      overflow-x: hidden;
    }
    /* =========================
       START SCREEN
    ========================== */
    #startupScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at center,
          rgba(255, 45, 117, 0.08),
          transparent 38%
        ),
        #050505;
      opacity: 1;
      visibility: visible;
      transition:
        opacity .35s ease,
        visibility .35s ease;
    }
    #startupScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .startup-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }
    .startup-logo {
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 28px;
      animation:
        startupLogoIn .6s ease both;
    }
    .startup-logo .pink {
      color: var(--pink);
    }
    .startup-logo .white {
      color: #fff;
    }
    .startup-loader {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .12);
      border-top-color: var(--pink);
      animation:
        startupSpin .8s linear infinite;
    }
    @keyframes startupSpin {
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes startupLogoIn {
      from {
        opacity: 0;
        transform: scale(.94);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    /* =========================
       APP
    ========================== */
    #app {
      min-height: 100vh;
      background: #050505;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .35s ease;
    }
    #app.app-ready {
      opacity: 1;
      visibility: visible;
    }
    /* На случай старого loader из app.js */
    #loader {
      display: none !important;
    }
    /* =========================
       HIDDEN
    ========================== */
    .hidden {
      display: none !important;
    }
  </style>
  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>
<body>
  <!-- =========================
       STARTUP
  ========================== -->
  <div id="startupScreen">
    <div class="startup-content">
  <div class="startup-logo">
    <span class="pink">IR</span><span class="white">oom</span>
  </div>
  <div class="startup-loader"></div>
</div>
  </div>
  <!-- =========================
       APP
  ========================== -->
  <div id="app">
<!-- =========================
     HEADER
========================== -->
<header class="topbar">
  <button
    id="logoButton"
    class="logo-button"
    type="button"
    aria-label="IRoom"
  >
    <span class="logo-pink">IR</span><span class="logo-white">oom</span>
  </button>
  <button
    id="searchButton"
    class="search-button"
    type="button"
    aria-label="Поиск"
  >
    <svg
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <circle
        cx="11"
        cy="11"
        r="6.5"
        stroke="currentColor"
        stroke-width="1.8"
      />
      <path
        d="M16 16L21 21"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>
</header>
<!-- =========================
     SEARCH
========================== -->
<div
  id="searchPanel"
  class="search-panel hidden"
>
  <div class="search-panel-inner">
    <button
      id="closeSearchButton"
      class="search-close"
      type="button"
    >
      ×
    </button>
    <input
      id="searchInput"
      type="search"
      placeholder="Поиск товара"
      autocomplete="off"
    >
  </div>
  <div id="searchResults"></div>
</div>
<!-- =========================
     HOME
========================== -->
<main
  id="homePage"
  class="page"
>
  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <div class="hero-label">
        IRoom
      </div>
      <h1>
        Техника,
        <br>
        которую хочется.
      </h1>
      <p>
        Актуальные устройства
        и лучшие варианты
        в одном месте.
      </p>
      <button
        id="heroCatalogButton"
        class="hero-button"
        type="button"
      >
        Смотреть каталог
      </button>
    </div>
  </section>
  <!-- =========================
       NEW PRODUCTS
  ========================== -->
  <section
    id="newSection"
    class="section"
  >
    <div class="section-heading">
      <div>
        <div class="section-kicker">
          IRoom
        </div>
        <h2>
          Новинки
        </h2>
      </div>
    </div>
    <div
      id="newProducts"
      class="products-row"
    ></div>
  </section>
  <!-- =========================
       CATEGORIES
  ========================== -->
  <section
    class="section categories-section"
  >
    <div class="section-heading">
      <div>
        <div class="section-kicker">
          Каталог
        </div>
        <h2>
          Категории
        </h2>
      </div>
    </div>
    <div
      id="categories"
      class="categories-row"
    ></div>
  </section>
  <!-- =========================
       CATALOG
  ========================== -->
  <section
    id="catalogSection"
    class="section catalog-section"
  >
    <div class="section-heading">
      <div>
        <div class="section-kicker">
          IRoom Store
        </div>
        <h2>
          Каталог
        </h2>
      </div>
    </div>
    <div
      id="catalog"
      class="catalog-grid"
    ></div>
  </section>
  <!-- =========================
       FOOTER
  ========================== -->
  <footer class="footer">
    <div class="footer-logo">
      <span class="logo-pink">IR</span><span class="logo-white">oom</span>
    </div>
    <div class="footer-links">
      <a
        href="https://t.me/iroom_market"
        target="_blank"
        rel="noopener"
      >
        Канал
      </a>
      <a
        href="https://t.me/iroom_24"
        target="_blank"
        rel="noopener"
      >
        Связь
      </a>
    </div>
  </footer>
</main>
<!-- =========================
     PRODUCT
========================== -->
<main
  id="productPage"
  class="page hidden"
>
  <div class="product-page-header">
    <button
      id="productBackButton"
      class="back-button"
      type="button"
    >
      ←
      <span>Назад</span>
    </button>
  </div>
  <div
    id="productDetails"
    class="product-details"
  ></div>
</main>
<!-- =========================
     ADMIN BUTTON
========================== -->
<button
  id="adminButton"
  class="admin-floating-button hidden"
  type="button"
>
  Админ
</button>
<!-- =========================
     TOAST
========================== -->
<div
  id="toast"
  class="toast"
></div>
<!-- Старый loader оставляем для совместимости -->
<div
  id="loader"
  class="hidden"
></div>
  </div>
  <script src="/app.js"></script>
  <script>
    /*
     * Показываем магазин только после
     * того, как app.js начал работу.
     *
     * Даже если API сломан, через 4 секунды
     * пользователь не останется на заставке.
     */
    window.addEventListener("load", () => {
      const startup =
        document.getElementById("startupScreen");
      const app =
        document.getElementById("app");
      setTimeout(() => {
        app?.classList.add("app-ready");
        setTimeout(() => {
          startup?.classList.add("hidden");
        }, 100);
      }, 400);
    });
    /*
     * Аварийное открытие приложения.
     * Чтобы стартовый экран никогда
     * не завис навсегда.
     */
    setTimeout(() => {
      const startup =
        document.getElementById("startupScreen");
      const app =
        document.getElementById("app");
      if (
        startup &&
        !startup.classList.contains("hidden")
      ) {
        app?.classList.add("app-ready");
        startup.classList.add("hidden");
      }
    }, 4000);
  </script>
</body>
</html>
